<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame · Turni</title>
<link rel="icon" type="image/svg+xml" href="icona.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-org.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Turni">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --tile:#F4F4F5; --card:#fff; --ink:#111111; --muted:#6B6C70; --line:#E1E1E4;
  --water:#EB0089;--nero:#000000;--grigio:#818286; --water-soft:#FDE6F2; --red:#C8333A; --yellow:#EB0089; --ok:#2E7D4F; --warn:#B4541A;
  --f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fc:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tile);color:var(--ink);font:16px/1.45 var(--f)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

header{background:var(--nero);color:#fff;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1100px;margin:0 auto}
.top h1{font:600 1.15rem var(--fc);margin:0;letter-spacing:.02em;flex:1;color:#fff;border-left:1px solid #444;padding-left:12px}
.logo{height:36px;width:auto;display:block}
.logo-login{width:220px;max-width:100%;height:auto;display:block;margin:0 0 14px}
.top .chi{font-size:.85rem;opacity:.85}
.top button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;font-size:.85rem}
.corsia{height:3px;background:var(--water)}
nav{display:flex;gap:4px;max-width:1100px;margin:0 auto;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=true]{opacity:1;border-bottom-color:var(--yellow)}

main{max-width:1100px;margin:0 auto;padding:16px}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.barra .mese{font:700 1.25rem var(--fc);min-width:9.5em;text-align:center;text-transform:capitalize}
.spazio{flex:1}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--water);border-color:var(--water);color:#fff}
.btn.pic{padding:4px 10px;font-size:.88rem}
.btn.del{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}

.giorno{margin:22px 0 8px;font:700 1.05rem var(--fc);text-transform:capitalize;display:flex;align-items:baseline;gap:10px}
.giorno small{font:500 .85rem var(--f);color:var(--muted);text-transform:none}
.turno{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--water);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.turno.bozza{border-left-color:var(--grigio)}
.t-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.t-head b{font:700 1.15rem var(--fc)}
.t-ora{font-variant-numeric:tabular-nums;color:var(--muted)}
.stato{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--water-soft);color:var(--water)}
.stato.bozza{background:#EDF1F2;color:var(--muted)}
.turno.annullato{border-left-color:var(--red);background:#FAFAFA}
.turno.annullato .t-head b,.turno.annullato .t-ora{text-decoration:line-through;color:var(--muted)}
.stato.ann{background:#FBE9EA;color:var(--red)}
.ritiri{background:#FBE9EA;border:1px solid #F0C4C7;border-radius:10px;padding:10px 14px;margin:0 0 14px;color:var(--red)}
.ritiri .rit{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px;color:var(--ink)}
.griglia .fx button.sq{border-color:var(--water);background:var(--water);color:#fff}
.griglia .pisc .pieno{color:var(--ok);font-weight:700}
.griglia .pisc .manca{color:var(--warn);font-weight:700}
.pres{font-size:.88rem;margin:6px 0 0}
.pres.ok{color:var(--ok);font-weight:600}
.pres.da{color:var(--warn);font-weight:600}
.riga-pres{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.riga-pres input[type=time]{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
.riep{border-collapse:collapse;width:100%;font-size:.92rem}
.riep th,.riep td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.riep th:first-child,.riep td:first-child{text-align:left}
.riep th{color:var(--muted);font-weight:600}
.riep tfoot td{font-weight:700}
.imp{display:inline-flex;gap:2px;vertical-align:middle}
.imp i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.imp i.on{background:var(--water)}
.req{display:flex;gap:14px;margin:8px 0;font-size:.9rem;color:var(--muted)}
.req .pieno{color:var(--ok);font-weight:600}
.req .manca{color:var(--warn);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sedi{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sedi button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600}
.sedi button[aria-current=true]{background:var(--water);border-color:var(--water);color:#fff}
.sedi button small{font-weight:500;opacity:.75;margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tile);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:.9rem}
.chip .r{font:700 .72rem var(--fc);background:var(--water);color:#fff;border-radius:4px;padding:0 5px}
.chip .r.S{background:var(--grigio)}
.chip button{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:2px 6px;border-radius:99px}
.avvisi{margin:8px 0 0;padding:0;list-style:none;font-size:.86rem;color:var(--warn)}
.azioni{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{font-size:.88rem;color:var(--muted);margin-top:4px}

.lista{display:grid;gap:8px}
.riga{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.riga.off{opacity:.5}
.riga b{font:700 1.05rem var(--fc);min-width:8em}
.riga .info{color:var(--muted);font-size:.9rem;flex:1}
.stelle{color:var(--yellow);letter-spacing:1px}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}

.vuoto{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}

.griglia{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
.griglia table{border-collapse:collapse;font-size:.82rem}
.griglia th,.griglia td{border-bottom:1px solid var(--line);padding:4px;text-align:center}
.griglia th{font-weight:600;color:var(--muted);white-space:nowrap}
.griglia th.ev{color:var(--water);vertical-align:top}
.griglia .pisc{font-weight:500;font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.25}
.griglia .pisc .ore{font-variant-numeric:tabular-nums;white-space:nowrap}
.griglia th.ev::after{content:'';display:block;height:3px;background:var(--water);border-radius:2px;margin-top:2px}
.griglia .nome{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;padding:4px 10px;white-space:nowrap;z-index:1}
.fx{display:flex;gap:2px;justify-content:center}
.fx button{width:22px;height:22px;border:1px solid var(--line);border-radius:4px;background:#fff;font:700 .7rem var(--fc);color:#B5B6B9;padding:0}
.fx button.si{background:var(--ok);border-color:var(--ok);color:#fff}

dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:90vh;color:var(--ink)}
dialog::backdrop{background:rgba(18,48,58,.45)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font:700 1.15rem var(--fc);display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:16px 18px;overflow:auto;max-height:calc(90vh - 130px)}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.campo{display:grid;gap:4px;margin-bottom:12px}
.campo span{font-size:.85rem;font-weight:600;color:var(--muted)}
.campo input,.campo select,.campo textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spunta{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:500}
.spunta input{width:18px;height:18px}

.cand{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cand .n{font-weight:600}
.cand .d{grid-column:1;font-size:.84rem;color:var(--muted)}
.cand .d .ok{color:var(--ok);font-weight:600}
.cand .d .ko{color:var(--warn);font-weight:600}
.cand .b{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px}

.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.login .corpo{padding:22px}
.login h1{font:700 1.5rem var(--fc);margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:.92rem;display:none;z-index:50;max-width:92vw}
#toast.err{background:var(--red)}
@media (max-width:560px){ .due{grid-template-columns:1fr} .barra .mese{min-width:auto} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
// URL e chiave del database stanno nel file config.js (separato, così gli aggiornamenti di index.html non li cancellano)
const SUPABASE_URL = window.SUPABASE_URL || '';
const SUPABASE_KEY = window.SUPABASE_KEY || '';
let sb = null;
const RUOLI = { F:'Fotografo', S:'Stampatore', FS:'Foto e stampa' };
const S = { me:null, tab:'turni', mese:meseOggi(), collab:[], piscine:[], turni:[], ass:[], disp:[] };

// ---------- utilità ----------
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function meseOggi(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function oggi(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function limitiMese(ym){ const [y,m]=ym.split('-').map(Number); const ult=new Date(y,m,0).getDate(); return [ym+'-01', ym+'-'+pad(ult), ult]; }
function spostaMese(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+pad(m); }
function nomeMese(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'}); }
function nomeGiorno(d){ const [y,m,g]=d.split('-').map(Number); return new Date(y,m-1,g).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}); }
function hm(t){ return (t||'').slice(0,5); }
function stelle(n){ return '★'.repeat(n)+'☆'.repeat(5-n); }
function puntini(n){ return '<span class="imp" title="Importanza '+n+' su 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</span>'; }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', err?6000:2500); }
function errore(e){
  if(!e) return false;
  let m = e.message || String(e);
  if(e.code==='23505') m='Esiste già un elemento uguale (stesso nome, oppure stessa sede, data e ora).';
  if(e.code==='23503') m='Non si può eliminare: è usato in qualche turno. Puoi disattivarlo invece.';
  toast(m,true); return true;
}
const collabById = id => S.collab.find(c=>c.id===id);
const piscinaById = id => S.piscine.find(p=>p.id===id);

function minuti(s){ const [h,m]=hm(s).split(':').map(Number); return h*60+(m||0); }
// fascia di un turno: decide l'orario di inizio (prima delle 13 = mattina, dalle 13 = sera); oltre 8 ore li chiede tutti e due
function fasceTurno(t){ if(minuti(t.ora_fine)-minuti(t.ora_inizio)>480) return ['M','P']; return [hm(t.ora_inizio)<'13:00'?'M':'P']; }

// ---------- accesso ----------
async function avvio(){
  const msg = t => document.getElementById('app').innerHTML='<div class="login"><div class="corsia"></div><div class="corpo"><h1>Configurazione mancante</h1><p>'+t+'</p></div></div>';
  if(!window.supabase) return msg('La libreria del database non si è caricata. Controlla la connessione e ricarica la pagina.');
  if(!/^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) || !SUPABASE_KEY || SUPABASE_KEY.startsWith('INCOLLA')) return msg('Manca il file config.js oppure URL e chiave non sono compilati.');
  try{ sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ return msg('URL o chiave in config.js non validi: '+esc(e.message)); }
  const { data:{ session } } = await sb.auth.getSession();
  if(session) dopoLogin(session.user); else schermataLogin();
}

function schermataLogin(msg){
  document.getElementById('app').innerHTML = `
  <div class="login"><div class="corsia"></div><div class="corpo">
    <img class="logo-login" src="logo-nero.png" alt="Frame About You"><h1>Turni</h1><p>Accesso organizzatori</p>
    <form id="fl">
      <label class="campo"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
      <label class="campo"><span>Password</span><input name="pw" type="password" autocomplete="current-password" required></label>
      <button class="btn pri" style="width:100%">Entra</button>
    </form>
    ${msg?'<p style="color:var(--red);margin-top:12px">'+esc(msg)+'</p>':''}
  </div></div>`;
  document.getElementById('fl').onsubmit = async ev => {
    ev.preventDefault(); const f=ev.target;
    const { data, error } = await sb.auth.signInWithPassword({ email:f.email.value.trim(), password:f.pw.value });
    if(error) return schermataLogin('Email o password non corrette.');
    dopoLogin(data.user);
  };
}

async function esci(){ await sb.auth.signOut(); S.me=null; schermataLogin(); }

async function dopoLogin(user){
  const { data, error } = await sb.from('tp_collaboratori').select('*');
  if(errore(error)) return;
  S.me = (data||[]).find(c => (c.email||'').toLowerCase() === (user.email||'').toLowerCase() && c.attivo);
  if(!S.me){
    document.getElementById('app').innerHTML='<div class="login"><div class="corsia"></div><div class="corpo"><h1>Account non collegato</h1><p>Questa email non risulta tra i collaboratori attivi. Chiedi agli organizzatori di inserirla nella tua scheda.</p><button class="btn" onclick="esci()">Esci</button></div></div>';
    return;
  }
  if(!S.me.organizzatore){
    document.getElementById('app').innerHTML='<div class="login"><div class="corsia"></div><div class="corpo"><h1>Ciao '+esc(S.me.nome)+'</h1><p>L\'area collaboratori (disponibilità, turni e incassi) è in preparazione.</p><button class="btn" onclick="esci()">Esci</button></div></div>';
    return;
  }
  S.collab = data;
  await caricaTutto();
}

// ---------- dati ----------
async function caricaAnagrafiche(){
  const [c,p] = await Promise.all([
    sb.from('tp_collaboratori').select('*').order('nome'),
    sb.from('tp_piscine').select('*').order('nome')
  ]);
  if(errore(c.error)||errore(p.error)) return;
  S.collab=c.data; S.piscine=p.data;
}
async function caricaMese(){
  const [da,a] = limitiMese(S.mese);
  const [t,d] = await Promise.all([
    sb.from('tp_turni').select('*').gte('data',da).lte('data',a).order('data').order('ora_inizio'),
    sb.from('tp_disponibilita').select('*').gte('data',da).lte('data',a)
  ]);
  if(errore(t.error)||errore(d.error)) return;
  S.turni=t.data; S.disp=d.data; S.ass=[]; S.incassi=[]; S.spese=[]; S.compensi=[]; S.cand=[];
  const rt = await sb.from('tp_ritiri').select('*, tp_turni(data,ora_inizio,ora_fine,piscina_id)').eq('visto',false).order('creato');
  S.ritiri = rt.error ? [] : rt.data;
  if(S.turni.length){
    const ids=S.turni.map(x=>x.id);
    const [r,i,sp,kc] = await Promise.all([
      sb.from('tp_assegnazioni').select('*').in('turno_id', ids),
      sb.from('tp_candidature').select('*').in('turno_id', ids),
      sb.from('tp_incassi').select('*').in('turno_id', ids),
      sb.from('tp_spese').select('*').in('turno_id', ids)
    ]);
    if(errore(r.error)||errore(i.error)||errore(sp.error)||errore(kc.error)) return;
    S.cand=kc.data; S.ass=r.data; S.incassi=i.data; S.spese=sp.data; S.compensi=[];
    if(S.ass.length){
      const k = await sb.from('tp_compensi').select('*').in('assegnazione_id', S.ass.map(x=>x.id));
      if(errore(k.error)) return; S.compensi=k.data;
    }
  }
}
async function caricaTutto(){ await caricaAnagrafiche(); await caricaMese(); disegna(); }
async function ricarica(){ await caricaMese(); disegna(); }

// ---------- struttura ----------
function disegna(){
  const nNuovi=S.collab.filter(c=>c.nuovo).length;
  const tabs=[['turni','Turni'],['disponibilita','Candidature'],['collaboratori','Collaboratori'+(nNuovi?' ('+nNuovi+' nuovi)':'')],['piscine','Sedi'],['riepilogo','Riepilogo']];
  document.getElementById('app').innerHTML = `
  <header>
    <div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Turni</h1><span class="chi">${esc(S.me.nome)}</span><button onclick="esci()">Esci</button></div>
    <nav>${tabs.map(([k,l])=>`<button aria-current="${S.tab===k}" onclick="vai('${k}')">${l}</button>`).join('')}</nav>
    <div class="corsia"></div>
  </header>
  <main id="main"></main>`;
  ({turni:vistaTurni, disponibilita:vistaDisp, collaboratori:vistaCollab, piscine:vistaPiscine, riepilogo:vistaRiepilogo})[S.tab]();
}
function vai(k){ S.tab=k; disegna(); }
async function cambiaMese(n){ S.mese=spostaMese(S.mese,n); await ricarica(); }
function barraMese(extra){
  return `<div class="barra"><button class="btn pic" onclick="cambiaMese(-1)" aria-label="Mese precedente">‹</button><span class="mese">${nomeMese(S.mese)}</span><button class="btn pic" onclick="cambiaMese(1)" aria-label="Mese successivo">›</button><span class="spazio"></span>${extra||''}</div>`;
}

// ---------- TURNI ----------
function analisiTurno(t){
  const ass = S.ass.filter(a=>a.turno_id===t.id);
  const nF = ass.filter(a=>a.ruolo==='F').length, nS = ass.filter(a=>a.ruolo==='S').length;
  const avvisi=[];
  if(t.annullato) return { ass, nF, nS, avvisi };
  if(ass.length && !ass.some(a=>collabById(a.collaboratore_id)?.auto)) avvisi.push('Nessuno della squadra ha la macchina');
  ass.forEach(a=>{
    const c=collabById(a.collaboratore_id); if(!c) return;
    const st=statoPersona(c,t);
    if(st.conflitto) avvisi.push(c.nome+' è in un altro turno alla stessa ora');
    else if(st.disp===false) avvisi.push(c.nome+' non si è candidato a questo turno');
  });
  return { ass, nF, nS, avvisi };
}

function vistaTurni(){
  const m=document.getElementById('main');
  const bozze=S.turni.filter(t=>!t.pubblicato && !t.annullato).length;
  let h = barraMese(`<button class="btn" onclick="formLinkCalendario()">Link calendario</button><button class="btn" ${bozze?'':'disabled'} onclick="formProponi(false)">Proponi turni</button><button class="btn" ${bozze?'':'disabled'} onclick="pubblicaMese()">Pubblica ${bozze||''} turni in bozza</button><button class="btn pri" onclick="formTurno()">Nuovo turno</button>`);
  if(S.ritiri && S.ritiri.length) h+='<div class="ritiri"><b>Ritiri da gestire</b>'+S.ritiri.map(r=>{const t=r.tp_turni||{}; const c=collabById(r.collaboratore_id)||{nome:'?'};
    return `<div class="rit"><span>${esc(c.nome)} si è ritirato/a da <b>${esc((piscinaById(t.piscina_id)||{nome:'?'}).nome)}</b>, ${t.data?nomeGiorno(t.data):''} ${hm(t.ora_inizio)}–${hm(t.ora_fine)}: era in squadra, il posto è scoperto.</span><button class="btn pic" onclick="ritiroVisto('${r.id}')">Visto</button></div>`}).join('')+'</div>';
  if(!S.piscine.some(p=>p.attiva)) h+='<div class="vuoto">Prima inserisci le sedi nella scheda Sedi, poi potrai creare i turni.</div>';
  else if(!S.turni.length) h+='<div class="vuoto">Nessun turno in questo mese. Crea il primo con “Nuovo turno”.</div>';
  else{
    const giorni=[...new Set(S.turni.map(t=>t.data))];
    giorni.forEach(g=>{
      const tg=S.turni.filter(t=>t.data===g);
      h+=`<div class="giorno">${nomeGiorno(g)} <small>${tg.length} ${tg.length===1?'turno':'turni'}</small></div>`;
      tg.forEach(t=>{
        const p=piscinaById(t.piscina_id)||{nome:'?',importanza:1};
        const a=analisiTurno(t);
        const cls=(n,r)=> n>=r ? 'pieno' : 'manca';
        if(t.annullato){
          h+=`<div class="turno annullato">
          <div class="t-head"><b>${esc(p.nome)}</b><span class="t-ora">${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span><span class="stato ann">Annullato${t.motivo_annullo?' · '+esc(t.motivo_annullo):''}</span></div>
          ${a.ass.length?`<div class="note" style="margin-top:6px">Squadra prevista: ${a.ass.map(x=>esc((collabById(x.collaboratore_id)||{nome:'?'}).nome)).join(', ')}</div>`:''}
          <div class="azioni"><button class="btn pic pri" onclick="ripristinaTurno('${t.id}')">Ripristina</button><button class="btn pic del" onclick="eliminaTurno('${t.id}')">Elimina</button></div></div>`;
          return;
        }
        h+=`<div class="turno ${t.pubblicato?'':'bozza'}">
          <div class="t-head"><b>${esc(p.nome)}</b>${puntini(p.importanza)}<span class="t-ora">${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span><span class="stato ${t.pubblicato?'':'bozza'}">${t.pubblicato?'Pubblicato':'Bozza'}</span></div>
          <div class="req"><span class="${cls(a.nF,t.fotografi)}">Fotografi ${a.nF}/${t.fotografi}</span><span class="${cls(a.nS,t.stampatori)}">Stampatori ${a.nS}/${t.stampatori}</span></div>
          <div class="chips">${a.ass.map(x=>{const c=collabById(x.collaboratore_id)||{nome:'?'};return `<span class="chip"><span class="r ${x.ruolo}">${x.ruolo==='F'?'FOTO':'STAMPA'}</span>${esc(c.nome)}${c.auto?' 🚗':''}<button title="Togli ${esc(c.nome)}" onclick="togli('${x.id}')">×</button></span>`}).join('')}</div>
          ${t.note?`<div class="note">${esc(t.note)}</div>`:''}
          ${rigaCandidati(t)}
          ${rigaIncassi(t)}
          ${rigaPresenze(t,a)}
          ${a.avvisi.length?`<ul class="avvisi">${a.avvisi.map(v=>'<li>⚠ '+esc(v)+'</li>').join('')}</ul>`:''}
          <div class="azioni">
            <button class="btn pic pri" onclick="formAssegna('${t.id}')">Assegna persone</button>
            <button class="btn pic" ${a.nS?'':'disabled title="Assegna prima lo stampatore"'} onclick="formLinkIncassi('${t.id}')">Link incassi</button>
            <button class="btn pic" ${a.ass.length?'':'disabled'} onclick="formPresenze('${t.id}')">Presenze</button>
            <button class="btn pic" ${a.ass.length?'':'disabled'} onclick="formCompensi('${t.id}')">Compensi</button>
            <button class="btn pic" onclick="pubblica('${t.id}',${!t.pubblicato})">${t.pubblicato?'Rimetti in bozza':'Pubblica'}</button>
            <button class="btn pic" onclick="formTurno('${t.id}')">Modifica</button>
            <button class="btn pic" onclick="formAnnulla('${t.id}')">Annulla turno</button>
            <button class="btn pic del" onclick="eliminaTurno('${t.id}')">Elimina</button>
          </div></div>`;
      });
    });
  }
  m.innerHTML=h;
}

function formTurno(id){
  const t = id ? S.turni.find(x=>x.id===id) : null;
  const [da,a]=limitiMese(S.mese); const o=oggi();
  const dataDef = t ? t.data : (o>=da&&o<=a ? o : da);
  const opz = S.piscine.filter(p=>p.attiva || (t&&p.id===t.piscina_id)).map(p=>`<option value="${p.id}" ${t&&t.piscina_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('');
  const orari = t ? `<div class="due">
      <label class="campo"><span>Inizio</span><input type="time" name="ora_inizio" value="${hm(t.ora_inizio)}" required></label>
      <label class="campo"><span>Fine</span><input type="time" name="ora_fine" value="${hm(t.ora_fine)}" required></label></div>`
    : `<p class="note" style="margin:0 0 6px"><b>Mattina</b></p>
    <div class="due">
      <label class="campo"><span>Inizio</span><input type="time" name="m_inizio" value="09:00"></label>
      <label class="campo"><span>Fine</span><input type="time" name="m_fine" value="13:00"></label></div>
    <p class="note" style="margin:0 0 6px"><b>Pomeriggio</b> (facoltativo)</p>
    <div class="due">
      <label class="campo"><span>Inizio</span><input type="time" name="p_inizio"></label>
      <label class="campo"><span>Fine</span><input type="time" name="p_fine"></label></div>
    <p class="note" style="margin:-4px 0 12px">Compilando mattina e pomeriggio si creano due turni per ogni giorno, così i ragazzi possono candidarsi a una sola metà o a tutte e due. Lascia vuota una delle due se serve un turno solo.</p>`;
  apriDialog(t?'Modifica turno':'Nuovo turno', `
    <label class="campo"><span>Sede</span><select name="piscina_id" required>${opz}</select></label>
    ${t?`<label class="campo"><span>Data</span><input type="date" name="data" value="${dataDef}" required></label>`
      :`<div class="due">
      <label class="campo"><span>Data (o primo giorno)</span><input type="date" name="data" value="${dataDef}" required></label>
      <label class="campo"><span>Fino al (facoltativo)</span><input type="date" name="data_fine"></label>
    </div>
    <p class="note" style="margin:-4px 0 12px">Con “Fino al” si creano i turni per ogni giorno, dal primo all’ultimo compresi. I giorni di chiusura poi si eliminano uno per uno.</p>`}
    ${orari}
    <div class="due">
      <label class="campo"><span>Fotografi richiesti</span><input type="number" min="0" max="9" name="fotografi" value="${t?t.fotografi:1}" required></label>
      <label class="campo"><span>Stampatori richiesti</span><input type="number" min="0" max="9" name="stampatori" value="${t?t.stampatori:1}" required></label>
    </div>
    <label class="campo"><span>Note</span><textarea name="note" rows="2">${esc(t?.note)}</textarea></label>`,
  async f=>{
    const base={ piscina_id:f.piscina_id.value, fotografi:+f.fotografi.value, stampatori:+f.stampatori.value, note:f.note.value.trim()||null };
    if(t){
      const rec={...base, data:f.data.value, ora_inizio:f.ora_inizio.value, ora_fine:f.ora_fine.value};
      if(rec.ora_fine<=rec.ora_inizio){ toast('L\'ora di fine deve essere dopo l\'inizio.',true); return false; }
      if(errore((await sb.from('tp_turni').update(rec).eq('id',t.id)).error)) return false;
      if(rec.data.slice(0,7)!==S.mese) S.mese=rec.data.slice(0,7);
      toast('Turno salvato.'); await ricarica(); return;
    }
    // fasce compilate (mattina e/o pomeriggio)
    const fasce=[];
    for(const [i,e,nome] of [[f.m_inizio.value,f.m_fine.value,'mattina'],[f.p_inizio.value,f.p_fine.value,'pomeriggio']]){
      if(!i && !e) continue;
      if(!i || !e){ toast('Completa inizio e fine del '+nome+'.',true); return false; }
      if(e<=i){ toast('Nel '+nome+' l\'ora di fine deve essere dopo l\'inizio.',true); return false; }
      fasce.push([i,e]);
    }
    if(!fasce.length){ toast('Inserisci almeno gli orari della mattina o del pomeriggio.',true); return false; }
    if(fasce.length===2 && fasce[1][0]<fasce[0][1]){ toast('Il pomeriggio deve iniziare dopo la fine della mattina.',true); return false; }
    const primo=f.data.value, fine=f.data_fine.value||primo;
    if(fine<primo){ toast('“Fino al” deve essere dopo il primo giorno.',true); return false; }
    const date=[]; const d=new Date(primo+'T12:00:00Z');
    while(d.toISOString().slice(0,10)<=fine){ date.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); }
    if(date.length>62){ toast('Massimo 62 giorni alla volta.',true); return false; }
    // salta i turni che esistono già (stessa sede, giorno e ora di inizio)
    const es = await sb.from('tp_turni').select('data,ora_inizio').eq('piscina_id',base.piscina_id).gte('data',primo).lte('data',fine);
    if(errore(es.error)) return false;
    const gia=new Set((es.data||[]).map(x=>x.data+'|'+hm(x.ora_inizio)));
    const tutti=[]; date.forEach(x=>fasce.forEach(([i,e])=>tutti.push({...base, data:x, ora_inizio:i, ora_fine:e})));
    const nuovi=tutti.filter(r=>!gia.has(r.data+'|'+r.ora_inizio)), saltati=tutti.length-nuovi.length;
    if(!nuovi.length){ toast('Questi turni esistono già tutti.',true); return false; }
    if(nuovi.length>1){
      const it=x=>x.split('-').reverse().join('/');
      if(!confirm('Creo '+nuovi.length+' turni ('+fasce.map(([i,e])=>i+'–'+e).join(' e ')+'), dal '+it(primo)+' al '+it(fine)+(saltati?' (salto '+saltati+' turni già presenti)':'')+'. Procedo?')) return false;
    }
    if(errore((await sb.from('tp_turni').insert(nuovi)).error)) return false;
    if(primo.slice(0,7)!==S.mese) S.mese=primo.slice(0,7);
    toast(nuovi.length===1?'Turno creato.':nuovi.length+' turni creati.'); await ricarica();
  }, t?'Salva turno':'Crea turni');
}

async function eliminaTurno(id){
  const t=S.turni.find(x=>x.id===id); const p=piscinaById(t.piscina_id);
  if(!confirm('Eliminare il turno '+p.nome+' del '+nomeGiorno(t.data)+'? Si cancellano anche assegnazioni, incassi e spese collegate.')) return;
  if(errore((await sb.from('tp_turni').delete().eq('id',id)).error)) return;
  toast('Turno eliminato.'); ricarica();
}
async function pubblica(id,val){ if(errore((await sb.from('tp_turni').update({pubblicato:val}).eq('id',id)).error)) return; toast(val?'Turno pubblicato.':'Turno rimesso in bozza.'); ricarica(); }

    <p style="margin:0 0 12px"><b>${esc(p.nome)}</b>, ${nomeGiorno(t.data)}, ${hm(t.ora_inizio)}–${hm(t.ora_fine)}</p>

      <option>Pioggia</option><option>Chiusura</option><option>Altro</option></select></label>
    <label class="campo"><input name="altro" placeholder="Scrivi il motivo" style="display:none"></label>

}
async function ripristinaTurno(id){
  if(errore((await sb.from('tp_turni').update({annullato:false, motivo_annullo:null}).eq('id',id)).error)) return;
  toast('Turno ripristinato.'); ricarica();
}
function oreAss(x,t){ if(x.presente!==true) return 0; return Math.max(0, minuti(x.ora_fine_eff||t.ora_fine)-minuti(x.ora_inizio_eff||t.ora_inizio))/60; }
function fmtOre(h){ return (Math.round(h*10)/10).toLocaleString('it-IT')+' h'; }
function rigaCandidati(t){
  const k=S.cand.filter(x=>x.turno_id===t.id); const posti=(t.fotografi||0)+(t.stampatori||0);
  if(!k.length) return '<div class="note">Nessun candidato</div>';
  const fuori=k.filter(x=>!S.ass.some(a=>a.turno_id===t.id&&a.collaboratore_id===x.collaboratore_id));
  return `<div class="note">Candidati: <b>${k.length}</b> per ${posti} posti${fuori.length?' · non in squadra: '+fuori.map(x=>esc((collabById(x.collaboratore_id)||{nome:'?'}).nome)).join(', '):''}</div>`;
}
function rigaPresenze(t,a){
  if(!a.ass.length) return '';
  if(t.presenze_ok){
    const pres=a.ass.filter(x=>x.presente===true);
    const ore=a.ass.reduce((s,x)=>s+oreAss(x,t),0);
    return `<div class="pres ok">✓ Presenze: ${pres.length}/${a.ass.length} · ${fmtOre(ore)}${pres.length<a.ass.length?' · assenti: '+a.ass.filter(x=>x.presente!==true).map(x=>esc((collabById(x.collaboratore_id)||{nome:'?'}).nome)).join(', '):''}</div>`;
  }
  return t.data<=oggi() ? '<div class="pres da">Presenze da confermare</div>' : '';
}
function formPresenze(id){
  const t=S.turni.find(x=>x.id===id); const p=piscinaById(t.piscina_id)||{nome:'?'};
  const ass=S.ass.filter(a=>a.turno_id===id);
  apriDialog('Presenze', `
    <p style="margin:0 0 6px"><b>${esc(p.nome)}</b>, ${nomeGiorno(t.data)}, ${hm(t.ora_inizio)}–${hm(t.ora_fine)}</p>
    <p class="note" style="margin:0 0 6px">Togli la spunta a chi non c'era e correggi l'orario di chi è arrivato tardi o è andato via prima. Per un sostituto: chiudi, aggiungilo con “Assegna persone” e torna qui.</p>
    ${ass.map(x=>{const c=collabById(x.collaboratore_id)||{nome:'?'};
      return `<div class="riga-pres"><label class="spunta" style="margin:0"><input type="checkbox" name="p_${x.id}" ${x.presente===false?'':'checked'}> ${esc(c.nome)} <small class="note">${x.ruolo==='F'?'foto':'stampa'}</small></label>
        <input type="time" name="i_${x.id}" value="${hm(x.ora_inizio_eff||t.ora_inizio)}" aria-label="Inizio ${esc(c.nome)}">
        <input type="time" name="f_${x.id}" value="${hm(x.ora_fine_eff||t.ora_fine)}" aria-label="Fine ${esc(c.nome)}"></div>`}).join('')}`,
  async f=>{
    for(const x of ass){
      const pres=f['p_'+x.id].checked, i=f['i_'+x.id].value, e=f['f_'+x.id].value;
      if(pres && (!i||!e||e<=i)){ toast('Controlla gli orari di '+(collabById(x.collaboratore_id)||{nome:'?'}).nome+'.',true); return false; }
    }
    for(const x of ass){
      const pres=f['p_'+x.id].checked, i=f['i_'+x.id].value, e=f['f_'+x.id].value;
      const rec={ presente:pres, ora_inizio_eff: pres&&i!==hm(t.ora_inizio)?i:null, ora_fine_eff: pres&&e!==hm(t.ora_fine)?e:null };
      if(errore((await sb.from('tp_assegnazioni').update(rec).eq('id',x.id)).error)) return false;
    }
    if(errore((await sb.from('tp_turni').update({presenze_ok:true}).eq('id',id)).error)) return false;
    toast('Presenze salvate.'); await ricarica();
  }, 'Conferma presenze');
}

// ---------- RIEPILOGO ----------
function vistaRiepilogo(){
  const m=document.getElementById('main');
  if(!S.riep){ const [da,a]=limitiMese(S.mese); S.riep={da,a,sede:'tutte',dati:null}; }
  const R=S.riep;
  m.innerHTML=`<div class="barra" style="flex-wrap:wrap;gap:10px">
    <label class="campo" style="margin:0"><span>Dal</span><input type="date" id="rDa" value="${R.da}"></label>
    <label class="campo" style="margin:0"><span>Al</span><input type="date" id="rA" value="${R.a}"></label>
    <label class="campo" style="margin:0"><span>Sede</span><select id="rSede"><option value="tutte">Tutte le sedi</option>${S.piscine.map(p=>`<option value="${p.id}" ${R.sede===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></label>
    <button class="btn pri" style="align-self:end" onclick="caricaRiepilogo()">Mostra</button></div><div id="rOut"></div>`;
  if(R.dati) disegnaRiepilogo(); else caricaRiepilogo();
}
async function caricaRiepilogo(){
  const R=S.riep; R.da=document.getElementById('rDa').value; R.a=document.getElementById('rA').value; R.sede=document.getElementById('rSede').value;
  if(!R.da||!R.a||R.a<R.da){ toast('Controlla le date.',true); return; }
  let q=sb.from('tp_turni').select('*').gte('data',R.da).lte('data',R.a);
  if(R.sede!=='tutte') q=q.eq('piscina_id',R.sede);
  const t=await q; if(errore(t.error)) return;
  let ass=[];
  if(t.data.length){ const r=await sb.from('tp_assegnazioni').select('*').in('turno_id',t.data.map(x=>x.id)); if(errore(r.error)) return; ass=r.data; }
  R.dati={turni:t.data, ass}; disegnaRiepilogo();
}
function disegnaRiepilogo(){
  const {turni,ass}=S.riep.dati; const out=document.getElementById('rOut');
  const tById=id=>turni.find(x=>x.id===id);
  const validi=turni.filter(t=>!t.annullato), ann=turni.filter(t=>t.annullato);
  const daConf=validi.filter(t=>!t.presenze_ok && t.data<=oggi() && ass.some(a=>a.turno_id===t.id));
  const per={};
  ass.forEach(a=>{ const t=tById(a.turno_id); if(!t||t.annullato) return;
    const k=a.collaboratore_id; per[k]=per[k]||{ass:0,pres:0,ass_:0,ore:0,giorni:new Set()};
    per[k].ass++;
    if(t.presenze_ok){ if(a.presente===true){ per[k].pres++; per[k].ore+=oreAss(a,t); per[k].giorni.add(t.data); } else per[k].ass_++; }
  });
  const righe=Object.entries(per).map(([id,v])=>({nome:(collabById(id)||{nome:'?'}).nome,...v})).sort((a,b)=>a.nome.localeCompare(b.nome));
  const tot=righe.reduce((s,r)=>({ass:s.ass+r.ass,pres:s.pres+r.pres,ass_:s.ass_+r.ass_,ore:s.ore+r.ore}),{ass:0,pres:0,ass_:0,ore:0});
  out.innerHTML=`<p class="note">Turni previsti: <b>${turni.length}</b> · annullati: <b>${ann.length}</b>${ann.length?' ('+[...new Set(ann.map(t=>t.motivo_annullo||'senza motivo'))].map(esc).join(', ')+')':''} · presenze da confermare: <b>${daConf.length}</b></p>
    ${daConf.length?`<ul class="avvisi" style="margin-bottom:12px">${daConf.map(t=>'<li>⚠ '+esc((piscinaById(t.piscina_id)||{nome:'?'}).nome)+', '+nomeGiorno(t.data)+' '+hm(t.ora_inizio)+'–'+hm(t.ora_fine)+': presenze non confermate</li>').join('')}</ul>`:''}
    ${righe.length?`<div class="griglia"><table class="riep"><thead><tr><th>Collaboratore</th><th>Turni assegnati</th><th>Presenze</th><th>Assenze</th><th>Giorni lavorati</th><th>Ore lavorate</th></tr></thead><tbody>
    ${righe.map(r=>`<tr><td>${esc(r.nome)}</td><td>${r.ass}</td><td>${r.pres}</td><td>${r.ass_||''}</td><td>${r.giorni.size}</td><td>${fmtOre(r.ore)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Totale</td><td>${tot.ass}</td><td>${tot.pres}</td><td>${tot.ass_||''}</td><td></td><td>${fmtOre(tot.ore)}</td></tr></tfoot></table></div>
    <p class="note">Presenze, giorni e ore contano solo i turni con le presenze confermate. I turni annullati non contano.</p>`
    :'<div class="vuoto">Nessuna assegnazione nel periodo scelto.</div>'}`;
}

  if(errore((await sb.from('tp_turni').update({pubblicato:true}).gte('data',da).lte('data',a).eq('pubblicato',false)).error)) return;
  toast('Turni pubblicati.'); ricarica();
}
async function togli(assId){ if(errore((await sb.from('tp_assegnazioni').delete().eq('id',assId)).error)) return; ricarica(); }

// stato di una persona rispetto a un turno
function statoPersona(c,t){
  const giaQui = S.ass.find(a=>a.turno_id===t.id && a.collaboratore_id===c.id);
  const altri = S.ass.filter(a=>a.collaboratore_id===c.id && a.turno_id!==t.id).map(a=>S.turni.find(x=>x.id===a.turno_id)).filter(x=>x&&!x.annullato&&x.data===t.data);
  const conflitto = altri.some(x=> hm(x.ora_inizio)<hm(t.ora_fine) && hm(t.ora_inizio)<hm(x.ora_fine));
  const disp = S.cand.some(k=>k.turno_id===t.id && k.collaboratore_id===c.id);   // si è candidato a questo turno
  const nelMese = S.ass.filter(a=>a.collaboratore_id===c.id).length;
  return { giaQui, conflitto, disp, nelMese, stessoGiorno:altri.length };
}

function formAssegna(id){
  const t=S.turni.find(x=>x.id===id); const p=piscinaById(t.piscina_id);
  const a=analisiTurno(t);
  const righe = S.collab.filter(c=>c.attivo).map(c=>({c, st:statoPersona(c,t)}))
    .sort((x,y)=> (punteggio(y)-punteggio(x)) || (y.c.livello-x.c.livello) || (x.st.nelMese-y.st.nelMese) || x.c.nome.localeCompare(y.c.nome));
  function punteggio(r){ if(r.st.giaQui) return 4; if(r.st.conflitto) return 0; if(r.st.disp) return 3; return 1; }
  const h = `<p style="margin:0 0 6px"><b>${esc(p.nome)}</b> ${puntini(p.importanza)} · ${nomeGiorno(t.data)}, ${hm(t.ora_inizio)}–${hm(t.ora_fine)}</p>
  <p class="note" style="margin:0 0 8px">Fotografi ${a.nF}/${t.fotografi}, stampatori ${a.nS}/${t.stampatori}</p>
  ${righe.map(({c,st})=>{
    let d;
    if(st.giaQui) d='<span class="ok">In squadra come '+(st.giaQui.ruolo==='F'?'fotografo':'stampatore')+'</span>';
    else if(st.conflitto) d='<span class="ko">In un altro turno alla stessa ora</span>';
    else if(st.disp) d='<span class="ok">Candidato</span>';
    else d='Non candidato';
    const info=[RUOLI[c.ruolo], '<span class="stelle">'+stelle(c.livello)+'</span>', c.auto?'🚗 macchina':'senza macchina', st.nelMese+' turni nel mese'].join(', ');
    const b = st.giaQui ? `<button class="btn pic del" onclick="togliDaDialog('${st.giaQui.id}','${t.id}')">Togli</button>`
      : (c.ruolo!=='S'?`<button class="btn pic" onclick="assegna('${t.id}','${c.id}','F')">Foto</button>`:'')
      + (c.ruolo!=='F'?`<button class="btn pic" onclick="assegna('${t.id}','${c.id}','S')">Stampa</button>`:'');
    return `<div class="cand"><span class="n">${esc(c.nome)}</span><span class="b">${b}</span><span class="d">${d}<br>${info}</span></div>`;
  }).join('') || '<div class="vuoto">Nessun collaboratore attivo.</div>'}`;
  apriDialog('Assegna persone', h, null, null, 'Fatto');
}
async function assegna(tid,cid,ruolo){

}
async function togliDaDialog(aid,tid){

function eur(n){ return (Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'}); }
function compensiTurno(t){
  return S.ass.filter(a=>a.turno_id===t.id).map(a=>({a, c:collabById(a.collaboratore_id), k:(S.compensi||[]).find(x=>x.assegnazione_id===a.id)}));
}
function rigaIncassi(t){
  const i=(S.incassi||[]).find(x=>x.turno_id===t.id);
  const sp=(S.spese||[]).filter(x=>x.turno_id===t.id);
  const comp=compensiTurno(t).filter(x=>x.k && (x.k.importo!=null || x.k.nota));
  let h='';
  if(!i && !sp.length) h+='<div class="note">Incassi non ancora inseriti</div>';
  else{
    const tot=sp.reduce((a,x)=>a+Number(x.importo||0),0);
    const parti=['Contanti '+eur(i?.cash),'POS '+eur(i?.pos),'% sede '+eur(i?.percentuale_piscina)];
    if(sp.length) parti.push('Spese '+eur(tot)+' ('+sp.map(x=>esc(x.descrizione)).join(', ')+')');
    h+='<div class="note" style="color:var(--ink)"><b>Incassi:</b> '+parti.join(', ')+'</div>';
  }
  if(comp.length) h+='<div class="note" style="color:var(--ink)"><b>Compensi:</b> '+comp.map(x=>esc(x.c?.nome||'?')+' '+(x.k.importo!=null?eur(x.k.importo):'—')+(x.k.nota?' ('+esc(x.k.nota)+')':'')).join(', ')+'</div>';
  if(i || sp.length || comp.length){
    const cash=Number(i?.cash||0), pos=Number(i?.pos||0);
    const usc=Number(i?.percentuale_piscina||0)+sp.reduce((a,x)=>a+Number(x.importo||0),0)+comp.reduce((a,x)=>a+Number(x.k.importo||0),0);
    h+='<div class="note" style="color:var(--ink)"><b>Contanti che restano:</b> '+eur(cash-usc)+' <span style="color:var(--muted)">(contanti '+eur(cash)+' meno uscite '+eur(usc)+'). Margine con POS: '+eur(cash+pos-usc)+'</span></div>';
  }
  return h;
}
function formCompensi(id){
  const t=S.turni.find(x=>x.id===id); const p=piscinaById(t.piscina_id)||{nome:'?'};
  const righe=compensiTurno(t);
  apriDialog('Compensi', `
    <p style="margin:0 0 12px"><b>${esc(p.nome)}</b>, ${nomeGiorno(t.data)}, ${hm(t.ora_inizio)}–${hm(t.ora_fine)}</p>
    ${righe.map(({a,c,k})=>`<div class="due" style="align-items:end">
      <label class="campo"><span>${esc(c?.nome||'?')} (${a.ruolo==='F'?'foto':'stampa'})</span><input name="imp_${a.id}" inputmode="decimal" placeholder="0,00" value="${k?.importo!=null?String(k.importo).replace('.',','):''}"></label>
      <label class="campo"><span>Nota</span><input name="nota_${a.id}" placeholder="es. macchina, trasferta" value="${esc(k?.nota||'')}"></label>
    </div>`).join('')}`,
  async f=>{
    const daSalvare=[], daTogliere=[];
    for(const {a} of righe){
      let v=f['imp_'+a.id].value.trim().replace(/\s|€/g,''); if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
      const imp = v==='' ? null : Number(v); const nota=f['nota_'+a.id].value.trim()||null;
      if(imp!=null && (isNaN(imp)||imp<0)){ toast('Controlla gli importi.',true); return false; }
      if(imp==null && !nota) daTogliere.push(a.id); else daSalvare.push({assegnazione_id:a.id, importo:imp, nota, aggiornato_il:new Date().toISOString()});
    }
    if(daSalvare.length && errore((await sb.from('tp_compensi').upsert(daSalvare)).error)) return false;
    if(daTogliere.length && errore((await sb.from('tp_compensi').delete().in('assegnazione_id',daTogliere)).error)) return false;
    toast('Compensi salvati.'); await ricarica();
  }, 'Salva compensi');
}

function telefonoWa(t){ let d=String(t||'').replace(/\D/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.length===10 && d.startsWith('3')) d='39'+d; return d; }
async function copia(testo){

// ---------- PROPOSTA AUTOMATICA ----------
// Riempie solo i posti liberi dei turni in BOZZA, senza togliere chi è già assegnato.
// Regole: ruolo giusto, disponibilità, niente sovrapposizioni di orario, almeno una macchina per squadra,
// piscine più importanti servite per prime e con le persone di livello più alto, turni distribuiti in modo equo.
function calcolaProposta(includiNonIndicati){
  const lavoro = S.ass.map(a=>({...a}));
  const nuove = [], esito = [];
  const carico = {}; S.collab.forEach(c=>carico[c.id]=lavoro.filter(a=>a.collaboratore_id===c.id).length);
  const imp = t => (piscinaById(t.piscina_id)||{importanza:1}).importanza;
  const turni = S.turni.filter(t=>!t.pubblicato && !t.annullato).sort((a,b)=> (imp(b)-imp(a)) || a.data.localeCompare(b.data) || hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));

  const disponibile = (c,t) => includiNonIndicati || S.cand.some(k=>k.turno_id===t.id && k.collaboratore_id===c.id);
  const altriTurniStessoGiorno = (c,t) => lavoro.filter(a=>a.collaboratore_id===c.id && a.turno_id!==t.id)
    .map(a=>S.turni.find(x=>x.id===a.turno_id)).filter(x=>x && !x.annullato && x.data===t.data);
  const inConflitto = (c,t) => altriTurniStessoGiorno(c,t).some(x=> hm(x.ora_inizio)<hm(t.ora_fine) && hm(t.ora_inizio)<hm(x.ora_fine));
  const sa = (c,r) => c.ruolo==='FS' || c.ruolo===r;

  for(const t of turni){
    const squadra = () => lavoro.filter(a=>a.turno_id===t.id);
    const bisogno = { F: Math.max(0, t.fotografi - squadra().filter(a=>a.ruolo==='F').length),
                      S: Math.max(0, t.stampatori - squadra().filter(a=>a.ruolo==='S').length) };
    if(!bisogno.F && !bisogno.S) continue;
    const aggiunti = [];
    while(bisogno.F || bisogno.S){
      const sq = squadra();
      const haMacchina = sq.some(a=>collabById(a.collaboratore_id)?.auto);
      let coppie = [];
      for(const c of S.collab){
        if(!c.attivo || sq.some(a=>a.collaboratore_id===c.id) || inConflitto(c,t) || !disponibile(c,t)) continue;
        for(const r of ['S','F']) if(bisogno[r] && sa(c,r)) coppie.push({c,r});
      }
      if(!coppie.length) break;
      const punteggio = ({c,r}) => c.livello*imp(t) - 4*carico[c.id] - 2*altriTurniStessoGiorno(c,t).length + (c.ruolo===r?1:0);
      // una scelta è "sicura" se dopo restano abbastanza persone per coprire tutti i posti ancora liberi
      const candidati = [...new Set(coppie.map(x=>x.c))];   // tutti, prima del filtro macchina
      const sicura = ({c,r}) => {
        const F = bisogno.F-(r==='F'?1:0), Sx = bisogno.S-(r==='S'?1:0);
        const altri = candidati.filter(x=>x!==c);
        return altri.filter(x=>sa(x,'F')).length>=F && altri.filter(x=>sa(x,'S')).length>=Sx && altri.length>=F+Sx;
      };
      if(!haMacchina && coppie.some(x=>x.c.auto)) coppie = coppie.filter(x=>x.c.auto);
      coppie.sort((x,y)=> (sicura(y)-sicura(x)) || punteggio(y)-punteggio(x) || x.c.nome.localeCompare(y.c.nome));
      const {c,r} = coppie[0];
      const rec = { turno_id:t.id, collaboratore_id:c.id, ruolo:r };
      lavoro.push(rec); nuove.push(rec); aggiunti.push(rec);
      carico[c.id]++; bisogno[r]--;
    }
    const avvisi=[];
    if(bisogno.F) avvisi.push(bisogno.F===1?'Manca 1 fotografo':'Mancano '+bisogno.F+' fotografi');
    if(bisogno.S) avvisi.push(bisogno.S===1?'Manca 1 stampatore':'Mancano '+bisogno.S+' stampatori');
    const sq = squadra();
    if(sq.length && !sq.some(a=>collabById(a.collaboratore_id)?.auto)) avvisi.push('Nessuno della squadra ha la macchina');
    esito.push({ t, squadra:sq, aggiunti, avvisi });
  }
  esito.sort((a,b)=> a.t.data.localeCompare(b.t.data) || hm(a.t.ora_inizio).localeCompare(hm(b.t.ora_inizio)));
  return { nuove, esito };
}

function formProponi(includi){
  const { nuove, esito } = calcolaProposta(includi);
  const corpo = `
    <label class="spunta"><input type="checkbox" ${includi?'checked':''} onchange="formProponi(this.checked)"> Usa anche chi non si è candidato al turno</label>
    <p class="note" style="margin:0 0 10px">Riempie solo i posti liberi dei turni in bozza. Chi è già assegnato resta dov'è. Dopo puoi correggere a mano.</p>
    ${esito.length ? esito.map(({t,squadra,aggiunti,avvisi})=>{
      const p=piscinaById(t.piscina_id)||{nome:'?',importanza:1};
      return `<div class="turno bozza" style="margin-bottom:8px">
        <div class="t-head"><b>${esc(p.nome)}</b>${puntini(p.importanza)}<span class="t-ora">${nomeGiorno(t.data)}, ${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span></div>
        <div class="chips" style="margin-top:6px">${squadra.map(x=>{const c=collabById(x.collaboratore_id)||{nome:'?'};const nuovo=aggiunti.includes(x);
          return `<span class="chip" style="padding-right:10px;${nuovo?'border-color:var(--ok);background:#E7F3EC':''}"><span class="r ${x.ruolo}">${x.ruolo==='F'?'FOTO':'STAMPA'}</span>${esc(c.nome)}${c.auto?' 🚗':''}${nuovo?' <small>nuovo</small>':''}</span>`}).join('')||'<span class="note">Nessuno</span>'}</div>
        ${avvisi.length?`<ul class="avvisi">${avvisi.map(v=>'<li>⚠ '+esc(v)+'</li>').join('')}</ul>`:''}
      </div>`;}).join('') : '<div class="vuoto">Tutti i turni in bozza sono già completi.</div>'}`;
  apriDialog('Proposta turni ('+nuove.length+' assegnazioni nuove)', corpo, nuove.length ? async ()=>{
    const r = await sb.from('tp_assegnazioni').insert(nuove);
    if(errore(r.error)) return false;
    toast(nuove.length+' assegnazioni inserite.'); await ricarica();
  } : null, 'Applica proposta');
}

// ---------- DISPONIBILITÀ ----------
function vistaDisp(){
  const m=document.getElementById('main');
  const attivi=S.collab.filter(c=>c.attivo);
  // divisione per sede: una colonna per ogni turno della sede scelta
  const turniOk=S.turni.filter(t=>!t.annullato);
  const sediMese=[...new Set(turniOk.map(t=>t.piscina_id))].map(id=>piscinaById(id)||{id,nome:'?'}).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(S.sedeDisp!=='tutte' && !sediMese.some(p=>p.id===S.sedeDisp)) S.sedeDisp = sediMese[0]?.id || 'tutte';
  const turniV = S.sedeDisp==='tutte' ? turniOk : turniOk.filter(t=>t.piscina_id===S.sedeDisp);
  let h=barraMese('<span class="note">Le candidature le fanno i collaboratori dal calendario; qui potete aggiungerle o toglierle voi.</span>');
  if(sediMese.length) h+='<div class="sedi">'+sediMese.map(p=>`<button aria-current="${S.sedeDisp===p.id}" onclick="sedeDisp('${p.id}')">${esc(p.nome)}<small>${turniOk.filter(t=>t.piscina_id===p.id).length} turni</small></button>`).join('')
    +(sediMese.length>1?`<button aria-current="${S.sedeDisp==='tutte'}" onclick="sedeDisp('tutte')">Tutte</button>`:'')+'</div>';
  if(!turniV.length){ m.innerHTML=h+'<div class="vuoto">Nessun turno in questo mese. Inserisci prima i turni (sede, data e orario) nella scheda Turni.</div>'; return; }
  if(!attivi.length){ m.innerHTML=h+'<div class="vuoto">Nessun collaboratore attivo.</div>'; return; }
  h+='<div class="griglia"><table><thead><tr><th class="nome">Collaboratore</th>'+turniV.map(t=>{
    const [y,mm,g]=t.data.split('-').map(Number); const wd=new Date(y,mm-1,g).toLocaleDateString('it-IT',{weekday:'short'});
    const nc=S.cand.filter(k=>k.turno_id===t.id).length, posti=(t.fotografi||0)+(t.stampatori||0);
    return `<th class="ev">${wd} ${g}<div class="pisc">${S.sedeDisp==='tutte'?esc((piscinaById(t.piscina_id)||{nome:'?'}).nome)+'<br>':''}<span class="ore">${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span><br><span class="${nc>=posti?'pieno':'manca'}">${nc}/${posti}</span></div></th>`;
  }).join('')+'</tr></thead><tbody>';
  attivi.forEach(c=>{
    h+=`<tr><td class="nome">${esc(c.nome)}</td>`+turniV.map(t=>{
      const k=S.cand.some(x=>x.turno_id===t.id&&x.collaboratore_id===c.id);
      const sq=S.ass.some(x=>x.turno_id===t.id&&x.collaboratore_id===c.id);
      return `<td><div class="fx"><button class="${sq?'sq':k?'si':''}" title="${sq?'In squadra':k?'Candidato: tocca per togliere':'Tocca per candidare'}" onclick="toggleCand('${c.id}','${t.id}')">${sq?'★':k?'✓':''}</button></div></td>`;
    }).join('')+'</tr>';
  });
  m.innerHTML=h+'</tbody></table></div><p class="note">✓ = candidato · ★ = in squadra · in alto i candidati sui posti del turno.</p>';
}
function sedeDisp(id){ S.sedeDisp=id; vistaDisp(); }
async function toggleCand(cid,tid){
  const c=S.cand.find(x=>x.collaboratore_id===cid&&x.turno_id===tid);
  const r = c ? await sb.from('tp_candidature').delete().eq('id',c.id)
              : await sb.from('tp_candidature').insert({collaboratore_id:cid,turno_id:tid}).select().single();
  if(errore(r.error)) return;
  if(c) S.cand=S.cand.filter(x=>x!==c); else S.cand.push(r.data);
  const sx=document.querySelector('.griglia')?.scrollLeft; vistaDisp(); const g=document.querySelector('.griglia'); if(g) g.scrollLeft=sx||0;
}
async function ritiroVisto(id){
  if(errore((await sb.from('tp_ritiri').update({visto:true}).eq('id',id)).error)) return;
  S.ritiri=S.ritiri.filter(x=>x.id!==id); vistaTurni();
}

// ---------- COLLABORATORI ----------
function vistaCollab(){
  const m=document.getElementById('main');
  let h='<div class="barra"><span class="spazio"></span><button class="btn pri" onclick="formCollab()">Nuovo collaboratore</button></div>';
  if(!S.collab.length) h+='<div class="vuoto">Nessun collaboratore. Aggiungi il primo.</div>';
  const nNuovi=S.collab.filter(c=>c.nuovo).length;
  if(nNuovi) h+=`<p class="note">${nNuovi===1?'1 nuovo iscritto':nNuovi+' nuovi iscritti'} dal calendario: controlla i dati e il livello (parte da 3) e premi Salva per confermarlo.</p>`;
  h+='<div class="lista">'+S.collab.map(c=>`<div class="riga ${c.attivo?'':'off'}">
    <b>${esc(c.nome)}</b>
    ${c.nuovo?'<span class="tag" style="background:var(--water);color:#fff;border-color:var(--water)">NUOVO</span>':''}
    <span class="tag">${RUOLI[c.ruolo]}</span>
    <span class="stelle" title="Livello ${c.livello}">${stelle(c.livello)}</span>
    ${c.auto?'<span title="Ha la macchina">🚗</span>':''}
    ${c.organizzatore?'<span class="tag">organizzatore</span>':''}
    ${c.attivo?'':'<span class="tag">non attivo</span>'}
    <span class="info">${[c.telefono,c.email].filter(Boolean).map(esc).join(', ')}</span>
    <button class="btn pic" onclick="formCollab('${c.id}')">Modifica</button></div>`).join('')+'</div>';
  m.innerHTML=h;
}
function formCollab(id){
  const c = id ? collabById(id) : null;
  apriDialog(c?'Modifica collaboratore':'Nuovo collaboratore', `
    <label class="campo"><span>Nome</span><input name="nome" value="${esc(c?.nome)}" required></label>
    <div class="due">
      <label class="campo"><span>Ruolo</span><select name="ruolo">${Object.entries(RUOLI).map(([k,l])=>`<option value="${k}" ${c?.ruolo===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="campo"><span>Livello (1–5)</span><select name="livello">${[1,2,3,4,5].map(n=>`<option ${ (c?c.livello:3)===n?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="campo"><span>Telefono</span><input name="telefono" type="tel" value="${esc(c?.telefono)}"></label>
      <label class="campo"><span>Email</span><input name="email" type="email" value="${esc(c?.email)}"></label>
    </div>
    <label class="campo"><span>Indirizzo</span><input name="indirizzo" value="${esc(c?.indirizzo)}"></label>
    <label class="campo"><span>Note</span><textarea name="note" rows="2">${esc(c?.note)}</textarea></label>
    <label class="spunta"><input type="checkbox" name="auto" ${c?.auto?'checked':''}> Ha la macchina</label>
    <label class="spunta"><input type="checkbox" name="organizzatore" ${c?.organizzatore?'checked':''}> Organizzatore (vede e modifica tutto)</label>
    <label class="spunta"><input type="checkbox" name="attivo" ${!c||c.attivo?'checked':''}> Attivo</label>
    ${c?`<button type="button" class="btn pic del" onclick="eliminaCollab('${c.id}')">Elimina collaboratore</button>`:''}`,
  async f=>{
    const rec={ nome:f.nome.value.trim(), ruolo:f.ruolo.value, livello:+f.livello.value, telefono:f.telefono.value.trim()||null,
      email:f.email.value.trim().toLowerCase()||null, indirizzo:f.indirizzo.value.trim()||null, note:f.note.value.trim()||null,
      auto:f.auto.checked, organizzatore:f.organizzatore.checked, attivo:f.attivo.checked, nuovo:false };
    if(c && c.id===S.me.id && (!rec.organizzatore || !rec.attivo)){ toast('Non puoi togliere a te stesso il ruolo di organizzatore.',true); return false; }
    const r = c ? await sb.from('tp_collaboratori').update(rec).eq('id',c.id) : await sb.from('tp_collaboratori').insert(rec);
    if(errore(r.error)) return false;
    toast('Collaboratore salvato.'); await caricaTutto();
  }, 'Salva');
}
async function eliminaCollab(id){
  const c=collabById(id); if(c.id===S.me.id){ toast('Non puoi eliminare te stesso.',true); return; }
  if(!confirm('Eliminare '+c.nome+'? Se ha già lavorato in qualche turno non si può: in quel caso togli la spunta “Attivo”.')) return;
  if(errore((await sb.from('tp_collaboratori').delete().eq('id',id)).error)) return;
  chiudiDialog(); toast('Collaboratore eliminato.'); caricaTutto();
}

// ---------- PISCINE ----------
function vistaPiscine(){
  const m=document.getElementById('main');
  let h='<div class="barra"><span class="spazio"></span><button class="btn pri" onclick="formPiscina()">Nuova sede</button></div>';
  if(!S.piscine.length) h+='<div class="vuoto">Nessuna sede. Aggiungi la prima.</div>';
  h+='<div class="lista">'+S.piscine.map(p=>`<div class="riga ${p.attiva?'':'off'}">
    <b>${esc(p.nome)}</b>${puntini(p.importanza)}
    ${p.attiva?'':'<span class="tag">non attiva</span>'}
    <span class="info">${[p.indirizzo,p.contatto].filter(Boolean).map(esc).join(', ')}</span>
    <button class="btn pic" onclick="formPiscina('${p.id}')">Modifica</button></div>`).join('')+'</div>';
  m.innerHTML=h;
}
function formPiscina(id){
  const p = id ? piscinaById(id) : null;
  apriDialog(p?'Modifica sede':'Nuova sede', `
    <label class="campo"><span>Nome</span><input name="nome" value="${esc(p?.nome)}" required></label>
    <label class="campo"><span>Importanza (1–5)</span><select name="importanza">${[1,2,3,4,5].map(n=>`<option ${(p?p.importanza:3)===n?'selected':''}>${n}</option>`).join('')}</select></label>
    <label class="campo"><span>Indirizzo</span><input name="indirizzo" value="${esc(p?.indirizzo)}"></label>
    <label class="campo"><span>Referente e contatto</span><input name="contatto" value="${esc(p?.contatto)}"></label>
    <label class="campo"><span>Note</span><textarea name="note" rows="2">${esc(p?.note)}</textarea></label>
    <label class="spunta"><input type="checkbox" name="attiva" ${!p||p.attiva?'checked':''}> Attiva</label>
    ${p?`<button type="button" class="btn pic del" onclick="eliminaPiscina('${p.id}')">Elimina sede</button>`:''}`,
  async f=>{
    const rec={ nome:f.nome.value.trim().replace(/\s+/g,' '), importanza:+f.importanza.value, indirizzo:f.indirizzo.value.trim()||null,
      contatto:f.contatto.value.trim()||null, note:f.note.value.trim()||null, attiva:f.attiva.checked };
    const r = p ? await sb.from('tp_piscine').update(rec).eq('id',p.id) : await sb.from('tp_piscine').insert(rec);
    if(errore(r.error)) return false;
    toast('Sede salvata.'); await caricaTutto();
  }, 'Salva');
}
async function eliminaPiscina(id){
  const p=piscinaById(id);
  if(!confirm('Eliminare '+p.nome+'? Se ha già dei turni non si può: in quel caso togli la spunta “Attiva”.')) return;
  if(errore((await sb.from('tp_piscine').delete().eq('id',id)).error)) return;
  chiudiDialog(); toast('Sede eliminata.'); caricaTutto();
}

// ---------- finestra di dialogo ----------
function apriDialog(titolo, corpo, onSave, etichetta, chiudiTesto){
  const d=document.getElementById('dlg');
  d.innerHTML = `<form method="dialog" id="df">
    <div class="dlg-h">${esc(titolo)}<button type="button" class="btn pic" onclick="chiudiDialog()" aria-label="Chiudi">×</button></div>
    <div class="dlg-b">${corpo}</div>
    <div class="dlg-f"><button type="button" class="btn" onclick="chiudiDialog()">${onSave?'Annulla':(chiudiTesto||'Chiudi')}</button>${onSave?`<button class="btn pri">${esc(etichetta||'Salva')}</button>`:''}</div></form>`;
  const f=document.getElementById('df');
  f.onsubmit = async ev => {
    ev.preventDefault(); if(!onSave) return chiudiDialog();
    const bt=f.querySelector('.dlg-f .pri'); bt.disabled=true;
    const ok = await onSave(f); bt.disabled=false;
    if(ok!==false) chiudiDialog();
  };
  if(!d.open) d.showModal();
}
function chiudiDialog(){ const d=document.getElementById('dlg'); if(d.open) d.close(); }

avvio();
</script>
