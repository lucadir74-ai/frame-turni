<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame · Turni</title>
<link rel="icon" type="image/svg+xml" href="icona.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-org.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Turni">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --tile:#F4F4F5; --card:#fff; --ink:#111111; --muted:#6B6C70; --line:#E1E1E4;
  --water:#EB0089;--nero:#000000;--grigio:#818286; --water-soft:#FDE6F2; --red:#C8333A; --yellow:#EB0089; --ok:#2E7D4F; --warn:#B4541A;
  --f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fc:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tile);color:var(--ink);font:16px/1.45 var(--f)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

header{background:var(--nero);color:#fff;position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1100px;margin:0 auto}
.top h1{font:600 1.15rem var(--fc);margin:0;letter-spacing:.02em;flex:1;color:#fff;border-left:1px solid #444;padding-left:12px}
.logo{height:36px;width:auto;display:block}
.logo-login{width:220px;max-width:100%;height:auto;display:block;margin:0 0 14px}
.top .chi{font-size:.85rem;opacity:.85}
.top button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;font-size:.85rem}
.corsia{height:3px;background:var(--water)}
nav{display:flex;gap:4px;max-width:1100px;margin:0 auto;padding:0 12px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current=true]{opacity:1;border-bottom-color:var(--yellow)}

main{max-width:1100px;margin:0 auto;padding:16px}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.barra .mese{font:700 1.25rem var(--fc);min-width:9.5em;text-align:center;text-transform:capitalize}
.spazio{flex:1}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--water);border-color:var(--water);color:#fff}
.btn.pic{padding:4px 10px;font-size:.88rem}
.btn.del{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}

.giorno{margin:22px 0 8px;font:700 1.05rem var(--fc);text-transform:capitalize;display:flex;align-items:baseline;gap:10px}
.giorno small{font:500 .85rem var(--f);color:var(--muted);text-transform:none}
.evento{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.ev-head{display:flex;justify-content:space-between;gap:10px;font-size:1.1rem}
.ev-stat{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted);margin:8px 0 2px}
.ev-stat .pieno{color:var(--ok);font-weight:600}.ev-stat .manca{color:var(--warn);font-weight:600}.ev-stat .ko{color:var(--red);font-weight:600}
.ev-giorni{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.turno{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--water);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.turno.bozza{border-left-color:var(--grigio)}
.t-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.t-head b{font:700 1.15rem var(--fc)}
.t-ora{font-variant-numeric:tabular-nums;color:var(--muted)}
.stato{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--water-soft);color:var(--water)}
.stato.bozza{background:#EDF1F2;color:var(--muted)}
.turno.annullato{border-left-color:var(--red);background:#FAFAFA}
.turno.annullato .t-head b,.turno.annullato .t-ora{text-decoration:line-through;color:var(--muted)}
.stato.ann{background:#FBE9EA;color:var(--red)}
.rg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px;cursor:pointer;font-size:.92rem}
.rg:hover{background:var(--tile)}
.gr{display:flex;gap:10px;border-top:1px solid var(--line)}
.gr-d{flex:0 0 6em;font-weight:700;padding:10px 0 0 4px;text-transform:capitalize}
.gr-t{flex:1;min-width:0}
.gr .rg{border-top:0}.gr .rg+.rg{border-top:1px dashed var(--line)}
.rg .or{color:var(--muted);font-variant-numeric:tabular-nums;min-width:9.5em}
.rg .pp{color:var(--muted)}
.rg .pieno{color:var(--ok);font-weight:600}.rg .manca{color:var(--warn);font-weight:600}
.rg .sp{flex:1}.rg .chev{color:var(--muted);font-size:1.2rem;line-height:1}
.rg.ann{opacity:.6}.rg.ann .gg,.rg.ann .or{text-decoration:line-through}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer}.menu summary::-webkit-details-marker{display:none}
.menu-b{position:absolute;z-index:5;top:100%;left:0;margin-top:4px;display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap}
.cands{margin:10px 0}.cands-h{font-weight:600;font-size:.9rem;margin-bottom:4px}
.cd{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.cd .sp{flex:1}
.cs{font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.cs.ok{background:#E7F3EC;color:var(--ok)}.cs.att{background:#FDF0E6;color:var(--warn)}
#dlg .turno{margin:0;border:0;border-left:0;padding:0}
.ritiri{background:#FBE9EA;border:1px solid #F0C4C7;border-radius:10px;padding:10px 14px;margin:0 0 14px;color:var(--red)}
.ritiri .rit{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px;color:var(--ink)}
.griglia .fx button.sq{border-color:var(--water);background:var(--water);color:#fff}
.griglia .pisc .pieno{color:var(--ok);font-weight:700}
.griglia .pisc .manca{color:var(--warn);font-weight:700}
.vistab{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 12px}
.vistab button{border:0;background:var(--card);padding:6px 14px;font-weight:600;color:var(--muted)}
.vistab button[aria-current=true]{background:var(--ink);color:#fff}
.calo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calo .wd{text-align:center;font:600 .8rem var(--fc);color:var(--muted);padding:2px 0}
.calo .gg{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.calo .gg:hover{border-color:var(--water)}
.calo .gg.vuoto{background:transparent;border-color:transparent;cursor:default}
.calo .gg.off{background:#F8F8F9;cursor:default}
.calo .gg.off:hover{border-color:var(--line)}
.calo .gg.oggi{border-color:var(--ink)}
.calo .num{font:700 .85rem var(--fc)}
.calo .gg.off .num{color:#B5B6B9}
.calo .cr{display:flex;gap:5px;align-items:baseline;font-size:.78rem;border-left:4px solid var(--c);background:#FAFAFB;border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden}
.calo .cr b{color:var(--c)}
.calo .cr .pieno{color:var(--ok);font-weight:700}
.calo .cr .manca{color:var(--warn);font-weight:700}
.calo .cr .pub{color:var(--water)}
.calo .cr .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.calo .cr.ann{opacity:.5;text-decoration:line-through}
.gct{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.gcl{margin:8px 0}
.gcr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.gca{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gca select{border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;flex:1;min-width:150px}
@media (max-width:700px){ .calo .cr .nm{display:none} .calo .gg{min-height:70px} }
@media (max-width:480px){ .calo{gap:3px} .calo .gg{padding:3px 2px;min-height:58px} .calo .cr{font-size:.66rem;gap:2px;padding:1px 2px;border-left-width:3px} .calo .wd{font-size:.7rem} }
.pres{font-size:.88rem;margin:6px 0 0}
.pres.ok{color:var(--ok);font-weight:600}
.pres.da{color:var(--warn);font-weight:600}
.riga-pres{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.riga-pres select,.riga-pres input[type=time]{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
.riep{border-collapse:collapse;width:100%;font-size:.92rem}
.riep th,.riep td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.riep th:first-child,.riep td:first-child{text-align:left}
.riep th{color:var(--muted);font-weight:600}
.riep tfoot td{font-weight:700}
.imp{display:inline-flex;gap:2px;vertical-align:middle}
.imp i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.imp i.on{background:var(--water)}
.req{display:flex;gap:14px;margin:8px 0;font-size:.9rem;color:var(--muted)}
.req .pieno{color:var(--ok);font-weight:600}
.req .manca{color:var(--warn);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sedi{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sedi button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600}
.sedi button[aria-current=true]{background:var(--water);border-color:var(--water);color:#fff}
.sedi button small{font-weight:500;opacity:.75;margin-left:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--tile);border:1px solid var(--line);border-radius:99px;padding:3px 4px 3px 10px;font-size:.9rem}
.chip .r{font:700 .72rem var(--fc);background:var(--water);color:#fff;border-radius:4px;padding:0 5px}
.chip .r.S{background:var(--grigio)}
.chip button{border:0;background:none;color:var(--muted);font-size:1rem;line-height:1;padding:2px 6px;border-radius:99px}
.avvisi{margin:8px 0 0;padding:0;list-style:none;font-size:.86rem;color:var(--warn)}
.azioni{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.note{font-size:.88rem;color:var(--muted);margin-top:4px}

.lista{display:grid;gap:8px}
.riga{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.riga.off{opacity:.5}
.riga b{font:700 1.05rem var(--fc);min-width:8em}
.riga .info{color:var(--muted);font-size:.9rem;flex:1}
.stelle{color:var(--yellow);letter-spacing:1px}
.tag{font-size:.75rem;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}

.vuoto{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}

.griglia{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
.griglia table{border-collapse:collapse;font-size:.82rem}
.griglia th,.griglia td{border-bottom:1px solid var(--line);padding:4px;text-align:center}
.griglia th{font-weight:600;color:var(--muted);white-space:nowrap}
.griglia th.ev{color:var(--water);vertical-align:top}
.griglia .pisc{font-weight:500;font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.25}
.griglia .pisc .ore{font-variant-numeric:tabular-nums;white-space:nowrap}
.griglia th.ev::after{content:'';display:block;height:3px;background:var(--water);border-radius:2px;margin-top:2px}
.griglia .nome{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;padding:4px 10px;white-space:nowrap;z-index:1}
.fx{display:flex;gap:2px;justify-content:center}
.fx button{width:22px;height:22px;border:1px solid var(--line);border-radius:4px;background:#fff;font:700 .7rem var(--fc);color:#B5B6B9;padding:0}
.fx button.si{background:var(--ok);border-color:var(--ok);color:#fff}

dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:90vh;color:var(--ink)}
dialog::backdrop{background:rgba(18,48,58,.45)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font:700 1.15rem var(--fc);display:flex;justify-content:space-between;align-items:center}
.dlg-b{padding:16px 18px;overflow:auto;max-height:calc(90vh - 130px)}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.campo{display:grid;gap:4px;margin-bottom:12px}
.campo span{font-size:.85rem;font-weight:600;color:var(--muted)}
.campo input,.campo select,.campo textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spunta{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:500}
.spunta input{width:18px;height:18px}

.cand{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cand .n{font-weight:600}
.cand .d{grid-column:1;font-size:.84rem;color:var(--muted)}
.cand .d .ok{color:var(--ok);font-weight:600}
.cand .d .ko{color:var(--warn);font-weight:600}
.cand .b{grid-row:1 / span 2;grid-column:2;display:flex;gap:6px}

.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.login .corpo{padding:22px}
.login h1{font:700 1.5rem var(--fc);margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 18px}
.pwbox{position:relative;display:block}
.pwbox input{padding-right:5.5em!important}
.pwvedi{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;border-radius:6px;padding:6px 8px;color:var(--water);font-weight:600;font-size:.88rem}
.link-btn{background:none;border:0;padding:0;margin-top:14px;color:var(--water);font-weight:600;text-decoration:underline;text-underline-offset:3px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:.92rem;display:none;z-index:50;max-width:92vw}
#toast.err{background:var(--red)}
/* calendario posti dell'evento */
dialog.largo{width:min(760px,96vw)}
.ecb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.ecm{font:700 1rem var(--fc);text-transform:capitalize;margin:14px 0 6px}
.ecal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.ecal .wd{text-align:center;font:600 .72rem var(--fc);color:var(--muted)}
.ecal .eg{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:58px;padding:3px 4px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;position:relative}
.ecal .eg.nul{background:transparent;border-color:transparent}
.ecal .eg.fuori{background:#F8F8F9;color:#B5B6B9}
.ecal button.eg:hover{border-color:var(--water)}
.ecal .eg.sel{border:2px solid var(--water);background:var(--water-soft)}
.ecal .eg.mod::after{content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.ecal .n{font:700 .8rem var(--fc)}
.ecal .tr{display:flex;align-items:center;gap:2px;font:700 .66rem var(--fc);color:var(--muted);white-space:nowrap;overflow:hidden}
.ecal .tr.ann{text-decoration:line-through;opacity:.6}
.po{display:inline-block;width:7px;height:7px;border-radius:2px;border:1.5px solid var(--water);background:var(--water);flex:0 0 auto}
.po.S{border-color:var(--grigio);background:var(--grigio)}
.po.x{background:transparent;opacity:.5}
.pos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pos button{border:2px solid var(--water);background:var(--water);color:#fff;border-radius:10px;padding:8px 10px;font-weight:600;min-width:7.5em;text-align:left;line-height:1.2}
.pos button.S{border-color:var(--grigio);background:var(--grigio)}
.pos button.x{background:#fff;color:var(--muted);border-style:dashed}
.pos button small{display:block;font-weight:500;font-size:.75rem;opacity:.9}
.ecsel{position:sticky;bottom:-16px;background:var(--card);border-top:2px solid var(--water);padding:8px 0 12px;margin-top:12px;box-shadow:0 -6px 10px rgba(0,0,0,.06)}
.ecsel label{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.9rem}
.ecgt{border:1px solid var(--line);border-left:6px solid var(--water);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ecgt.ann{border-left-color:var(--red);background:#FAFAFA}
.ecr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.ecr select,.ecr input{border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit}
/* bottoni secondari: tutti visibili su computer, in un menu su telefono */
.altre{position:relative;display:contents}
.altre-t{display:none}
.altre-b{display:contents}
/* telefono: area organizzatori */
@media (max-width:640px){
  .top{padding:10px 12px;gap:10px}
  .top .chi{display:none}
  .logo{height:30px}
  nav{padding:0 4px;gap:0}
  nav button{padding:10px 8px;font-size:.88rem}
  main{padding:12px}
  .barra{gap:6px}
  .barra .mese{font-size:1.1rem;min-width:0;flex:1}
  .barra .spazio{flex-basis:100%;height:0}
  .altre{display:block}
  .altre-t{display:inline-block}
  .altre-b{display:none;position:absolute;z-index:6;top:100%;left:0;margin-top:4px;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 18px rgba(0,0,0,.15);min-width:15em}
  .altre.on .altre-b{display:flex}
  .altre-b .btn{text-align:left}
  .evento{padding:10px 10px 10px 12px;border-left-width:6px}
  .gr{flex-direction:column;gap:0}
  .gr-d{flex:none;padding:8px 4px 0;font-size:.95rem}
  .rg{padding:6px 4px 8px;gap:2px 10px}
  .rg .or{min-width:0;width:100%;color:var(--ink);font-weight:600}
  .menu-b{left:auto;right:0}
  .dlg-h{padding:12px 14px}
  .dlg-b{padding:14px}
  .dlg-f{padding:10px 14px}
  .cd .tag{display:none}
  .riga b{min-width:0}
}
@media (max-width:560px){ .due{grid-template-columns:1fr} .barra .mese{min-width:auto} .ecal .eg{min-height:52px;padding:2px} .ecal .tr{gap:1px;font-size:.6rem} .ecal .tr span{display:none} .ecal .po{width:5px;height:5px;border-width:1px} .ecsel .note{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
// URL e chiave del database stanno nel file config.js (separato, così gli aggiornamenti di index.html non li cancellano)
const SUPABASE_URL = window.SUPABASE_URL || '';
const SUPABASE_KEY = window.SUPABASE_KEY || '';
let sb = null;
const RUOLI = { F:'Fotografo', S:'Stampatore', FS:'Foto e stampa' };
const S = { me:null, tab:'turni', mese:meseOggi(), collab:[], piscine:[], turni:[], ass:[], disp:[] };

// ---------- utilità ----------
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function meseOggi(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function oggi(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function limitiMese(ym){ const [y,m]=ym.split('-').map(Number); const ult=new Date(y,m,0).getDate(); return [ym+'-01', ym+'-'+pad(ult), ult]; }
function spostaMese(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+pad(m); }
function nomeMese(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'}); }
function nomeGiorno(d){ const [y,m,g]=d.split('-').map(Number); return new Date(y,m-1,g).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}); }
function hm(t){ return (t||'').slice(0,5); }
// menu a tendina per gli orari (ogni 30 minuti; l'orario già salvato compare comunque anche se non è su questa griglia)
function selOra(name, val, o={}){
  val=hm(val||''); const v=[];
  for(let m=360; m<=1410; m+=(o.passo||30)) v.push(pad(Math.floor(m/60))+':'+pad(m%60));
  if(val && !v.includes(val)){ v.push(val); v.sort(); }
  return `<select name="${name}"${o.label?` aria-label="${esc(o.label)}"`:''}>${o.vuoto?'<option value="">—</option>':''}${v.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select>`;
}
function stelle(n){ return '★'.repeat(n)+'☆'.repeat(5-n); }
function puntini(n){ return '<span class="imp" title="Importanza '+n+' su 5">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</span>'; }
function toast(msg, err){ const t=document.getElementById('toast'); t.textContent=msg; t.className=err?'err':''; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', err?6000:2500); }
function errore(e){
  if(!e) return false;
  let m = e.message || String(e);
  if(e.code==='23505') m='Esiste già un elemento uguale (stesso nome, oppure stessa sede, data e ora).';
  if(e.code==='23503') m='Non si può eliminare: è usato in qualche turno. Puoi disattivarlo invece.';
  toast(m,true); return true;
}
const collabById = id => S.collab.find(c=>c.id===id);
const piscinaById = id => S.piscine.find(p=>p.id===id);
// colore della sede nel calendario dei ragazzi (stessa regola di calendario.html)
const PALETTE=['#EB0089','#1E6FD9','#E07B00','#2E9D5B','#7B3FC4','#00A3A3','#C8333A','#6B6C70'];
function coloreSede(p){ if(p && p.colore) return p.colore; if(!p){ const usati=S.piscine.map(x=>x.colore); const libero=PALETTE.find(c=>!usati.includes(c)); if(libero) return libero; } let h=0; for(const ch of String(p?.id||'')) h=(h*31+ch.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }

function minuti(s){ const [h,m]=hm(s).split(':').map(Number); return h*60+(m||0); }
// fascia di un turno: G = tutto il giorno (inizia prima delle 13 e finisce dalle 15 in poi), M = mattina (inizia prima delle 13), P = pomeriggio (dalle 13)
// (stessa regola in calendario.html)
function fasciaDi(t){ const i=hm(t.ora_inizio), f=hm(t.ora_fine); return i<'13:00' ? (f>='15:00'?'G':'M') : 'P'; }
const NOMI_FASCIA={ M:'Mattina', P:'Pomeriggio', G:'Tutto il giorno' };
const ORDINE_FASCIA={ M:0, G:1, P:2 };
// modalità dell'evento: 'mp' = mattina e/o pomeriggio, 'giorno' = un turno unico (orari in m_inizio/m_fine)
// se la colonna modalita non c'è ancora nel database, la deduce dagli orari
function modoEvento(e){ if(e && e.modalita) return e.modalita; return e && e.m_inizio && !e.p_inizio && hm(e.m_inizio)<'13:00' && hm(e.m_fine)>='15:00' ? 'giorno' : 'mp'; }
function fasceEvento(e){
  if(modoEvento(e)==='giorno') return e.m_inizio ? { G:[hm(e.m_inizio),hm(e.m_fine)] } : {};
  const o={}; if(e.m_inizio) o.M=[hm(e.m_inizio),hm(e.m_fine)]; if(e.p_inizio) o.P=[hm(e.p_inizio),hm(e.p_fine)]; return o;
}
function testoFasce(e){
  const fe=fasceEvento(e);
  return ['M','G','P'].filter(k=>fe[k]).map(k=>(k==='G'?'tutto il giorno ':NOMI_FASCIA[k].toLowerCase()+' ')+fe[k][0]+'–'+fe[k][1]).join(' · ');
}
const siSovrappone = (a,b) => hm(a.ora_inizio)<hm(b.ora_fine) && hm(b.ora_inizio)<hm(a.ora_fine);
// salva un evento provando con la colonna "modalita"; se il database non l'ha ancora, salva senza (la modalità si deduce dagli orari)
async function salvaEventoDb(rec, id){
  const q = r => id ? sb.from('tp_eventi').update(r).eq('id',id).select().single() : sb.from('tp_eventi').insert(r).select().single();
  let res = await q(rec);
  if(res.error && /modalita/i.test(res.error.message||'')){ const { modalita, ...resto } = rec; res = await q(resto); }
  return res;
}
// controlla gli orari di un evento/giorno; restituisce {M,P} oppure {G}, o un messaggio di errore
function leggiFasce(modo, v){
  const nf={};
  if(modo==='giorno'){
    const [i,fi]=v.G||[];
    if(!i||!fi||fi<=i) return 'Controlla gli orari di inizio e fine.';
    if(i>='13:00'||fi<'15:00') return 'Per “tutto il giorno” l\'orario deve iniziare prima delle 13 e finire dalle 15 in poi (altrimenti usa mattina o pomeriggio).';
    nf.G=[i,fi]; return nf;
  }
  for(const [k,nome] of [['M','mattina'],['P','pomeriggio']]){
    const [i,fi]=v[k]||[];
    if(!i&&!fi) continue;
    if(!i||!fi||fi<=i) return 'Controlla gli orari del '+nome+'.';
    nf[k]=[i,fi];
  }
  if(!nf.M && !nf.P) return 'Serve almeno la mattina o il pomeriggio.';
  if(nf.M && nf.M[0]>='13:00') return 'La mattina deve iniziare prima delle 13.';
  if(nf.M && nf.M[1]>='15:00') return 'La mattina deve finire prima delle 15 (per un turno unico scegli “tutto il giorno”).';
  if(nf.P && nf.P[0]<'13:00') return 'Il pomeriggio deve iniziare dalle 13 in poi.';
  if(nf.M && nf.P && nf.P[0]<nf.M[1]) return 'Il pomeriggio deve iniziare dopo la fine della mattina.';
  return nf;
}

// ---------- accesso ----------
async function avvio(){
  const msg = t => document.getElementById('app').innerHTML='<div class="login"><div class="corsia"></div><div class="corpo"><h1>Configurazione mancante</h1><p>'+t+'</p></div></div>';
  if(!window.supabase) return msg('La libreria del database non si è caricata. Controlla la connessione e ricarica la pagina.');
  if(!/^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) || !SUPABASE_KEY || SUPABASE_KEY.startsWith('INCOLLA')) return msg('Manca il file config.js oppure URL e chiave non sono compilati.');
  // arrivo dal link "recupera password" dell'email: l'indirizzo contiene #...type=recovery (o un errore se il link è scaduto)
  const h = new URLSearchParams(location.hash.slice(1));
  const recupero = h.get('type')==='recovery', erroreLink = h.get('error_description') || h.get('error');
  try{ sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ return msg('URL o chiave in config.js non validi: '+esc(e.message)); }
  const { data:{ session } } = await sb.auth.getSession();
  if(recupero || erroreLink) history.replaceState(null, '', location.pathname + location.search);
  if(erroreLink && !session) return schermataLogin('Il link per cambiare la password non è valido o è scaduto: richiedine uno nuovo con “Password dimenticata?”.');
  if(recupero && session) return schermataNuovaPassword(session.user);
  if(session) dopoLogin(session.user); else schermataLogin();
}

// campo password con il tasto "Mostra" / "Nascondi"
function campoPw(name, auto, extra){
  return `<span class="pwbox"><input name="${name}" type="password" autocomplete="${auto}" required${extra||''}><button type="button" class="pwvedi" aria-label="Mostra password" aria-pressed="false" onclick="vediPw(this)">Mostra</button></span>`;
}
function vediPw(b){
  const i=b.previousElementSibling, vedi=i.type==='password';
  i.type=vedi?'text':'password'; b.textContent=vedi?'Nascondi':'Mostra';
  b.setAttribute('aria-pressed',vedi); b.setAttribute('aria-label',vedi?'Nascondi password':'Mostra password'); i.focus();
}

  document.getElementById('fr').onsubmit = async ev => {

}
function schermataNuovaPassword(user){
  document.getElementById('app').innerHTML = `
  <div class="login"><div class="corsia"></div><div class="corpo">
    <img class="logo-login" src="logo-nero.png" alt="Frame About You"><h1>Nuova password</h1>
    <p>Scegli la nuova password per ${esc(user.email||'il tuo account')}.</p>
    <form id="fn">
      <label class="campo"><span>Nuova password (almeno 8 caratteri)</span>${campoPw('p1','new-password',' minlength="8"')}</label>
      <label class="campo"><span>Ripeti la password</span>${campoPw('p2','new-password',' minlength="8"')}</label>
      <button class="btn pri" style="width:100%">Salva ed entra</button>
    </form>
  </div></div>`;
  document.getElementById('fn').onsubmit = async ev => {
    ev.preventDefault(); const f=ev.target;
    if(f.p1.value.length<8){ toast('La password deve avere almeno 8 caratteri.',true); return; }
    if(f.p1.value!==f.p2.value){ toast('Le due password non sono uguali.',true); return; }
    const b=f.querySelector('button'); b.disabled=true;
    const { data, error } = await sb.auth.updateUser({ password:f.p1.value });
    b.disabled=false;
    if(error){
      const m=error.message||'';
      toast(/different from the old/i.test(m)?'La nuova password deve essere diversa da quella vecchia.'
        : /weak|least|characters/i.test(m)?'Password troppo semplice: usane una più lunga, con lettere e numeri.'
        : /session|expired|jwt/i.test(m)?'Il link è scaduto: richiedine uno nuovo.' : 'Password non salvata: '+m, true);
      return;
    }

function schermataLogin(msg){
  document.getElementById('app').innerHTML = `
  <div class="login"><div class="corsia"></div><div class="corpo">
    <img class="logo-login" src="logo-nero.png" alt="Frame About You"><h1>Turni</h1><p>Accesso organizzatori</p>
    <form id="fl">

    </form>
    <button type="button" class="link-btn" onclick="schermataRecupero(document.querySelector('#fl [name=email]').value.trim())">Password dimenticata?</button>
    ${msg?'<p style="color:var(--red);margin-top:12px">'+esc(msg)+'</p>':''}
  </div></div>`;
  document.getElementById('fl').onsubmit = async ev => {
    ev.preventDefault(); const f=ev.target;
    const { data, error } = await sb.auth.signInWithPassword({ email:f.email.value.trim(), password:f.pw.value });
    if(error){
      const m=error.message||'';
      return schermataLogin(/not confirmed/i.test(m) ? 'Questa email non è ancora confermata: chiedi agli organizzatori di confermarla in Supabase.'
        : (error.status===429 || /rate limit|too many/i.test(m)) ? 'Troppi tentativi: aspetta qualche minuto e riprova.'
        : /invalid login credentials/i.test(m) ? 'Email o password non corrette.'
        : 'Accesso non riuscito: '+m);
    }
    dopoLogin(data.user);
  };
}

async function esci(){ await sb.auth.signOut(); S.me=null; schermataLogin(); }

async function dopoLogin(user){
  const { data, error } = await sb.from('tp_collaboratori').select('*');
  if(errore(error)) return;
  S.me = (data||[]).find(c => (c.email||'').toLowerCase() === (user.email||'').toLowerCase() && c.attivo);
  if(!S.me){
    document.getElementById('app').innerHTML='<div class="login"><div class="corsia"></div><div class="corpo"><h1>Account non collegato</h1><p>Questa email non risulta tra i collaboratori attivi. Chiedi agli organizzatori di inserirla nella tua scheda.</p><button class="btn" onclick="esci()">Esci</button></div></div>';
    return;
  }
  if(!S.me.organizzatore){
    document.getElementById('app').innerHTML='<div class="login"><div class="corsia"></div><div class="corpo"><h1>Ciao '+esc(S.me.nome)+'</h1><p>L\'area collaboratori (disponibilità, turni e incassi) è in preparazione.</p><button class="btn" onclick="esci()">Esci</button></div></div>';
    return;
  }
  S.collab = data;
  await caricaTutto();
}

// ---------- dati ----------
async function caricaAnagrafiche(){
  const [c,p] = await Promise.all([
    sb.from('tp_collaboratori').select('*').order('nome'),
    sb.from('tp_piscine').select('*').order('nome')
  ]);
  if(errore(c.error)||errore(p.error)) return;
  S.collab=c.data; S.piscine=p.data;
}
async function caricaMese(){
  const [da,a] = limitiMese(S.mese);
  const [t,d] = await Promise.all([
    sb.from('tp_turni').select('*').gte('data',da).lte('data',a).order('data').order('ora_inizio'),
    sb.from('tp_disponibilita').select('*').gte('data',da).lte('data',a)
  ]);
  if(errore(t.error)||errore(d.error)) return;
  const ev = await sb.from('tp_eventi').select('*').lte('data_inizio',a).gte('data_fine',da);
  if(errore(ev.error)) return;
  S.eventi=ev.data;
  S.turni=t.data; S.disp=d.data; S.ass=[]; S.incassi=[]; S.spese=[]; S.compensi=[]; S.cand=[];
  const rt = await sb.from('tp_ritiri').select('*, tp_turni(data,ora_inizio,ora_fine,piscina_id)').eq('visto',false).order('creato');
  S.ritiri = rt.error ? [] : rt.data;
  if(S.turni.length){
    const ids=S.turni.map(x=>x.id);
    const [r,kc,i,sp] = await Promise.all([
      sb.from('tp_assegnazioni').select('*').in('turno_id', ids),
      sb.from('tp_candidature').select('*').in('turno_id', ids),
      sb.from('tp_incassi').select('*').in('turno_id', ids),
      sb.from('tp_spese').select('*').in('turno_id', ids)
    ]);
    if(errore(r.error)||errore(i.error)||errore(sp.error)||errore(kc.error)) return;
    S.cand=kc.data; S.ass=r.data; S.incassi=i.data; S.spese=sp.data; S.compensi=[];
    if(S.ass.length){
      const k = await sb.from('tp_compensi').select('*').in('assegnazione_id', S.ass.map(x=>x.id));
      if(errore(k.error)) return; S.compensi=k.data;
    }
  }
}
async function caricaTutto(){ await caricaAnagrafiche(); await caricaMese(); disegna(); }
async function ricarica(){ await caricaMese(); disegna(); }

// ---------- TURNI ----------
function analisiTurno(t){
  const ass = S.ass.filter(a=>a.turno_id===t.id);
  const nF = ass.filter(a=>a.ruolo==='F').length, nS = ass.filter(a=>a.ruolo==='S').length;
  const avvisi=[];
  if(t.annullato) return { ass, nF, nS, avvisi };
  if(ass.length && !ass.some(a=>collabById(a.collaboratore_id)?.auto)) avvisi.push('Nessuno della squadra ha la macchina');
  ass.forEach(a=>{
    const c=collabById(a.collaboratore_id); if(!c) return;
    const st=statoPersona(c,t);
    if(st.conflitto) avvisi.push(c.nome+' è in un altro turno alla stessa ora');
    else if(st.disp===false) avvisi.push(c.nome+' non si è candidato a questo turno');
  });
  return { ass, nF, nS, avvisi };
}

  const m=document.getElementById('main');
  const bozze=S.turni.filter(t=>!t.pubblicato && !t.annullato).length;
  // su telefono i bottoni secondari stanno in "Altre azioni", su computer si vedono tutti
  let h = barraMese(`<div class="altre"><button type="button" class="btn altre-t" onclick="this.parentNode.classList.toggle('on')" aria-label="Altre azioni">Altre azioni ▾</button><div class="altre-b" onclick="this.parentNode.classList.remove('on')">

  if(S.ritiri && S.ritiri.length) h+='<div class="ritiri"><b>Ritiri da gestire</b>'+S.ritiri.map(r=>{const t=r.tp_turni||{}; const c=collabById(r.collaboratore_id)||{nome:'?'};
    return `<div class="rit"><span>${esc(c.nome)} si è ritirato/a da <b>${esc((piscinaById(t.piscina_id)||{nome:'?'}).nome)}</b>, ${t.data?nomeGiorno(t.data):''} ${hm(t.ora_inizio)}–${hm(t.ora_fine)}: era in squadra, il posto è scoperto.</span><button class="btn pic" onclick="ritiroVisto('${r.id}')">Visto</button></div>`}).join('')+'</div>';
  if(!S.piscine.some(p=>p.attiva)){ m.innerHTML=h+'<div class="vuoto">Prima inserisci le sedi nella scheda Sedi, poi potrai creare gli eventi.</div>'; return; }
  const eventi=[...(S.eventi||[])].sort((x,y)=>x.data_inizio.localeCompare(y.data_inizio));
  const senza=S.turni.filter(t=>!t.evento_id || !eventi.some(e=>e.id===t.evento_id));
  if(!eventi.length && !senza.length){ m.innerHTML=h+'<div class="vuoto">Nessun evento in questo mese. Crea il primo con “Nuovo evento”.</div>'; return; }
  eventi.forEach(e=>{ h+=cardEvento(e, S.turni.filter(t=>t.evento_id===e.id)); });
  if(senza.length) h+=cardEvento(null, senza);
  m.innerHTML=h;
}
function periodoEvento(e){
  const f=d=>{ const [y,m,g]=d.split('-').map(Number); return new Date(y,m-1,g).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}); };
  return e.data_inizio===e.data_fine ? f(e.data_inizio) : 'dal '+f(e.data_inizio)+' al '+f(e.data_fine);
}
function cardEvento(e, turni){
  const p = piscinaById(e ? e.piscina_id : turni[0]?.piscina_id) || {nome:'?'};
  const key = e ? e.id : 'senza';
  if(!S.aperti) S.aperti={};
  const aperto = key in S.aperti ? S.aperti[key] : turni.length<=8;
  const validi=turni.filter(t=>!t.annullato), ann=turni.length-validi.length;
  const coperti=validi.filter(t=>S.cand.filter(k=>k.turno_id===t.id).length >= (t.fotografi||0)+(t.stampatori||0)).length;
  const pubb=validi.filter(t=>t.pubblicato).length;
  const fasce=e ? testoFasce(e) : '';
  let h=`<div class="evento" style="--c:${coloreSede(p)}">
    <div class="ev-head"><div><b>${esc(e?.nome||p.nome)}</b>${e && e.nome && e.nome!==p.nome?` <span class="note">${esc(p.nome)}</span>`:''}
      <div class="note">${e?periodoEvento(e)+(fasce?' · '+fasce:'')+' · '+e.fotografi+' foto + '+e.stampatori+' stampa':'Turni senza evento'}</div></div></div>
    <div class="ev-stat"><span>${turni.length} turni questo mese</span>${validi.length?`<span class="${coperti>=validi.length?'pieno':'manca'}">candidati sufficienti ${coperti}/${validi.length}</span><span>squadre pubblicate ${pubb}/${validi.length}</span>`:''}${ann?`<span class="ko">annullati ${ann}</span>`:''}</div>
    <div class="azioni"><button class="btn pic ${aperto?'':'pri'}" onclick="apriEvento('${key}',${!aperto})">${aperto?'Nascondi turni':'Mostra turni'}</button>
      ${e && validi.length>pubb?`<button class="btn pic pri" onclick="pubblicaEvento('${e.id}')">Pubblica squadre (${validi.length-pubb})</button>`:''}
      ${e?`<button class="btn pic" onclick="apriCalEvento('${e.id}')">Calendario posti</button><button class="btn pic" onclick="formEvento('${e.id}')">Modifica evento</button><details class="menu"><summary class="btn pic" aria-label="Altre azioni">⋯</summary><div class="menu-b"><button class="btn pic del" onclick="eliminaEvento('${e.id}')">Elimina evento</button></div></details>`:''}</div>`;
  if(aperto && turni.length) h+='<div class="ev-giorni">'+[...new Set(turni.map(t=>t.data))].map(g=>{
    const [y,m,d]=g.split('-').map(Number), giorno=new Date(y,m-1,d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
    return `<div class="gr"><div class="gr-d">${giorno}</div><div class="gr-t">${turni.filter(t=>t.data===g).map(rigaTurno).join('')}</div></div>`; }).join('')+'</div>';
  return h+'</div>';
}
// una riga per turno: il dettaglio con tutti i bottoni si apre toccandola

function fasceDalForm(f){ return leggiFasce(f.modo.value, { M:[f.m_inizio.value,f.m_fine.value], P:[f.p_inizio.value,f.p_fine.value], G:[f.g_inizio.value,f.g_fine.value] }); }
function recFasce(modo, nf){
  return modo==='giorno'
    ? { modalita:'giorno', m_inizio:nf.G[0], m_fine:nf.G[1], p_inizio:null, p_fine:null }

function formTurno(id){
  const t = id ? S.turni.find(x=>x.id===id) : null;
  const [da,a]=limitiMese(S.mese); const o=oggi();
  const dataDef = t ? t.data : (o>=da&&o<=a ? o : da);
  const opz = S.piscine.filter(p=>p.attiva || (t&&p.id===t.piscina_id)).map(p=>`<option value="${p.id}" ${t&&t.piscina_id===p.id?'selected':''}>${esc(p.nome)}</option>`).join('');
  const orari = t ? `<div class="due">
      <label class="campo"><span>Inizio</span>${selOra('ora_inizio',t.ora_inizio)}</label>
      <label class="campo"><span>Fine</span>${selOra('ora_fine',t.ora_fine)}</label></div>`
    : campiModalita('mp', {M:['09:00','13:00']});
  apriDialog(t?'Modifica giorno':'Nuovo evento', `
    ${t?'':'<label class="campo"><span>Nome evento (facoltativo)</span><input name="nome" placeholder="es. Christmas World 2026 — se vuoto, il nome della sede"></label>'}
    <label class="campo"><span>Sede</span><select name="piscina_id" required>${opz}</select></label>
    ${t?`<label class="campo"><span>Data</span><input type="date" name="data" value="${dataDef}" required></label>`
      :`<div class="due">
      <label class="campo"><span>Data (o primo giorno)</span><input type="date" name="data" value="${dataDef}" required></label>
      <label class="campo"><span>Fino al (facoltativo)</span><input type="date" name="data_fine"></label>
    </div>
    <p class="note" style="margin:-4px 0 12px">Con “Fino al” si creano i turni per ogni giorno, dal primo all’ultimo compresi. I giorni di chiusura poi si eliminano uno per uno.</p>`}
    ${orari}
    <div class="due">
      <label class="campo"><span>Fotografi richiesti</span><input type="number" min="0" max="9" name="fotografi" value="${t?t.fotografi:2}" required></label>
      <label class="campo"><span>Stampatori richiesti</span><input type="number" min="1" max="9" name="stampatori" value="${t?t.stampatori:2}" required></label>
    </div>
    ${t?'':'<p class="note" style="margin:-4px 0 12px">Sono i posti di ogni turno (di solito 2 foto + 2 stampa). Poi, nel “Calendario posti” dell\'evento, si chiudono i posti che non servono nei singoli giorni.</p>'}
    <label class="campo"><span>Note</span><textarea name="note" rows="2">${esc(t?.note)}</textarea></label>`,
  async f=>{
    const base={ piscina_id:f.piscina_id.value, fotografi:+f.fotografi.value, stampatori:+f.stampatori.value, note:f.note.value.trim()||null };
    if(t){
      const rec={...base, data:f.data.value, ora_inizio:f.ora_inizio.value, ora_fine:f.ora_fine.value};
      if(rec.ora_fine<=rec.ora_inizio){ toast('L\'ora di fine deve essere dopo l\'inizio.',true); return false; }
      if(errore((await sb.from('tp_turni').update(rec).eq('id',t.id)).error)) return false;
      if(rec.data.slice(0,7)!==S.mese) S.mese=rec.data.slice(0,7);
      toast('Turno salvato.'); await ricarica(); return;
    }
    if(base.stampatori<1){ toast('Ogni turno deve avere almeno uno stampatore.',true); return false; }
    // fasce compilate: mattina e/o pomeriggio, oppure tutto il giorno
    const nf=fasceDalForm(f);
    if(typeof nf==='string'){ toast(nf,true); return false; }
    const fasce=['M','G','P'].filter(k=>nf[k]).map(k=>nf[k]);
    const primo=f.data.value, fine=f.data_fine.value||primo;
    if(fine<primo){ toast('“Fino al” deve essere dopo il primo giorno.',true); return false; }
    const date=[]; const d=new Date(primo+'T12:00:00Z');
    while(d.toISOString().slice(0,10)<=fine){ date.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); }
    if(date.length>62){ toast('Massimo 62 giorni alla volta.',true); return false; }
    // salta i turni che esistono già (stessa sede, giorno e ora di inizio)
    const es = await sb.from('tp_turni').select('data,ora_inizio').eq('piscina_id',base.piscina_id).gte('data',primo).lte('data',fine);
    if(errore(es.error)) return false;
    const gia=new Set((es.data||[]).map(x=>x.data+'|'+hm(x.ora_inizio)));
    const tutti=[]; date.forEach(x=>fasce.forEach(([i,e])=>tutti.push({...base, data:x, ora_inizio:i, ora_fine:e})));
    const nuovi=tutti.filter(r=>!gia.has(r.data+'|'+r.ora_inizio)), saltati=tutti.length-nuovi.length;
    if(!nuovi.length){ toast('Questi turni esistono già tutti.',true); return false; }
    if(nuovi.length>1){
      const it=x=>x.split('-').reverse().join('/');
      if(!confirm('Creo l\'evento con '+nuovi.length+' turni ('+fasce.map(([i,e])=>i+'–'+e).join(' e ')+'), dal '+it(primo)+' al '+it(fine)+(saltati?' (salto '+saltati+' turni già presenti)':'')+'. Procedo?')) return false;
    }
    const evRec={ piscina_id:base.piscina_id, nome:f.nome.value.trim()||(piscinaById(base.piscina_id)||{}).nome||null, data_inizio:primo, data_fine:fine,
      ...recFasce(f.modo.value, nf), fotografi:base.fotografi, stampatori:base.stampatori, note:base.note };
    const ev=await salvaEventoDb(evRec);
    if(errore(ev.error)) return false;
    const ins=await sb.from('tp_turni').insert(nuovi.map(r=>({...r, evento_id:ev.data.id})));
    if(ins.error){ await sb.from('tp_eventi').delete().eq('id',ev.data.id); errore(ins.error); return false; }
    if(primo.slice(0,7)!==S.mese) S.mese=primo.slice(0,7);
    toast('Evento creato: '+nuovi.length+(nuovi.length===1?' turno.':' turni.')); await ricarica();
  }, t?'Salva':'Crea evento');
}

    if(f.azione.value==='orari'){
      if(!f.ini.value||!f.fin.value||f.fin.value<=f.ini.value){ toast('Inserisci un orario di inizio e una fine successiva.',true); return false; }
      if(new Set(scelti.map(t=>t.data)).size<scelti.length){ toast('Per cambiare gli orari scegli “Solo mattina”, “Solo pomeriggio” o “Solo tutto il giorno”: altrimenti due turni dello stesso giorno avrebbero lo stesso orario.',true); return false; }
      if(!confirm('Imposto l\'orario '+f.ini.value+'–'+f.fin.value+' su '+quali+'. Procedo?')) return false;
      rec={ora_inizio:f.ini.value, ora_fine:f.fin.value};
    } else if(f.azione.value==='posti'){
      if(!confirm('Imposto '+f.fot.value+' fotografi e '+f.sta.value+' stampatori su '+quali+'. Procedo?')) return false;
      rec={fotografi:+f.fot.value, stampatori:+f.sta.value};
    } else {
      if(!confirm('ELIMINO '+quali+', con candidature e assegnazioni. Non si può annullare. Procedo?')) return false;
    }
    for(let i=0;i<ids.length;i+=100){
      const parte=ids.slice(i,i+100);
      const q = rec ? sb.from('tp_turni').update(rec).in('id',parte) : sb.from('tp_turni').delete().in('id',parte);
      if(errore((await q).error)) return false;
    }
    toast(scelti.length+(rec?' turni modificati.':' turni eliminati.')); await ricarica();
  }, 'Continua');
}

// ---------- EVENTI: modifica ed eliminazione ----------
const fasciaT = fasciaDi;
function dateTra(d1,d2){ const out=[]; const d=new Date(d1+'T12:00:00Z'); while(d.toISOString().slice(0,10)<=d2){ out.push(d.toISOString().slice(0,10)); d.setUTCDate(d.getUTCDate()+1); } return out; }
async function contaLegati(ids){
  let cand=0, ass=0;
  for(let i=0;i<ids.length;i+=100){ const parte=ids.slice(i,i+100);
    const [k,a]=await Promise.all([sb.from('tp_candidature').select('turno_id').in('turno_id',parte), sb.from('tp_assegnazioni').select('turno_id').in('turno_id',parte)]);
    if(k.error||a.error) return null;
    cand+=k.data.length; ass+=a.data.length; }
  return {cand,ass};
}
async function aBlocchi(ids, fn){ for(let i=0;i<ids.length;i+=100){ if(errore((await fn(ids.slice(i,i+100))).error)) return false; } return true; }

function formEvento(id){
  const e=S.eventi.find(x=>x.id===id); if(!e) return;
  const opz=S.piscine.map(p=>`<option value="${p.id}" ${p.id===e.piscina_id?'selected':''}>${esc(p.nome)}</option>`).join('');
  apriDialog('Modifica evento', `
    <label class="campo"><span>Nome evento</span><input name="nome" value="${esc(e.nome||'')}"></label>
    <label class="campo"><span>Sede</span><select name="piscina_id">${opz}</select></label>
    <div class="due">
      <label class="campo"><span>Primo giorno</span><input type="date" name="d1" value="${e.data_inizio}" required></label>
      <label class="campo"><span>Ultimo giorno</span><input type="date" name="d2" value="${e.data_fine}" required></label></div>
    ${campiModalita(modoEvento(e), fasceEvento(e))}
    <div class="due">
      <label class="campo"><span>Fotografi richiesti</span><input type="number" min="0" max="9" name="fotografi" value="${e.fotografi}"></label>
      <label class="campo"><span>Stampatori richiesti</span><input type="number" min="1" max="9" name="stampatori" value="${e.stampatori}"></label></div>
    <label class="campo"><span>Note</span><textarea name="note" rows="2">${esc(e.note||'')}</textarea></label>
    <p class="note">Le modifiche valgono per tutti i giorni dell'evento. I giorni che avete cambiato a mano (orari, posti chiusi, mezza giornata o tutto il giorno) restano come sono. Allungando il periodo si aggiungono i giorni nuovi; accorciandolo si eliminano quelli fuori, con candidature e squadre.</p>`,
  async f=>{
    const d1=f.d1.value, d2=f.d2.value;
    if(!d1||!d2||d2<d1){ toast('Controlla le date.',true); return false; }
    const nuovoModo=f.modo.value, vecchioModo=modoEvento(e), cambioModo=nuovoModo!==vecchioModo;
    const nf=fasceDalForm(f);
    if(typeof nf==='string'){ toast(nf,true); return false; }
    if(+f.stampatori.value<1){ toast('Ogni turno deve avere almeno uno stampatore.',true); return false; }
    if(dateTra(d1,d2).length>120){ toast('Massimo 120 giorni per evento.',true); return false; }
    const r=await sb.from('tp_turni').select('*').eq('evento_id',id); if(errore(r.error)) return false;
    const turni=r.data;
    const vecchie=fasceEvento(e);   // {M,P} oppure {G}
    // un turno è "come l'evento" se ha ancora orari e posti dell'evento; un giorno è "come l'evento" se tutti i suoi turni lo sono
    const comeEvento=t=>{ const k=fasciaT(t); return !!vecchie[k] && hm(t.ora_inizio)===vecchie[k][0] && hm(t.ora_fine)===vecchie[k][1] && t.fotografi===e.fotografi && t.stampatori===e.stampatori && !t.annullato; };
    const giorniStd=new Set();
    if(cambioModo){
      const perGiorno={}; turni.forEach(t=>(perGiorno[t.data]=perGiorno[t.data]||[]).push(t));
      const chiavi=Object.keys(vecchie).sort().join('');
      for(const [d,tg] of Object.entries(perGiorno))
        if(tg.every(comeEvento) && tg.map(fasciaT).sort().join('')===chiavi) giorniStd.add(d);
    }
    // 1. turni da eliminare: fuori dal nuovo periodo; di una fascia tolta (stessa modalità); dei giorni standard se cambia la modalità
    const via=turni.filter(t=>t.data<d1||t.data>d2
      || (!cambioModo && vecchie[fasciaT(t)] && !nf[fasciaT(t)])
      || (cambioModo && giorniStd.has(t.data)));
    const restano=turni.filter(t=>!via.includes(t));
    // 2. orari: solo i turni che avevano ancora l'orario dell'evento
    const aggOrari={M:[],P:[],G:[]};
    if(!cambioModo) for(const k of ['M','P','G']) if(nf[k] && vecchie[k] && (nf[k][0]!==vecchie[k][0]||nf[k][1]!==vecchie[k][1]))
      aggOrari[k]=restano.filter(t=>fasciaT(t)===k && hm(t.ora_inizio)===vecchie[k][0] && hm(t.ora_fine)===vecchie[k][1]).map(t=>t.id);
    // 3. posti: solo i turni che avevano ancora i posti dell'evento
    const nfot=+f.fotografi.value, nsta=+f.stampatori.value;
    const aggF = nfot!==e.fotografi ? restano.filter(t=>t.fotografi===e.fotografi).map(t=>t.id) : [];
    const aggS = nsta!==e.stampatori ? restano.filter(t=>t.stampatori===e.stampatori).map(t=>t.id) : [];
    // 4. turni nuovi: giorni aggiunti al periodo; fasce aggiunte (su tutto il periodo); giorni standard rifatti con la nuova modalità.
    //    Non si crea mai un turno che si sovrappone a uno che resta (es. un giorno passato a mano a "tutto il giorno").
    const sede=f.piscina_id.value;
    const nuovi=[];
    for(const d of dateTra(d1,d2)) for(const k of ['M','G','P']){ if(!nf[k]) continue;
      const fuori = d<e.data_inizio || d>e.data_fine;
      const serve = fuori || (cambioModo ? giorniStd.has(d) : !vecchie[k]);
      if(!serve) continue;
      const nt={piscina_id:sede, evento_id:id, data:d, ora_inizio:nf[k][0], ora_fine:nf[k][1], fotografi:nfot, stampatori:nsta};
      if(restano.some(t=>t.data===d && siSovrappone(t,nt))) continue;
      nuovi.push(nt);
    }
    // turni di altri eventi nella stessa sede, giorno e ora: si saltano
    let saltati=0;
    if(nuovi.length){
      const es=await sb.from('tp_turni').select('data,ora_inizio').eq('piscina_id',sede).gte('data',d1).lte('data',d2).neq('evento_id',id);
      if(errore(es.error)) return false;
      const gia=new Set(es.data.map(x=>x.data+'|'+hm(x.ora_inizio)));
      const prima=nuovi.length; for(let i=nuovi.length-1;i>=0;i--) if(gia.has(nuovi[i].data+'|'+nuovi[i].ora_inizio)) nuovi.splice(i,1); saltati=prima-nuovi.length;
    }
    // riepilogo e conferma
    const righe=[];
    if(via.length){ const c=await contaLegati(via.map(t=>t.id)); if(!c){ toast('Non riesco a controllare le candidature, riprova.',true); return false; }
      righe.push('elimino '+via.length+' turni'+(c.cand||c.ass?' (con '+c.cand+' candidature e '+c.ass+' persone in squadra)':'')); }
    if(nuovi.length) righe.push('aggiungo '+nuovi.length+' turni'+(saltati?' (ne salto '+saltati+' già occupati da un altro evento)':''));
    const nOr=aggOrari.M.length+aggOrari.P.length+aggOrari.G.length; if(nOr) righe.push('cambio l\'orario di '+nOr+' turni');
    if(aggF.length||aggS.length) righe.push('cambio i posti di '+new Set([...aggF,...aggS]).size+' turni');
    if(sede!==e.piscina_id) righe.push('sposto tutti i turni nella sede '+(piscinaById(sede)||{nome:'?'}).nome);
    if(cambioModo){ const aMano=new Set(restano.filter(t=>t.data>=d1&&t.data<=d2).map(t=>t.data)).size;
      righe.push('passo da “'+(vecchioModo==='giorno'?'tutto il giorno':'mattina + pomeriggio')+'” a “'+(nuovoModo==='giorno'?'tutto il giorno':'mattina + pomeriggio')+'” sui '+giorniStd.size+' giorni come l\'evento'+(aMano?' (i '+aMano+' giorni modificati a mano restano com\'erano)':'')); }
    if(righe.length && !confirm('Modifica evento: '+righe.join(', ')+'. Procedo?')) return false;
    // esecuzione
    if(via.length && !await aBlocchi(via.map(t=>t.id), p=>sb.from('tp_turni').delete().in('id',p))) return false;
    for(const k of ['M','P','G']) if(aggOrari[k].length && !await aBlocchi(aggOrari[k], p=>sb.from('tp_turni').update({ora_inizio:nf[k][0],ora_fine:nf[k][1]}).in('id',p))) return false;
    if(aggF.length && !await aBlocchi(aggF, p=>sb.from('tp_turni').update({fotografi:nfot}).in('id',p))) return false;
    if(aggS.length && !await aBlocchi(aggS, p=>sb.from('tp_turni').update({stampatori:nsta}).in('id',p))) return false;
    if(sede!==e.piscina_id && !await aBlocchi(restano.map(t=>t.id), p=>sb.from('tp_turni').update({piscina_id:sede}).in('id',p))) return false;
    if(nuovi.length && errore((await sb.from('tp_turni').insert(nuovi)).error)) return false;
    const rec={ nome:f.nome.value.trim()||null, piscina_id:sede, data_inizio:d1, data_fine:d2,
      ...recFasce(nuovoModo, nf), fotografi:nfot, stampatori:nsta, note:f.note.value.trim()||null };
    if(errore((await salvaEventoDb(rec, id)).error)) return false;
    toast('Evento aggiornato.'); await ricarica();
  }, 'Salva evento');
}

// ---------- CALENDARIO POSTI DELL'EVENTO ----------
// Tutti i giorni dell'evento, anche su più mesi. Tocco su un giorno = dettaglio con le posizioni (si chiudono/riaprono con un tocco),
// orari, mezza giornata / tutto il giorno, annullo. "Seleziona più giorni" = chiudere posti su giorni sparsi tutti insieme.
// Chiudere un posto = abbassare fotografi/stampatori di quel turno: nessuno viene tolto dalla squadra (overbooking ammesso).
const ecVal = n => (document.querySelector('#df [name="'+n+'"]')||{}).value || '';
function turnoComeEvento(t,e){ const fe=fasceEvento(e), k=fasciaDi(t);
  return !!fe[k] && hm(t.ora_inizio)===fe[k][0] && hm(t.ora_fine)===fe[k][1] && t.fotografi===e.fotografi && t.stampatori===e.stampatori && !t.annullato; }
function turniGiornoEC(d){ return S.ec.turni.filter(t=>t.data===d).sort((a,b)=>ORDINE_FASCIA[fasciaDi(a)]-ORDINE_FASCIA[fasciaDi(b)] || hm(a.ora_inizio).localeCompare(hm(b.ora_inizio))); }
function giornoModificato(d){ const e=S.ec.e, tg=turniGiornoEC(d), fe=fasceEvento(e);
  return !tg.length || tg.some(t=>!turnoComeEvento(t,e)) || tg.map(fasciaDi).sort().join('')!==Object.keys(fe).sort().join(''); }
async function caricaEC(){
  const E=S.ec;
  const r=await sb.from('tp_turni').select('*').eq('evento_id',E.id).order('data').order('ora_inizio'); if(errore(r.error)) return false;
  const ids=r.data.map(x=>x.id), ass=[], cand=[];
  for(let i=0;i<ids.length;i+=100){ const p=ids.slice(i,i+100);
    const [a,k]=await Promise.all([sb.from('tp_assegnazioni').select('*').in('turno_id',p), sb.from('tp_candidature').select('*').in('turno_id',p)]);
    if(errore(a.error)||errore(k.error)) return false; ass.push(...a.data); cand.push(...k.data); }
  E.turni=r.data; E.ass=ass; E.cand=cand; return true;
}
async function apriCalEvento(id){
  const e=(S.eventi||[]).find(x=>x.id===id); if(!e) return;
  S.ec={ id, e, turni:[], ass:[], cand:[], multi:false, sel:new Set(), giorno:null };
  if(!await caricaEC()) return;
  apriDialog('Calendario posti · '+(e.nome||''), '<div id="ec"></div>', null, null, 'Chiudi');
  document.getElementById('dlg').classList.add('largo');
  renderEC();
}
// dopo ogni modifica: rilegge i turni dell'evento e aggiorna anche la pagina sotto
async function dopoEC(msg){ if(msg) toast(msg); await caricaEC(); renderEC(); await caricaMese(); if(S.tab==='turni') vistaTurni(); }
function puntiniPosti(t,e){
  const p=(r,campo)=>{ const max=Math.max(e[campo]||0,t[campo]||0); let s='';
    if(max>3) return `${t[campo]}<i class="po ${r==='S'?'S':''}"></i>`;   // tanti posti: numero invece dei quadratini
    for(let i=0;i<max;i++) s+=`<i class="po ${r==='S'?'S':''} ${i<t[campo]?'':'x'}"></i>`; return s; };
  return p('F','fotografi')+'<span style="width:3px"></span>'+p('S','stampatori');
}
function renderEC(){
  const box=document.getElementById('ec'); if(!box||!S.ec) return; const E=S.ec, e=E.e;
  if(E.giorno){ box.innerHTML=giornoEC(E.giorno); return; }
  const d1=e.data_inizio, d2=e.data_fine, o=oggi();
  let h=`<div class="ecb"><button type="button" class="btn pic ${E.multi?'pri':''}" onclick="ecMulti()">${E.multi?'Fine selezione':'Seleziona più giorni'}</button>
    ${E.multi?['tutti:Tutti','fer:Lun–ven','we:Sab e dom','nessuno:Nessuno'].map(x=>{const [k,l]=x.split(':'); return `<button type="button" class="btn pic" onclick="ecSelTipo('${k}')">${l}</button>`;}).join(''):''}</div>
    <p class="note" style="margin:0 0 6px">${E.multi?'Tocca i giorni da modificare insieme (anche sparsi), poi scegli in fondo quanti posti chiudere.':'Tocca un giorno per aprire o chiudere i posti, cambiare gli orari, passare da mezza giornata a tutto il giorno o annullare il turno.'}
      <br><i class="po"></i> foto · <i class="po S"></i> stampa · quadratino vuoto = posto chiuso · <span style="color:var(--warn)">●</span> = giorno diverso dall'evento</p>`;
  for(let ym=d1.slice(0,7); ym<=d2.slice(0,7); ym=spostaMese(ym,1)){
    // solo i giorni dell'evento di questo mese
    const [y,m]=ym.split('-').map(Number), ult=new Date(y,m,0).getDate();
    const gIni = ym===d1.slice(0,7) ? +d1.slice(8) : 1, gFin = ym===d2.slice(0,7) ? +d2.slice(8) : ult;
    const vuoti=(new Date(y,m-1,gIni).getDay()+6)%7;
    h+=`<div class="ecm">${nomeMese(ym)}</div><div class="ecal">`+['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x=>`<div class="wd">${x}</div>`).join('');
    for(let i=0;i<vuoti;i++) h+='<div class="eg nul"></div>';
    for(let g=gIni; g<=gFin; g++){
      const d=ym+'-'+pad(g);
      const tg=turniGiornoEC(d);
      h+=`<button type="button" class="eg ${E.sel.has(d)?'sel':''} ${giornoModificato(d)?'mod':''}" ${d===o?'style="border-color:var(--ink)"':''} onclick="ecTocco('${d}')" aria-label="${nomeGiorno(d)}"><span class="n">${g}</span>`
        + (tg.length ? tg.map(t=>`<span class="tr ${t.annullato?'ann':''}" title="${NOMI_FASCIA[fasciaDi(t)]} ${hm(t.ora_inizio)}–${hm(t.ora_fine)}">${fasciaDi(t)} ${t.annullato?'annull.':puntiniPosti(t,e)}</span>`).join('') : '<span class="tr">nessun turno</span>')
        + '</button>';
    }
    h+='</div>';
  }
  if(E.multi){
    const n=E.sel.size, maxF=Math.max(e.fotografi, ...E.turni.map(t=>t.fotografi)), maxS=Math.max(e.stampatori, ...E.turni.map(t=>t.stampatori));
    const fasce=new Set(E.turni.filter(t=>E.sel.has(t.data)).map(fasciaDi));
    const opz=(max,def)=>{ let s=''; for(let i=0;i<=max;i++) s+=`<option ${i===def?'selected':''}>${i}</option>`; return s; };
    if(E.nF==null){ E.nF=1; E.nS=0; E.fa='MPG'; E.az='chiudi'; E.pF=1; E.pS=1; }
    if(E.fa!=='MPG' && !fasce.has(E.fa)) E.fa='MPG';
    const imposta=E.az==='imposta';
    h+=`<div class="ecsel"><div class="ecr" style="margin:0"><b>${n} ${n===1?'giorno':'giorni'}</b>
        <select name="ecAz" aria-label="Cosa fare" onchange="S.ec.az=this.value; renderEC()"><option value="chiudi" ${imposta?'':'selected'}>chiudi posti</option><option value="imposta" ${imposta?'selected':''}>imposta i posti esatti</option></select>
        ${imposta
          ? `<label>Foto ${selNum('ecPF',0,MAX_POSTI,E.pF).replace('<select','<select onchange="S.ec.pF=+this.value; renderEC()"')}</label>
             <label>Stampa ${selNum('ecPS',1,MAX_POSTI,E.pS).replace('<select','<select onchange="S.ec.pS=+this.value; renderEC()"')}</label>`
          : `<label>Foto <select name="ecF" onchange="S.ec.nF=+this.value">${opz(maxF,E.nF)}</select></label>
             <label>Stampa <select name="ecS" onchange="S.ec.nS=+this.value">${opz(Math.max(0,maxS-1),E.nS)}</select></label>`}
        ${fasce.size>1?`<select name="ecFa" aria-label="Su quali turni" onchange="S.ec.fa=this.value"><option value="MPG">tutti i turni</option>${['M','P','G'].filter(k=>fasce.has(k)).map(k=>`<option value="${k}" ${E.fa===k?'selected':''}>solo ${NOMI_FASCIA[k].toLowerCase()}</option>`).join('')}</select>`:''}</div>
      <div class="ecr">${imposta
          ? `<button type="button" class="btn pic pri" ${n?'':'disabled'} onclick="ecImpostaSel()">Imposta ${E.pF} foto + ${E.pS} stampa</button>`
          : `<button type="button" class="btn pic pri" ${n?'':'disabled'} onclick="ecChiudiSel()">Chiudi posti</button>`}
        <button type="button" class="btn pic" ${n?'':'disabled'} onclick="ecRiapriSel()">Riapri i posti dell'evento</button>
        <span class="note" style="margin:0">Resta sempre 1 stampatore; nessuno viene tolto dalla squadra.</span></div></div>`;
  }
  box.innerHTML=h;
}
function ecMulti(){ const E=S.ec; E.multi=!E.multi; if(!E.multi) E.sel.clear(); renderEC(); }
function ecTocco(d){ const E=S.ec; if(E.multi){ E.sel.has(d)?E.sel.delete(d):E.sel.add(d); renderEC(); } else ecGiorno(d); }
function ecGiorno(d){ S.ec.giorno=d; renderEC(); document.querySelector('#dlg .dlg-b').scrollTop=0; }
function ecSelTipo(k){
  const E=S.ec; E.sel.clear();
  if(k!=='nessuno') dateTra(E.e.data_inizio,E.e.data_fine).forEach(d=>{ const [y,m,g]=d.split('-').map(Number), wd=new Date(y,m-1,g).getDay(), we=wd===0||wd===6;
    if(k==='tutti' || (k==='we'&&we) || (k==='fer'&&!we)) E.sel.add(d); });
  renderEC();
}
function descrT(t){ const [y,m,g]=t.data.split('-').map(Number); return g+'/'+m+' '+NOMI_FASCIA[fasciaDi(t)].toLowerCase(); }
// applica i nuovi posti {id:{fotografi,stampatori}} raggruppando i turni con gli stessi valori
async function salvaPosti(mappa){
  const gruppi={}; for(const [id,v] of Object.entries(mappa)){ const k=v.fotografi+'|'+v.stampatori; (gruppi[k]=gruppi[k]||[]).push(id); }
  for(const [k,ids] of Object.entries(gruppi)){ const [F,Sx]=k.split('|').map(Number);
    if(!await aBlocchi(ids, p=>sb.from('tp_turni').update({fotografi:F, stampatori:Sx}).in('id',p))) return false; }
  return true;
}
function ecTurniSel(){ const E=S.ec, fa=ecVal('ecFa')||'MPG'; return E.turni.filter(t=>E.sel.has(t.data) && !t.annullato && fa.includes(fasciaDi(t))); }
async function ecChiudiSel(){
  const E=S.ec, nF=+ecVal('ecF'), nS=+ecVal('ecS');
  if(!nF && !nS){ toast('Scegli quanti posti chiudere.',true); return; }
  const tt=ecTurniSel(); if(!tt.length){ toast('Nei giorni scelti non ci sono turni attivi.',true); return; }
  const mappa={}, coperti=[]; let ultimo=0;
  for(const t of tt){
    const F=Math.max(0,t.fotografi-nF), Sx=Math.max(Math.min(1,t.stampatori), t.stampatori-nS);
    if(nS && t.stampatori-nS<1) ultimo++;
    if(F===t.fotografi && Sx===t.stampatori) continue;
    mappa[t.id]={fotografi:F, stampatori:Sx};
    const a=E.ass.filter(x=>x.turno_id===t.id);
    if(a.filter(x=>x.ruolo==='F').length>F || a.filter(x=>x.ruolo==='S').length>Sx) coperti.push(descrT(t));
  }
  const n=Object.keys(mappa).length;
  if(!n){ toast(ultimo?'Non si può chiudere l\'ultimo stampatore: in questi turni non c\'è altro da chiudere.':'In questi turni quei posti sono già chiusi.',true); return; }
  const cosa=[nF?nF+' '+(nF===1?'fotografo':'fotografi'):'', nS?nS+' '+(nS===1?'stampatore':'stampatori'):''].filter(Boolean).join(' e ');
  let msg='Chiudo '+cosa+' su '+n+' turni ('+new Set(Object.keys(mappa).map(id=>E.turni.find(t=>t.id===id).data)).size+' giorni).';
  const nT=x=>x===1?'1 turno':x+' turni';
  if(ultimo) msg+='\n\nIn '+nT(ultimo)+' resta comunque 1 stampatore: l\'ultimo non si può chiudere.';
  if(coperti.length) msg+='\n\nATTENZIONE: in '+nT(coperti.length)+' il posto chiuso è già coperto in squadra ('+coperti.slice(0,6).join(', ')+(coperti.length>6?'…':'')+'). Nessuno viene tolto: la squadra resterà con persone in più del previsto.';
  if(!confirm(msg+'\n\nProcedo?')) return;
  if(!await salvaPosti(mappa)) return;
  E.sel.clear(); await dopoEC('Posti chiusi su '+n+' turni.');
}
async function ecImpostaSel(){
  const E=S.ec, F=+ecVal('ecPF'), Sx=Math.max(1,+ecVal('ecPS'));
  const tt=ecTurniSel(); if(!tt.length){ toast('Nei giorni scelti non ci sono turni attivi.',true); return; }
  const mappa={}, coperti=[];
  tt.forEach(t=>{ if(t.fotografi===F && t.stampatori===Sx) return; mappa[t.id]={fotografi:F, stampatori:Sx}; if(supera(t,F,Sx)) coperti.push(descrT(t)); });
  const n=Object.keys(mappa).length;
  if(!n){ toast('Nei giorni scelti i posti sono già '+F+' foto + '+Sx+' stampa.',true); return; }
  const giorni=new Set(Object.keys(mappa).map(id=>E.turni.find(t=>t.id===id).data)).size;
  if(!confirm('Imposto '+F+' foto + '+Sx+' stampa su '+(n===1?'1 turno':n+' turni')+' ('+(giorni===1?'1 giorno':giorni+' giorni')+').'+avvisoCoperti(coperti)+'\n\nProcedo?')) return;
  if(!await salvaPosti(mappa)) return;
  E.sel.clear(); await dopoEC('Posti impostati su '+n+' turni.');
}
async function ecRiapriSel(){
  const E=S.ec, e=E.e, tt=ecTurniSel(); const mappa={};
  tt.forEach(t=>{ const F=Math.max(t.fotografi,e.fotografi), Sx=Math.max(t.stampatori,e.stampatori); if(F!==t.fotografi||Sx!==t.stampatori) mappa[t.id]={fotografi:F,stampatori:Sx}; });
  const n=Object.keys(mappa).length;
  if(!n){ toast('Nei giorni scelti i posti sono già tutti aperti.',true); return; }

    const posti=(r,campo,nome,sq)=>{ const max=Math.max(e[campo]||0,t[campo]||0); let s='';
      for(let j=0;j<max;j++){ const aperto=j<t[campo];
        s+=`<button type="button" class="${r==='S'?'S':''} ${aperto?'':'x'}" onclick="ecPosto('${t.id}','${r}',${aperto?-1:1})" title="${aperto?'Tocca per chiudere':'Tocca per riaprire'}">${nome} ${j+1}<small>${aperto?(j<sq.length?'aperto · coperto':'aperto'):'chiuso'}</small></button>`; }
      return s; };
    h+=`<div class="pos">${posti('F','fotografi','Foto',aF)}${posti('S','stampatori','Stampa',aS)}</div>
      <div class="note">Aperti: ${t.fotografi} foto + ${t.stampatori} stampa · ${nc} ${nc===1?'candidato':'candidati'}${a.length?' · in squadra: '+nomi(a):''}</div>

async function ecPosto(tid,r,delta){
  const E=S.ec, t=E.turni.find(x=>x.id===tid); if(!t) return;
  const campo=r==='F'?'fotografi':'stampatori', nuovo=t[campo]+delta;
  if(delta<0 && r==='S' && nuovo<1){ toast('Non si può chiudere l\'ultimo stampatore: ogni turno ne ha bisogno di almeno uno.',true); return; }
  if(nuovo<0) return;
  const sq=E.ass.filter(a=>a.turno_id===tid && a.ruolo===r);
  if(delta<0 && sq.length>nuovo){
    const nomi=sq.map(x=>(collabById(x.collaboratore_id)||{nome:'?'}).nome).join(', ');
    if(!confirm('Questo posto è già coperto in squadra ('+nomi+').\n\nSe lo chiudi nessuno viene tolto: la squadra resta con '+(sq.length-nuovo)+' '+(r==='F'?'fotografo':'stampatore')+' in più del previsto. Chiudo il posto?')) return;
  }
  const prima=t[campo]; t[campo]=nuovo; renderEC();   // si vede subito
  if(errore((await sb.from('tp_turni').update({[campo]:nuovo}).eq('id',tid)).error)){ t[campo]=prima; renderEC(); return; }
  await dopoEC(delta<0?'Posto chiuso.':'Posto riaperto.');
}

    <button class="btn pri" style="align-self:end" onclick="caricaRiepilogo()">Mostra</button></div><div id="rOut"></div>`;

async function caricaRiepilogo(){
  const R=S.riep; R.da=document.getElementById('rDa').value; R.a=document.getElementById('rA').value; R.sede=document.getElementById('rSede').value;
  if(!R.da||!R.a||R.a<R.da){ toast('Controlla le date.',true); return; }
  let q=sb.from('tp_turni').select('*').gte('data',R.da).lte('data',R.a);
  if(R.sede!=='tutte') q=q.eq('piscina_id',R.sede);
  const t=await q; if(errore(t.error)) return;
  let ass=[];
  if(t.data.length){ const r=await sb.from('tp_assegnazioni').select('*').in('turno_id',t.data.map(x=>x.id)); if(errore(r.error)) return; ass=r.data; }
  R.dati={turni:t.data, ass}; disegnaRiepilogo();
}
function disegnaRiepilogo(){
  const {turni,ass}=S.riep.dati; const out=document.getElementById('rOut');
  const tById=id=>turni.find(x=>x.id===id);
  const validi=turni.filter(t=>!t.annullato), ann=turni.filter(t=>t.annullato);
  const daConf=validi.filter(t=>!t.presenze_ok && t.data<=oggi() && ass.some(a=>a.turno_id===t.id));
  const per={};
  ass.forEach(a=>{ const t=tById(a.turno_id); if(!t||t.annullato) return;
    const k=a.collaboratore_id; per[k]=per[k]||{ass:0,pres:0,ass_:0,ore:0,giorni:new Set()};
    per[k].ass++;
    if(t.presenze_ok){ if(a.presente===true){ per[k].pres++; per[k].ore+=oreAss(a,t); per[k].giorni.add(t.data); } else per[k].ass_++; }
  });
  const righe=Object.entries(per).map(([id,v])=>({nome:(collabById(id)||{nome:'?'}).nome,...v})).sort((a,b)=>a.nome.localeCompare(b.nome));
  const tot=righe.reduce((s,r)=>({ass:s.ass+r.ass,pres:s.pres+r.pres,ass_:s.ass_+r.ass_,ore:s.ore+r.ore}),{ass:0,pres:0,ass_:0,ore:0});
  out.innerHTML=`<p class="note">Turni previsti: <b>${turni.length}</b> · annullati: <b>${ann.length}</b>${ann.length?' ('+[...new Set(ann.map(t=>t.motivo_annullo||'senza motivo'))].map(esc).join(', ')+')':''} · presenze da confermare: <b>${daConf.length}</b></p>
    ${daConf.length?`<ul class="avvisi" style="margin-bottom:12px">${daConf.map(t=>'<li>⚠ '+esc((piscinaById(t.piscina_id)||{nome:'?'}).nome)+', '+nomeGiorno(t.data)+' '+hm(t.ora_inizio)+'–'+hm(t.ora_fine)+': presenze non confermate</li>').join('')}</ul>`:''}
    ${righe.length?`<div class="griglia"><table class="riep"><thead><tr><th>Collaboratore</th><th>Turni assegnati</th><th>Presenze</th><th>Assenze</th><th>Giorni lavorati</th><th>Ore lavorate</th></tr></thead><tbody>
    ${righe.map(r=>`<tr><td>${esc(r.nome)}</td><td>${r.ass}</td><td>${r.pres}</td><td>${r.ass_||''}</td><td>${r.giorni.size}</td><td>${fmtOre(r.ore)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Totale</td><td>${tot.ass}</td><td>${tot.pres}</td><td>${tot.ass_||''}</td><td></td><td>${fmtOre(tot.ore)}</td></tr></tfoot></table></div>
    <p class="note">Presenze, giorni e ore contano solo i turni con le presenze confermate. I turni annullati non contano.</p>`

}

// stato di una persona rispetto a un turno
function statoPersona(c,t){
  const giaQui = S.ass.find(a=>a.turno_id===t.id && a.collaboratore_id===c.id);
  const altri = S.ass.filter(a=>a.collaboratore_id===c.id && a.turno_id!==t.id).map(a=>S.turni.find(x=>x.id===a.turno_id)).filter(x=>x&&!x.annullato&&x.data===t.data);
  const conflitto = altri.some(x=> hm(x.ora_inizio)<hm(t.ora_fine) && hm(t.ora_inizio)<hm(x.ora_fine));
  const disp = S.cand.some(k=>k.turno_id===t.id && k.collaboratore_id===c.id);   // si è candidato a questo turno
  const nelMese = S.ass.filter(a=>a.collaboratore_id===c.id).length;
  return { giaQui, conflitto, disp, nelMese, stessoGiorno:altri.length };
}

function formAssegna(id){

function eur(n){ return (Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'}); }
function compensiTurno(t){

function rigaIncassi(t){
  const i=(S.incassi||[]).find(x=>x.turno_id===t.id);

  const comp=compensiTurno(t).filter(x=>x.k && (x.k.importo!=null || x.k.nota));
  let h='';
  if(!i && !sp.length) h+='<div class="note">Incassi non ancora inseriti</div>';
  else{
    const tot=sp.reduce((a,x)=>a+Number(x.importo||0),0);
    const parti=['Contanti '+eur(i?.cash),'POS '+eur(i?.pos),'% sede '+eur(i?.percentuale_piscina)];
    if(sp.length) parti.push('Spese '+eur(tot)+' ('+sp.map(x=>esc(x.descrizione)).join(', ')+')');
    h+='<div class="note" style="color:var(--ink)"><b>Incassi:</b> '+parti.join(', ')+'</div>';
  }
  if(comp.length) h+='<div class="note" style="color:var(--ink)"><b>Compensi:</b> '+comp.map(x=>esc(x.c?.nome||'?')+' '+(x.k.importo!=null?eur(x.k.importo):'—')+(x.k.nota?' ('+esc(x.k.nota)+')':'')).join(', ')+'</div>';
  if(i || sp.length || comp.length){
    const cash=Number(i?.cash||0), pos=Number(i?.pos||0);
    const usc=Number(i?.percentuale_piscina||0)+sp.reduce((a,x)=>a+Number(x.importo||0),0)+comp.reduce((a,x)=>a+Number(x.k.importo||0),0);
    h+='<div class="note" style="color:var(--ink)"><b>Contanti che restano:</b> '+eur(cash-usc)+' <span style="color:var(--muted)">(contanti '+eur(cash)+' meno uscite '+eur(usc)+'). Margine con POS: '+eur(cash+pos-usc)+'</span></div>';

// ---------- PROPOSTA AUTOMATICA ----------
// Riempie solo i posti liberi dei turni in BOZZA, senza togliere chi è già assegnato.
// Regole: ruolo giusto, disponibilità, niente sovrapposizioni di orario, almeno una macchina per squadra,
// piscine più importanti servite per prime e con le persone di livello più alto, turni distribuiti in modo equo.
function calcolaProposta(includiNonIndicati){
  const lavoro = S.ass.map(a=>({...a}));
  const nuove = [], esito = [];
  const carico = {}; S.collab.forEach(c=>carico[c.id]=lavoro.filter(a=>a.collaboratore_id===c.id).length);
  const imp = t => (piscinaById(t.piscina_id)||{importanza:1}).importanza;
  const turni = S.turni.filter(t=>!t.pubblicato && !t.annullato).sort((a,b)=> (imp(b)-imp(a)) || a.data.localeCompare(b.data) || hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));

  const disponibile = (c,t) => includiNonIndicati || S.cand.some(k=>k.turno_id===t.id && k.collaboratore_id===c.id);
  const altriTurniStessoGiorno = (c,t) => lavoro.filter(a=>a.collaboratore_id===c.id && a.turno_id!==t.id)
    .map(a=>S.turni.find(x=>x.id===a.turno_id)).filter(x=>x && !x.annullato && x.data===t.data);
  const inConflitto = (c,t) => altriTurniStessoGiorno(c,t).some(x=> hm(x.ora_inizio)<hm(t.ora_fine) && hm(t.ora_inizio)<hm(x.ora_fine));
  const sa = (c,r) => c.ruolo==='FS' || c.ruolo===r;

  for(const t of turni){
    const squadra = () => lavoro.filter(a=>a.turno_id===t.id);
    const bisogno = { F: Math.max(0, t.fotografi - squadra().filter(a=>a.ruolo==='F').length),
                      S: Math.max(0, t.stampatori - squadra().filter(a=>a.ruolo==='S').length) };
    if(!bisogno.F && !bisogno.S) continue;
    const aggiunti = [];
    while(bisogno.F || bisogno.S){
      const sq = squadra();
      const haMacchina = sq.some(a=>collabById(a.collaboratore_id)?.auto);
      let coppie = [];
      for(const c of S.collab){
        if(!c.attivo || sq.some(a=>a.collaboratore_id===c.id) || inConflitto(c,t) || !disponibile(c,t)) continue;
        for(const r of ['S','F']) if(bisogno[r] && sa(c,r)) coppie.push({c,r});
      }
      if(!coppie.length) break;
      const punteggio = ({c,r}) => c.livello*imp(t) - 4*carico[c.id] - 2*altriTurniStessoGiorno(c,t).length + (c.ruolo===r?1:0);
      // una scelta è "sicura" se dopo restano abbastanza persone per coprire tutti i posti ancora liberi
      const candidati = [...new Set(coppie.map(x=>x.c))];   // tutti, prima del filtro macchina
      const sicura = ({c,r}) => {
        const F = bisogno.F-(r==='F'?1:0), Sx = bisogno.S-(r==='S'?1:0);
        const altri = candidati.filter(x=>x!==c);
        return altri.filter(x=>sa(x,'F')).length>=F && altri.filter(x=>sa(x,'S')).length>=Sx && altri.length>=F+Sx;
      };
      if(!haMacchina && coppie.some(x=>x.c.auto)) coppie = coppie.filter(x=>x.c.auto);
      coppie.sort((x,y)=> (sicura(y)-sicura(x)) || punteggio(y)-punteggio(x) || x.c.nome.localeCompare(y.c.nome));
      const {c,r} = coppie[0];
      const rec = { turno_id:t.id, collaboratore_id:c.id, ruolo:r };
      lavoro.push(rec); nuove.push(rec); aggiunti.push(rec);
      carico[c.id]++; bisogno[r]--;
    }
    const avvisi=[];
    if(bisogno.F) avvisi.push(bisogno.F===1?'Manca 1 fotografo':'Mancano '+bisogno.F+' fotografi');
    if(bisogno.S) avvisi.push(bisogno.S===1?'Manca 1 stampatore':'Mancano '+bisogno.S+' stampatori');
    const sq = squadra();
    if(sq.length && !sq.some(a=>collabById(a.collaboratore_id)?.auto)) avvisi.push('Nessuno della squadra ha la macchina');
    esito.push({ t, squadra:sq, aggiunti, avvisi });
  }
  esito.sort((a,b)=> a.t.data.localeCompare(b.t.data) || hm(a.t.ora_inizio).localeCompare(hm(b.t.ora_inizio)));
  return { nuove, esito };
}

  if(S.sedeDisp!=='tutte' && !sediMese.some(p=>p.id===S.sedeDisp)) S.sedeDisp = sediMese[0]?.id || 'tutte';
  const turniV = S.sedeDisp==='tutte' ? turniOk : turniOk.filter(t=>t.piscina_id===S.sedeDisp);
  let h=barraMese('<span class="note">Le candidature le fanno i collaboratori dal calendario; qui potete aggiungerle o toglierle voi.</span>');

    +(sediMese.length>1?`<button aria-current="${S.sedeDisp==='tutte'}" onclick="sedeDisp('tutte')">Tutte</button>`:'')+'</div>';

    m.innerHTML = h + calendarioCand(tutti); return;
  }

    const [y,mm,g]=t.data.split('-').map(Number); const wd=new Date(y,mm-1,g).toLocaleDateString('it-IT',{weekday:'short'});
    const nc=S.cand.filter(k=>k.turno_id===t.id).length, posti=(t.fotografi||0)+(t.stampatori||0);
    return `<th class="ev">${wd} ${g}<div class="pisc">${S.sedeDisp==='tutte'?esc((piscinaById(t.piscina_id)||{nome:'?'}).nome)+'<br>':''}<span class="ore">${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span><br><span class="${nc>=posti?'pieno':'manca'}">${nc}/${posti}</span></div></th>`;
  }).join('')+'</tr></thead><tbody>';
  attivi.forEach(c=>{
    h+=`<tr><td class="nome">${esc(c.nome)}</td>`+turniV.map(t=>{
      const k=S.cand.some(x=>x.turno_id===t.id&&x.collaboratore_id===c.id);
      const sq=S.ass.some(x=>x.turno_id===t.id&&x.collaboratore_id===c.id);
      return `<td><div class="fx"><button class="${sq?'sq':k?'si':''}" title="${sq?'In squadra':k?'Candidato: tocca per togliere':'Tocca per candidare'}" onclick="toggleCand('${c.id}','${t.id}')">${sq?'★':k?'✓':''}</button></div></td>`;
    }).join('')+'</tr>';

function nomeC(id){ return (collabById(id)||{nome:'?'}).nome; }
function calendarioCand(turni){
  const [y,mm]=S.mese.split('-').map(Number);
  const primo=new Date(y,mm-1,1), ult=new Date(y,mm,0).getDate(), vuoti=(primo.getDay()+6)%7, o=oggi();
  let h='<div class="calo">'+['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x=>`<div class="wd">${x}</div>`).join('');
  for(let i=0;i<vuoti;i++) h+='<div class="gg vuoto"></div>';
  for(let g=1; g<=ult; g++){
    const d=S.mese+'-'+String(g).padStart(2,'0');
    const tg=turni.filter(t=>t.data===d).sort((a,b)=>(piscinaById(a.piscina_id)?.nome||'').localeCompare(piscinaById(b.piscina_id)?.nome||'')||hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));
    h+=`<div class="gg ${tg.length?'':'off'} ${d===o?'oggi':''}" ${tg.length?`onclick="giornoCand('${d}')" role="button" tabindex="0"`:''}><div class="num">${g}</div>`
      + tg.map(t=>{
          const p=piscinaById(t.piscina_id)||{nome:'?'}; const k=S.cand.filter(x=>x.turno_id===t.id); const posti=(t.fotografi||0)+(t.stampatori||0);
          const nomi=k.map(x=>{ const sq=S.ass.some(a=>a.turno_id===t.id&&a.collaboratore_id===x.collaboratore_id); return (sq?'★':'')+esc(nomeC(x.collaboratore_id).split(' ')[0]); });
          const lett=fasciaDi(t);
          return `<div class="cr ${t.annullato?'ann':''}" style="--c:${coloreSede(p)}" title="${esc(p.nome)} ${hm(t.ora_inizio)}–${hm(t.ora_fine)}">
            <b>${lett}</b><span class="${t.annullato?'':k.length>=posti?'pieno':'manca'}">${t.annullato?'annull.':k.length+'/'+posti}</span>
            <span class="nm">${nomi.slice(0,3).join(', ')}${nomi.length>3?' +'+(nomi.length-3):''}</span></div>`;
        }).join('') + '</div>';
  }
  return h+'</div><p class="note">Clic su un giorno per vedere e gestire i candidati. M = mattina, P = pomeriggio, G = tutto il giorno. Conteggio verde = candidati sufficienti per i posti, arancione = ne mancano. ★ davanti a un nome = in squadra.</p>';
}

    const altri=S.collab.filter(c=>c.attivo && !k.some(x=>x.collaboratore_id===c.id)).sort((a,b)=>a.nome.localeCompare(b.nome));
    return `<div class="gct" style="border-left:6px solid ${coloreSede(p)}">

      ${t.annullato?'':`<div class="gcl">${k.map(x=>{ const c=collabById(x.collaboratore_id)||{nome:'?'}; const sq=S.ass.some(a=>a.turno_id===t.id&&a.collaboratore_id===c.id);
        return `<div class="gcr"><span>${sq?'<b title="In squadra">★</b> ':''}${esc(c.nome)} <small class="note">${RUOLI[c.ruolo]||''} · <span class="stelle">${stelle(c.livello||0)}</span>${c.auto?' · 🚗':''}</small></span>

    </div>`;

async function toggleCand(cid,tid){
  const c=S.cand.find(x=>x.collaboratore_id===cid&&x.turno_id===tid);
  const r = c ? await sb.from('tp_candidature').delete().eq('id',c.id)
              : await sb.from('tp_candidature').insert({collaboratore_id:cid,turno_id:tid}).select().single();
  if(errore(r.error)) return;
  if(c) S.cand=S.cand.filter(x=>x!==c); else S.cand.push(r.data);
  const sx=document.querySelector('.griglia')?.scrollLeft; vistaDisp(); const g=document.querySelector('.griglia'); if(g) g.scrollLeft=sx||0;
  renderGC();
}

    <div class="dlg-b">${corpo}</div>
    <div class="dlg-f"><button type="button" class="btn" onclick="chiudiDialog()">${onSave?'Annulla':(chiudiTesto||'Chiudi')}</button>${onSave?`<button class="btn pri">${esc(etichetta||'Salva')}</button>`:''}</div></form>`;
  const f=document.getElementById('df');
  f.onsubmit = async ev => {
    ev.preventDefault(); if(!onSave) return chiudiDialog();
    const bt=f.querySelector('.dlg-f .pri'); bt.disabled=true;
    const ok = await onSave(f); bt.disabled=false;
    if(ok!==false) chiudiDialog();
  };
  if(!d.open) d.showModal();
}
function chiudiDialog(){
  const d=document.getElementById('dlg'); const torna = d.dataset.dopo==='turno' ? S.turnoAperto : null;
  d.dataset.dopo='';
  if(d.open) d.close();
  if(torna) apriTurno(torna);
}
document.getElementById('dlg').addEventListener('close', ()=>{ const d=document.getElementById('dlg'); if(!d.open && d.dataset.tipo==='turno') S.turnoAperto=null; });

avvio();
</script>
</body>
</html>
