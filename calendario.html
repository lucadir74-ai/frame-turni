<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame · Calendario</title>
<link rel="icon" type="image/svg+xml" href="icona.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-cal.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Calendario">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--tile:#F4F4F5;--card:#fff;--ink:#111111;--muted:#6B6C70;--line:#E1E1E4;--water:#EB0089;--nero:#000000;--grigio:#818286;--water-soft:#FDE6F2;--red:#C8333A;--yellow:#EB0089;--ok:#2E7D4F;
  --f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;--fc:'Jost',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tile);color:var(--ink);font:16px/1.45 var(--f)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
header{background:var(--nero);color:#fff;position:sticky;top:0;z-index:5}
.top{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font:600 1.1rem var(--fc);margin:0;flex:1;border-left:1px solid #444;padding-left:10px}
.logo{height:32px;width:auto;display:block}
.top button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;font-size:.85rem}
.seg{max-width:640px;margin:0 auto;display:flex;padding:0 12px}
.seg button{flex:1;background:none;border:0;color:#fff;opacity:.75;padding:10px 6px;font-weight:600;border-bottom:3px solid transparent}
.seg button[aria-current=true]{opacity:1;border-bottom-color:var(--yellow)}
.corsia{height:3px;background:var(--water)}
main{max-width:640px;margin:0 auto;padding:16px}
.intro{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.giorno{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.giorno h2{font:700 1.1rem var(--fc);margin:0 0 6px;text-transform:capitalize}
.pisc{font-size:.92rem;margin:2px 0}
.pisc b{font-weight:600}
.pisc .ore{color:var(--muted);font-variant-numeric:tabular-nums}
.indir{font-size:.9rem;margin:2px 0}
.indir a{color:inherit}
.fasce{display:flex;gap:8px;margin-top:10px}
.fasce button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-weight:600;color:var(--muted)}
.fasce button.si{border-color:var(--ok);background:#E7F3EC;color:var(--ok)}
.fasce small{display:block;font-weight:500;font-size:.78rem}
.squadra{margin-top:6px;font-size:.9rem;color:var(--muted)}
.squadra .io{color:var(--ink);font-weight:700}
.tag{display:inline-block;font:700 .72rem var(--fc);color:#fff;background:var(--water);border-radius:4px;padding:0 6px;margin-right:4px}
.tag.S{background:var(--grigio)}
.giorno.annullato{opacity:.6}
.annullo{display:inline-block;font-weight:700;font-size:.8rem;color:var(--red);margin-left:6px}
.vuoto{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}
.iscr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.campo{display:grid;gap:4px;margin-bottom:12px}
.campo>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.campo input{border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%;background:#fff}
.scelte{display:flex;gap:8px;flex-wrap:wrap}
.scelte label{flex:1;min-width:6.5em;border:2px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-weight:600;color:var(--muted);cursor:pointer}
.scelte label{position:relative}
.scelte input{position:absolute;opacity:0;left:0;top:0;width:1px;height:1px;margin:0}
.scelte label:has(input:checked){border-color:var(--ok);background:#E7F3EC;color:var(--ok)}
.btnpri{width:100%;background:var(--water);color:#fff;border:0;border-radius:10px;padding:13px;font-weight:600;font-size:1.05rem}
.btnsec{width:100%;background:none;border:1px dashed var(--water);color:var(--water);border-radius:10px;padding:13px;font-weight:600;margin-top:14px}
.privacy{font-size:.82rem;color:var(--muted);margin:4px 0 14px}
.fisso{border:1px solid var(--line);border-radius:8px;padding:10px;background:#F4F4F5;font-weight:600}
.sett{font:600 .85rem var(--fc);color:var(--muted);margin:20px 0 8px;text-transform:none}
.sedi{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.sedi button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600}
.sedi button[aria-current=true]{background:var(--water);border-color:var(--water);color:#fff}
.ambiti{display:flex;gap:4px;margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.ambiti button{flex:1;border:0;background:none;color:var(--ink);border-radius:9px;padding:9px 6px;font-weight:600}
.ambiti button[aria-current=true]{background:var(--water);color:#fff}
.giorno.mio{border-color:var(--water);box-shadow:inset 4px 0 0 var(--water)}
.az{margin-top:12px}
.az .btnpri{padding:10px}
.az .btnsec{padding:10px}
.stato-io{font-weight:700;color:var(--ok)}
.stato-io.attesa{color:var(--ink);margin-bottom:8px}
.risp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.risp .btnsec{margin-top:0;border-style:solid}
.btnlink{background:none;border:0;padding:6px 0 0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.88rem}
.daconf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FFF6D6;border:1px solid #F0D98A;border-radius:12px;padding:10px 14px;margin:0 0 12px}
.daconf span{font-size:.9rem}
.daconf button{background:var(--water);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
.note48{font-size:.88rem;color:var(--muted);margin:6px 0 8px}
/* incassi del turno */
.incbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.incbox .ok{color:var(--ok);font-weight:600;font-size:.9rem;margin:0 0 6px}
.inc .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.inc .box h2{font:700 1.05rem var(--fc);margin:0 0 10px}
.inc .testa{background:var(--card);border:1px solid var(--water);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.inc .testa b{font:700 1.1rem var(--fc)}
.inc .testa div{color:var(--muted);text-transform:capitalize;font-size:.92rem}
.inc .riga{display:grid;grid-template-columns:1fr 9em;align-items:center;gap:10px;margin-bottom:10px}
.inc .riga span{font-weight:600}
.inc input{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;width:100%;font:inherit;min-width:0}
.inc input.euro{text-align:right;font-variant-numeric:tabular-nums}
.inc .spesa{display:grid;grid-template-columns:1fr 7em auto;gap:8px;margin-bottom:8px}
.inc .comp{border-top:1px solid var(--line);padding:10px 0 2px}
.inc .comp:first-of-type{border-top:0;padding-top:0}
.inc .comp .r1{display:grid;grid-template-columns:1fr 7em;gap:8px;align-items:center;margin-bottom:6px}
.inc .bx{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:600}
.inc .bx.x{color:var(--red)}
.inc .tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.inc .riep div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;padding:2px 0}
.inc .riep .netto{border-top:2px solid var(--ink);margin-top:6px;padding-top:6px;font-weight:700;font-size:1.1rem}
.inc .nota{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.btnwa{display:block;text-align:center;background:#1F8F4E;color:#fff;border-radius:10px;padding:11px;font-weight:600;text-decoration:none}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.velo .box{background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%}
.velo h2{font:700 1.2rem var(--fc);margin:0 0 8px}
.velo p{margin:0 0 14px}
.mesebar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.mesebar h2{flex:1;text-align:center;font:700 1.15rem var(--fc);margin:0;text-transform:capitalize}
.mesebar button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:40px;height:36px;font-size:1.1rem}
.mesebar button:disabled{opacity:.3}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin:0 0 10px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:50%;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font:600 .72rem var(--fc);color:var(--muted);padding:2px 0}
.cal .gg{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:62px;padding:2px;display:flex;flex-direction:column;gap:2px}
.cal .gg.vuoto{background:transparent;border-color:transparent}
.cal .gg.off{background:#F8F8F9}
.cal .gg.oggi{border-color:var(--ink)}
.cal .num{border:0;background:none;padding:1px 2px;text-align:left;font:600 .78rem var(--fc);color:var(--ink)}
.cal .gg.off .num{color:#B5B6B9}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pill{border:2px solid var(--c);background:#fff;color:var(--c);border-radius:6px;height:22px;padding:0;font:700 .72rem var(--fc);line-height:1}
.pill.si{background:var(--c);color:#fff}
.pill.ann{border-style:dashed;opacity:.45;text-decoration:line-through}
.pill.pass{opacity:.4}
.pill.piu{border-color:var(--line);color:var(--muted)}
.btnblocco{width:100%;background:var(--card);border:1px solid var(--water);color:var(--water);border-radius:10px;padding:11px;font-weight:600;margin:12px 0 4px}
.velo .box.foglio{max-height:85vh;overflow:auto}
.velo .box .giorno{margin-bottom:8px}
.velo .box .giorno h2{display:none}
.blocco label{display:block;margin-bottom:12px}
.blocco select,.blocco input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;background:#fff;margin-top:4px}
.blocco .dueb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blocco .dueb label,.blocco .dueb input{min-width:0}
.blocco input[type=date]{font-size:.92rem;padding:9px 6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:92vw}
#toast.err{background:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const CHIAVE_NOME = 'frame_turni_io', CHIAVE_AMBITO = 'frame_turni_ambito';
let sb=null; const S={ tutti:[], turni:[], io:null, vista:'cal', sede:null, mese:null, giorno:null, ambito:'tutto' };

// Ambito: "piscine" = sedi nascoste (le disponibilità), "christmas" = sedi con nome visibile (Christmas World).
// Il link può sceglierlo (calendario.html?solo=piscine oppure ?solo=christmas) e il telefono se lo ricorda;
// in alto restano comunque i tasti per cambiarlo, così nessuno resta bloccato.
const AMBITI = { tutto:'Tutto', christmas:'Christmas', piscine:'Piscine' };
function ambitoDi(t){ return t.visibile ? 'christmas' : 'piscine'; }
function leggiAmbito(){
  let v=null; try{ const q=new URLSearchParams(location.search); v=q.get('solo'); if(q.get('vista')==='miei') S.vista='miei'; if(q.get('vista')==='squadre') S.vista='squadre'; }catch(e){}
  if(v && AMBITI[v]){ try{ localStorage.setItem(CHIAVE_AMBITO,v); }catch(e){} return v; }
  try{ v=localStorage.getItem(CHIAVE_AMBITO); }catch(e){ v=null; }
  return AMBITI[v] ? v : 'tutto';
}
function applicaAmbito(){ S.turni = S.ambito==='tutto' ? S.tutti : S.tutti.filter(t=>ambitoDi(t)===S.ambito); }
function cambiaAmbito(v){
  S.ambito=v; S.mese=null; S.sede=null; S.giorno=null;
  try{ localStorage.setItem(CHIAVE_AMBITO,v); }catch(e){}
  applicaAmbito(); aggiorna(); window.scrollTo(0,0);
}
// i tasti compaiono solo se ci sono sia turni del Christmas sia disponibilità delle piscine
function tastiAmbito(){
  const ci=new Set(S.tutti.map(ambitoDi));
  if(ci.size<2 && S.ambito==='tutto') return '';
  return '<div class="ambiti">'+Object.entries(AMBITI).map(([k,l])=>`<button aria-current="${S.ambito===k}" onclick="cambiaAmbito('${k}')">${l}</button>`).join('')+'</div>';
}
function vuotoAmbito(){ return S.ambito==='piscine' ? 'Al momento non ci sono disponibilità richieste per le piscine.'
  : S.ambito==='christmas' ? 'Al momento non ci sono turni del Christmas.' : 'Al momento non ci sono turni in programma.'; }

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hm(t){ return (t||'').slice(0,5); }
function nomeGiorno(d){ const [y,m,g]=d.split('-').map(Number); return new Date(y,m-1,g).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}); }
function minuti(s){ const [h,m]=hm(s).split(':').map(Number); return h*60+(m||0); }
// M = mattina, P = pomeriggio, G = tutto il giorno (inizia prima delle 13 e finisce dalle 15 in poi): stessa regola di index.html
function fasciaDi(t){ const i=hm(t.ora_inizio), f=hm(t.ora_fine); return i<'13:00' ? (f>='15:00'?'G':'M') : 'P'; }
function toast(m,err){ const t=document.getElementById('toast'); t.textContent=m; t.className=err?'err':''; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', err?5000:1800); }
function leggiIo(){ try{ return localStorage.getItem(CHIAVE_NOME); }catch(e){ return null; } }
function scriviIo(v){ try{ v ? localStorage.setItem(CHIAVE_NOME,v) : localStorage.removeItem(CHIAVE_NOME); }catch(e){} }
function messaggio(t){ document.getElementById('app').innerHTML='<header><div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Calendario</h1></div><div class="corsia"></div></header><main><div class="vuoto">'+t+'</div></main>'; }

async function avvio(){
  if(!window.supabase) return messaggio('Connessione assente: ricarica la pagina.');
  if(!/^https:\/\/.+\.supabase\.co/.test(window.SUPABASE_URL||'')) return messaggio('Configurazione mancante.');
  sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY, { auth:{ persistSession:false } });
  S.ambito=leggiAmbito();
  const salvato=leggiIo();
  if(!salvato) return formIscrizione();
  const r = await carica(salvato);
  if(!r) return messaggio('Non riesco a caricare il calendario. Riprova tra poco.');
  S.io = r.io;
  if(!S.io){ scriviIo(null); return formIscrizione(); }
  disegna();
}
// Legge i turni per il collaboratore indicato. Il database risponde solo a chi è iscritto e non manda gli id degli altri:
// ogni nome arriva con io=true/false. (Finché nel database c'è la funzione vecchia, senza parametro, si usa quella.)
async function carica(id){
  let [r, sq] = await Promise.all([sb.rpc('tp_pub_calendario', { p_collab:id }), sb.rpc('tp_pub_squadre', { p_collab:id })]);
  // squadre degli eventi con "Squadre per tutti" acceso (sql-squadre-visibili.sql); senza lo script resta vuoto
  S.squadre = sq.error ? [] : (sq.data||[]).filter(e=>(e.turni||[]).length);
  // turni di cui posso inviare gli incassi adesso (sql-incassi-calendario.sql); senza lo script resta vuoto
  const im = await sb.rpc('tp_pub_inc_miei', { p_collab:id });
  S.incMiei = {}; if(!im.error) (im.data||[]).forEach(x=>S.incMiei[x.turno_id]=x);
  if(r.error) r = await sb.rpc('tp_pub_calendario');
  if(r.error || !r.data) return null;
  S.tutti = raggruppa((r.data.turni||[]).map(t=>normalizza(t,id)));
  applicaAmbito();
  segnaVisti(id);
  return { io: r.data.io || (r.data.staff||[]).find(c=>c.id===id) || null };
}
// aprendo il calendario i turni pubblicati in cui si è in squadra risultano "visualizzati" agli organizzatori
// (nessun Accetto / Non posso: usa tp_pub_risposta con p_si = true, che segna solo la lettura)
function segnaVisti(id){
  S.tutti.filter(t=>t.mia_risposta==='attesa' && t.pubblicato && !t.annullato && (t.squadra||[]).some(x=>x.io===true||x.id===id) && oreAlTurno(t)>0)
    .forEach(t=>{ t.mia_risposta='si';
      t.ids.forEach(tid=>sb.rpc('tp_pub_risposta', { p_collab:id, p_turno:tid, p_si:true }).then(r=>{ if(r.error) console.warn(r.error); })); });
}
const sonoIo = x => x.io===true || (x.id!=null && x.id===S.io.id);

// Sedi nascoste (le piscine): niente nome né posti, solo la giornata e la fascia in cui serve disponibilità.
// Il nome arriva solo a chi è nella squadra pubblicata (deve sapere dove andare). Nessuno vede chi altro si è candidato.
// Con sql-sedi-nascoste.sql lo fa già il database (campi visibile/mio_cand); prima, la pagina nasconde da sé (visibile solo "Christmas").
const NOME_NASCOSTO='Disponibilità';
function normalizza(t,id){
  const nuova = 'visibile' in t;
  const me = x => x.io===true || (x.id!=null && x.id===id);
  const vis = nuova ? !!t.visibile : /christmas/i.test(t.piscina||'');
  const mioC = nuova ? !!t.mio_cand : (t.candidati||[]).some(me);
  const sq = t.pubblicato ? (t.squadra||[]) : [];
  const ioSq = sq.some(me);
  // con "colleghi visibili" il database manda nome e squadra anche dei turni dell'evento in cui lavorano gli altri quel giorno
  const vedo = vis || ioSq || (nuova && t.piscina!=null);
  return { ...t, visibile:vis, piscina:vedo?t.piscina:NOME_NASCOSTO, colore:vis?t.colore:null,
    candidati: mioC?[{io:true}]:[], squadra:vedo?sq:[], ids:[t.id], mieiIds:mioC?[t.id]:[] };
}
// i turni nascosti dello stesso giorno e della stessa fascia diventano una sola "disponibilità"
function raggruppa(lista){
  const out=[], gruppi={};
  // piscine: a squadra pubblicata chi non è in squadra non vede più quella disponibilità,
  // e chi è già in squadra da un'altra parte alla stessa ora non vede le disponibilità rimaste aperte
  const mieiSq=lista.filter(t=>t.pubblicato && !t.annullato && t.squadra.some(sonoIo));
  const occupato=t=>mieiSq.some(x=>x.id!==t.id && x.data===t.data && hm(x.ora_inizio)<hm(t.ora_fine) && hm(t.ora_inizio)<hm(x.ora_fine));
  lista=lista.filter(t=>t.piscina!==NOME_NASCOSTO || (!t.pubblicato && !occupato(t)));
  for(const t of lista){
    if(t.piscina!==NOME_NASCOSTO){ out.push(t); continue; }
    const k=t.data+'_'+fasciaDi(t); (gruppi[k]=gruppi[k]||[]).push(t);
  }
  for(const [k,g] of Object.entries(gruppi)){
    if(g.length===1){ out.push(g[0]); continue; }
    const validi=g.filter(t=>!t.annullato), base=validi.length?validi:g;
    out.push({ id:'g_'+k, gruppo:true, data:g[0].data, piscina:NOME_NASCOSTO, visibile:false, colore:null,
      ora_inizio:base.map(t=>hm(t.ora_inizio)).sort()[0], ora_fine:base.map(t=>hm(t.ora_fine)).sort().pop(),
      fotografi:0, stampatori:0, annullato:!validi.length, motivo:validi.length?null:g[0].motivo,
      pubblicato:validi.length>0 && validi.every(t=>t.pubblicato),
      candidati:g.some(t=>t.candidati.length)?[{io:true}]:[], squadra:[],
      ids:validi.map(t=>t.id), mieiIds:g.flatMap(t=>t.mieiIds) });
  }
  return out.sort((a,b)=>a.data.localeCompare(b.data)||hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));
}

function formIscrizione(){
  document.getElementById('app').innerHTML = `<header><div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Chi sei?</h1></div><div class="corsia"></div></header>
  <main><p class="intro">Scrivi i tuoi dati per vedere il calendario. Se ti sei già iscritto, rimetti gli stessi dati di allora: ti riconosciamo e ritrovi i tuoi turni.</p>
  <form class="iscr" id="fIscr" onsubmit="inviaIscrizione(event)">
    <label class="campo"><span>Nome e cognome</span><input name="nome" autocomplete="name" required maxlength="80"></label>
    <label class="campo"><span>Telefono</span><input name="telefono" type="tel" autocomplete="tel" required></label>
    <label class="campo"><span>Email</span><input name="email" type="email" autocomplete="email" required maxlength="120"></label>
    <div class="campo"><span>Cosa fai</span><div class="scelte">
      <label><input type="radio" name="ruolo" value="F" required>Foto</label>
      <label><input type="radio" name="ruolo" value="S">Stampa</label>
      <label><input type="radio" name="ruolo" value="FS">Entrambi</label></div></div>
    <div class="campo"><span>Hai la macchina?</span><div class="scelte">
      <label><input type="radio" name="auto" value="1" required>Sì</label>
      <label><input type="radio" name="auto" value="0">No</label></div></div>
    <p class="privacy">Telefono ed email li vedono solo gli organizzatori di Frame About You e servono solo a organizzare i turni. Gli altri collaboratori vedono soltanto il tuo nome.</p>
    <button class="btnpri" type="submit">Entra</button>
  </form></main>`;
}
async function inviaIscrizione(ev){
  ev.preventDefault(); const f=ev.target, b=f.querySelector('button[type=submit]');
  b.disabled=true; b.textContent='Invio…';
  const { data, error } = await sb.rpc('tp_pub_iscrivi', { p_nome:f.nome.value, p_telefono:f.telefono.value, p_email:f.email.value,
    p_ruolo:f.ruolo.value, p_auto:f.auto.value==='1' });
  if(error){ b.disabled=false; b.textContent='Entra'; toast(error.message||'Non riesco a iscriverti, riprova.',true); return; }
  S.io={ id:data.id, nome:data.nome };
  if(!await carica(data.id)){ S.io=null; b.disabled=false; b.textContent='Entra'; toast('Non riesco a caricare il calendario, riprova.',true); return; }
  scriviIo(data.id);
  toast(data.esistente ? 'Bentornato, '+data.nome+'.' : 'Iscrizione fatta!');
  disegna();
}
const WA_ORG = '393351755398';   // WhatsApp di Betty per gli avvisi di ritiro
function cambiaNome(){ if(!confirm('Vuoi uscire? Per rientrare dovrai riscrivere i tuoi dati.')) return; scriviIo(null); S.io=null; formIscrizione(); }
async function ricarica(){
  if(!await carica(S.io.id)) toast('Non riesco ad aggiornare, riprova.',true);
}

function disegna(){
  document.getElementById('app').innerHTML = `<header>
    <div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Ciao ${esc(S.io.nome)}</h1><button onclick="cambiaNome()">Non sei tu?</button></div>
    <div class="seg"><button aria-current="${S.vista==='cal'}" onclick="vai('cal')">Calendario</button><button aria-current="${S.vista==='miei'||S.vista==='incassi'}" onclick="vai('miei')">I miei turni</button>${(S.squadre||[]).length||S.vista==='squadre'?`<button aria-current="${S.vista==='squadre'}" onclick="vai('squadre')">Squadre</button>`:''}<button aria-current="${S.vista==='profilo'}" onclick="vai('profilo')">Profilo</button></div>
    <div class="corsia"></div></header><main id="main"></main>`;
  S.vista==='incassi' ? vistaIncassi() : S.vista==='miei' ? vistaTurni() : S.vista==='profilo' ? vistaProfilo() : S.vista==='squadre' ? vistaSquadre() : vistaCal();
}

// ---------- PROFILO: ognuno cambia i propri dati (telefono, email, macchina, cosa fa) ----------
async function vistaProfilo(){
  const m=document.getElementById('main');
  m.innerHTML='<div class="vuoto">Carico i tuoi dati…</div>';
  const { data:p, error } = await sb.rpc('tp_pub_profilo', { p_collab:S.io.id });
  if(S.vista!=='profilo') return;
  if(error || !p){ m.innerHTML='<div class="vuoto">'+(error && /tp_pub_profilo/.test(error.message||'') ? 'Il profilo non è ancora attivo: chiedi a Betty.' : 'Non riesco a caricare i tuoi dati. Riprova tra poco.')+'</div>'; return; }
  const r=(v,l)=>`<label><input type="radio" name="ruolo" value="${v}" ${p.ruolo===v?'checked':''} required>${l}</label>`;
  const a=(v,l)=>`<label><input type="radio" name="auto" value="${v}" ${(p.auto?'1':'0')===v?'checked':''} required>${l}</label>`;
  m.innerHTML=`<form class="iscr" onsubmit="salvaProfilo(event)">
    <div class="campo"><span>Nome</span><div class="fisso">${esc(p.nome)}</div><small class="note48" style="margin:0">Se è scritto male, chiedi a Betty di correggerlo.</small></div>
    <label class="campo"><span>Telefono</span><input name="telefono" type="tel" autocomplete="tel" required value="${esc(p.telefono)}"></label>
    <label class="campo"><span>Email</span><input name="email" type="email" autocomplete="email" required maxlength="120" value="${esc(p.email)}"></label>
    <div class="campo"><span>Cosa fai</span><div class="scelte">${r('F','Foto')}${r('S','Stampa')}${r('FS','Entrambi')}</div></div>
    <div class="campo"><span>Hai la macchina?</span><div class="scelte">${a('1','Sì')}${a('0','No')}</div></div>
    <p class="privacy">Telefono ed email li vedono solo gli organizzatori di Frame About You. Se cambi “cosa fai”, vale per i prossimi turni: le squadre già fatte restano come sono.</p>
    <button class="btnpri" type="submit">Salva</button>
  </form>`;
}
async function salvaProfilo(ev){
  ev.preventDefault(); const f=ev.target, b=f.querySelector('button[type=submit]');
  b.disabled=true; b.textContent='Salvo…';
  const { error } = await sb.rpc('tp_pub_salva_profilo', { p_collab:S.io.id, p_telefono:f.telefono.value, p_email:f.email.value, p_ruolo:f.ruolo.value, p_auto:f.auto.value==='1' });
  b.disabled=false; b.textContent='Salva';
  if(error){ toast(error.message||'Non salvato, riprova.',true); return; }
  toast('Dati salvati.');
}
function vai(v){ S.vista=v; disegna(); window.scrollTo(0,0); }
function filtraSede(v){ S.sede=v; vistaTurni(); }

const mio = t => t.candidati.some(sonoIo) || t.squadra.some(sonoIo);
const inSquadra = t => t.squadra.some(sonoIo);
function oreAlTurno(t){ const [y,m,g]=t.data.split('-').map(Number); const [h,mi]=hm(t.ora_inizio).split(':').map(Number); return (new Date(y,m-1,g,h,mi)-Date.now())/3600000; }
function lunedi(d){ const [y,m,g]=d.split('-').map(Number); const x=new Date(y,m-1,g); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function titoloSettimana(l){ const e=new Date(l); e.setDate(e.getDate()+6);
  const f=(x,mese)=>x.toLocaleDateString('it-IT',mese?{day:'numeric',month:'long'}:{day:'numeric'});
  return 'Settimana dal '+f(l,l.getMonth()!==e.getMonth())+' al '+f(e,true); }
function descrTurno(t){ return t.piscina+', '+nomeGiorno(t.data)+', '+hm(t.ora_inizio)+'–'+hm(t.ora_fine); }
function linkWa(testo){ return 'https://wa.me/'+WA_ORG+'?text='+encodeURIComponent(testo); }
function posti(t){ const p=[]; if(t.fotografi) p.push(t.fotografi+' foto'); if(t.stampatori) p.push(t.stampatori+' stampa'); return p.join(' + ')||'—'; }

// niente più conferma da dare: i turni si segnano come visualizzati da soli (segnaVisti)
// ...al suo posto, in alto, l'avviso dei report incassi ancora da inviare
function avvisoConferma(){
  const da=S.tutti.filter(t=>S.incMiei?.[t.id] && !S.incMiei[t.id].inviato_il);
  if(!da.length) return '';
  return `<div class="daconf"><span>${da.length===1?'Devi ancora inviare gli incassi di <b>'+esc(da[0].piscina)+'</b>, '+nomeGiorno(da[0].data)+'.':'Devi ancora inviare gli incassi di <b>'+da.length+' turni</b>.'}</span><button onclick="${da.length===1?`apriIncassi('${da[0].id}')`:"vai('miei')"}">${da.length===1?'Inserisci incassi':'Vedi'}</button></div>`;
}

function vistaTurni(){
  const m=document.getElementById('main');
  const base = S.vista==='miei' ? S.tutti : S.turni;   // "I miei turni" mostra sempre tutto, Christmas e piscine
  const sedi=[...new Set(base.map(t=>t.piscina))].sort();
  if(S.sede && !sedi.includes(S.sede)) S.sede=null;
  let lista = base.filter(t=> !S.sede || t.piscina===S.sede);
  if(S.vista==='miei'){ const o=oggiStr(); lista=lista.filter(t=>mio(t) && (t.data>=o || S.incMiei?.[t.id])); }
  lista=[...lista].sort((x,y)=>x.data.localeCompare(y.data)||hm(x.ora_inizio).localeCompare(hm(y.ora_inizio)));
  let h = (S.vista==='miei' ? '' : tastiAmbito()) + avvisoConferma() + (S.vista==='miei'
    ? '<p class="intro">I turni da oggi in poi a cui ti sei candidato e quelli in cui sei in squadra.</p>'
    : '<p class="intro">Tocca <b>Mi candido</b> sui turni che puoi fare. La squadra la scelgono gli organizzatori e, quando è pubblicata, la trovi qui.</p>');
  if(sedi.length>1) h+='<div class="sedi"><button aria-current="'+(!S.sede)+'" onclick="filtraSede(null)">Tutte</button>'+sedi.map(n=>`<button aria-current="${S.sede===n}" onclick='filtraSede(${JSON.stringify(n).replace(/'/g,"&#39;")})'>${esc(n)}</button>`).join('')+'</div>';
  if(!lista.length){ m.innerHTML=h+'<div class="vuoto">'+(S.vista==='miei'?'Non ti sei ancora candidato a nessun turno.':vuotoAmbito())+'</div>'; return; }
  let sett=null;
  lista.forEach(t=>{
    const l=lunedi(t.data).getTime();
    if(l!==sett){ sett=l; h+=`<h3 class="sett">${titoloSettimana(new Date(l))}</h3>`; }
    h+=scheda(t);
  });
  m.innerHTML=h;
}

function scheda(t){
  const cand=t.candidati.some(sonoIo), sq=inSquadra(t);
  // libero = entro 48 ore ma solo candidato e la squadra è già pubblicata senza di lui: può togliersi da solo
  const ore=oreAlTurno(t), libero = !sq && t.pubblicato;
  let azione='';
  if(t.annullato) azione='';
  else if(ore<=0) azione=`<p class="note48">${t.data<oggiStr()?'Turno concluso.':'Turno già iniziato.'}${sq?' Eri in squadra.':''}</p>`;
  else if(!cand && !sq) azione=`<button class="btnpri" onclick="candida('${t.id}',true)">Mi candido</button>`;
  else if(ore>48 || libero) azione=`<div class="stato-io">✓ ${sq?'Sei in squadra':'Ti sei candidato'}</div>`
    + '<p class="note48">Per toglierti ritocca il turno nel Calendario.</p>';
  else azione=`<div class="stato-io">✓ ${sq?'Sei in squadra':'Ti sei candidato'}</div><p class="note48">Mancano meno di 48 ore: per ritirarti avvisa Betty.</p>
    <a class="btnwa" target="_blank" rel="noopener" href="${linkWa('Ciao Betty, sono '+S.io.nome+'. Non riesco a fare il turno '+descrTurno(t)+': puoi togliermi?')}">Scrivi a Betty su WhatsApp</a>`;
  const nomi = arr => arr.map(x=>`<span class="${sonoIo(x)?'io':''}">${esc(x.nome)}${sonoIo(x)?' (tu)':''}</span>`).join(', ');
  return `<div class="giorno ${t.annullato?'annullato':''} ${sq?'mio':''}">
    <h2>${nomeGiorno(t.data)}</h2>
    <div class="pisc"><b>${esc(t.piscina)}</b> <span class="ore">${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span>${t.annullato?`<span class="annullo">ANNULLATO${t.motivo?' · '+esc(t.motivo):''}</span>`:''}</div>
    ${t.indirizzo && sq?`<div class="indir">📍 <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.indirizzo)}">${esc(t.indirizzo)}</a></div>`:''}
    ${t.annullato||!t.visibile?'':`<div class="squadra">Servono: ${posti(t)}</div>`}
    ${!t.visibile && !sq && !t.annullato?'<div class="squadra">Serve disponibilità per questa fascia: dove e con chi lo sai quando la squadra è pubblicata.</div>':''}
    ${t.pubblicato && t.squadra.length?`<div class="squadra"><b>${t.colleghi===false?'Il tuo ruolo':sq?'Squadra':'In turno'}:</b> ${t.squadra.map(x=>`<span class="${sonoIo(x)?'io':''}"><span class="tag ${x.ruolo}">${x.ruolo==='F'?'FOTO':'STAMPA'}</span>${esc(x.nome)}${sonoIo(x)?' (tu)':''}</span>`).join(' ')}</div>`:''}
    ${azione?`<div class="az">${azione}</div>`:''}
    ${bloccoIncassi(t)}
  </div>`;
}
function bloccoIncassi(t){
  const x=S.incMiei?.[t.id]; if(!x || !inSquadra(t)) return '';
  const quando=d=>new Date(d).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  return `<div class="incbox">${x.inviato_il?`<p class="ok">✓ Incassi inviati (${quando(x.inviato_il)})</p>`:''}
    <button class="${x.inviato_il?'btnsec':'btnpri'}" style="margin-top:0" onclick="apriIncassi('${t.id}')">${x.inviato_il?'Correggi incassi':'💶 Inserisci incassi'}</button></div>`;
}

// ================= INCASSI DEL TURNO =================
// Ogni turno ha il suo report: si apre dal turno in "I miei turni" e legge/salva solo i dati di quel turno.
// Lo vede chi è in squadra come stampatore, dal giorno del turno fino a 3 giorni dopo (sql-incassi-calendario.sql).
function eur(n){ return (n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'}); }
function mostraN(n){ return n==null ? '' : String(n).replace('.',','); }
function numE(v){ v=String(v||'').trim().replace(/\s|€/g,''); if(!v) return null; if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.'); const n=Number(v); return isNaN(n)?NaN:Math.round(n*100)/100; }
function v0(x){ const n=numE(x); return (n==null||isNaN(n)) ? 0 : n; }
function apriIncassi(id){
  document.querySelectorAll('.velo.dett').forEach(x=>x.remove()); S.giorno=null;
  S.incTurno=id; S.incDati=null; S.vista='incassi'; disegna(); window.scrollTo(0,0);
}
function chiudiIncassi(){ S.incTurno=null; S.incDati=null; vai('miei'); }
async function vistaIncassi(){
  const m=document.getElementById('main'); if(!m) return;
  if(!S.incDati){
    m.innerHTML='<div class="vuoto">Carico gli incassi del turno…</div>';
    const { data, error } = await sb.rpc('tp_pub_inc_leggi', { p_collab:S.io.id, p_turno:S.incTurno });
    if(S.vista!=='incassi') return;
    if(error || !data){ m.innerHTML='<div class="vuoto">'+esc(error && /modificabili/.test(error.message||'') ? error.message : 'Non riesco a caricare gli incassi. Riprova tra poco.')+'</div><button class="btnsec" onclick="chiudiIncassi()">‹ Torna ai miei turni</button>'; return; }
    S.incDati=data;
  }
  const D=S.incDati, i=D.incasso||{};
  const [y,mm,g]=String(D.scade).split('-').map(Number);
  const scade=new Date(y,mm-1,g).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  m.innerHTML=`<div class="inc">
    <button class="btnlink" style="margin:0 0 10px;padding:0" onclick="chiudiIncassi()">‹ Torna ai miei turni</button>
    <div class="testa"><b>${esc(D.piscina)}</b><div>${nomeGiorno(D.data)}, ${hm(D.ora_inizio)}–${hm(D.ora_fine)}</div></div>
    <div class="box"><h2>Incasso</h2>
      <label class="riga"><span>Contanti</span><input class="euro" id="cash" inputmode="decimal" placeholder="0,00" value="${mostraN(i.cash)}" oninput="totIncassi()"></label>
      <label class="riga"><span>POS</span><input class="euro" id="pos" inputmode="decimal" placeholder="0,00" value="${mostraN(i.pos)}" oninput="totIncassi()"></label>
      <div class="tot"><span>Totale incasso</span><span id="tot"></span></div>
    </div>
    <div class="box"><h2>Uscite</h2>
      <label class="riga"><span>% piscina</span><input class="euro" id="perc" inputmode="decimal" placeholder="0,00" value="${mostraN(i.percentuale_piscina)}" oninput="totIncassi()"></label>
      <div id="spese" oninput="totIncassi()"></div>
      <button class="bx" onclick="aggiungiSpesa()">+ Aggiungi spesa (bar o altro)</button>
    </div>
    <div class="box"><h2>Compensi</h2>
      ${(D.squadra||[]).map(x=>`<div class="comp" data-id="${esc(x.assegnazione_id)}">
        <div class="r1"><span><span class="tag ${x.ruolo}">${x.ruolo==='F'?'FOTO':'STAMPA'}</span><b>${esc(x.nome)}</b></span>
        <input class="euro ci" inputmode="decimal" placeholder="0,00" value="${mostraN(x.importo)}" oninput="totIncassi()" aria-label="Compenso ${esc(x.nome)}"></div>
        <input class="cn" placeholder="Nota (es. macchina, trasferta, riporta attrezzatura)" value="${esc(x.nota||'')}">
      </div>`).join('') || '<p class="nota" style="margin:0">Nessuna persona in squadra.</p>'}
    </div>
    <div class="box riep"><h2>Riepilogo</h2>
      <div><span>Contanti</span><span id="r-inc"></span></div>
      <div><span>% piscina</span><span id="r-perc"></span></div>
      <div><span>Spese</span><span id="r-spese"></span></div>
      <div><span>Compensi</span><span id="r-comp"></span></div>
      <div class="netto"><span>Contanti che restano</span><span id="r-netto"></span></div>
      <p class="nota">Il POS non entra in questo conto: arriva direttamente sul conto. POS di oggi: <b id="r-pos"></b></p>
    </div>
    <button class="btnpri" id="salvaInc" onclick="inviaIncassi()">${i.inviato_il?'Invia di nuovo (corretto)':'Invia report'}</button>
    <p class="nota">${i.inviato_il?'Ultimo invio: '+new Date(i.inviato_il).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'. ':''}Il report arriva solo agli organizzatori. Puoi correggerlo e rimandarlo fino a ${scade} compreso. Scrivi solo i numeri, per esempio 120 o 12,50.</p>
  </div>`;
  (D.spese||[]).forEach(x=>aggiungiSpesa(x.descrizione, mostraN(x.importo)));
  totIncassi();
}
function aggiungiSpesa(desc,imp){
  const r=document.createElement('div'); r.className='spesa';
  r.innerHTML=`<input class="sd" placeholder="Descrizione (es. bar)" value="${esc(desc||'')}"><input class="si euro" inputmode="decimal" placeholder="0,00" value="${esc(imp||'')}"><button class="bx x" aria-label="Togli spesa" onclick="this.parentNode.remove();totIncassi()">×</button>`;
  document.getElementById('spese').appendChild(r);
  if(desc===undefined) r.querySelector('.sd').focus();
}
function totIncassi(){
  const val=id=>document.getElementById(id).value;
  const c=numE(val('cash'))||0, p=numE(val('pos'))||0;
  const inc=v0(val('cash')), perc=v0(val('perc'));
  const spese=[...document.querySelectorAll('#spese .si')].reduce((a,e)=>a+v0(e.value),0);
  const comp=[...document.querySelectorAll('.comp .ci')].reduce((a,e)=>a+v0(e.value),0);
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('tot', (isNaN(c)||isNaN(p)) ? '—' : eur(c+p));
  set('r-inc',eur(inc)); set('r-perc','− '+eur(perc)); set('r-spese','− '+eur(spese)); set('r-comp','− '+eur(comp)); set('r-netto',eur(inc-perc-spese-comp)); set('r-pos',eur(v0(val('pos'))));
}
async function inviaIncassi(){
  const val=id=>document.getElementById(id).value;
  const cash=numE(val('cash')), pos=numE(val('pos')), perc=numE(val('perc'));
  if([cash,pos,perc].some(v=>Number.isNaN(v) || (v!=null && v<0))) return toast('Controlla gli importi: scrivi solo numeri.',true);
  if(cash==null && pos==null) return toast('Scrivi almeno i contanti o il POS (anche 0).',true);
  const spese=[];
  for(const r of document.querySelectorAll('#spese .spesa')){
    const d=r.querySelector('.sd').value.trim(), v=numE(r.querySelector('.si').value);
    if(!d && v==null) continue;
    if(!d) return toast('Scrivi la descrizione della spesa.',true);
    if(v==null || Number.isNaN(v) || v<0) return toast('Controlla l\'importo della spesa "'+d+'".',true);
    spese.push({ descrizione:d, importo:v });
  }
  const compensi=[];
  for(const r of document.querySelectorAll('.comp')){
    const v=numE(r.querySelector('.ci').value), n=r.querySelector('.cn').value.trim();
    if(Number.isNaN(v) || (v!=null && v<0)) return toast('Controlla il compenso di '+r.querySelector('b').textContent+'.',true);
    compensi.push({ assegnazione_id:r.dataset.id, importo:v, nota:n });
  }
  const b=document.getElementById('salvaInc'); b.disabled=true; b.textContent='Invio…';
  const { error } = await sb.rpc('tp_pub_inc_salva', { p_collab:S.io.id, p_turno:S.incTurno, p_cash:cash, p_pos:pos, p_perc:perc, p_spese:spese, p_compensi:compensi });
  if(error){ b.disabled=false; b.textContent='Invia report'; return toast(error.message||'Non inviato, riprova.',true); }
  toast('Report inviato agli organizzatori ✓');
  await ricarica(); chiudiIncassi();
}

// ================= SQUADRE: tutti i turni degli eventi con "Squadre per tutti", con chi c'è =================
function soloMieiSquadre(v){ S.soloMieiSq=v; vistaSquadre(); }
function vistaSquadre(){
  const m=document.getElementById('main'); if(!m) return;
  const ev=S.squadre||[];
  if(!ev.length){ m.innerHTML='<div class="vuoto">Al momento non ci sono squadre da mostrare.</div>'; return; }
  const io = x => x.io===true;
  let h=`<p class="intro">Tutti i turni da oggi in poi, con la squadra di ognuno. Si aggiorna da solo quando gli organizzatori pubblicano o cambiano una squadra.</p>
    <div class="ambiti"><button aria-current="${!S.soloMieiSq}" onclick="soloMieiSquadre(false)">Tutti i giorni</button><button aria-current="${!!S.soloMieiSq}" onclick="soloMieiSquadre(true)">Solo i giorni in cui lavoro</button></div>`;
  let vuoto=true;
  ev.forEach(e=>{
    let turni=e.turni||[];
    if(S.soloMieiSq){ const giorni=new Set(turni.filter(t=>(t.squadra||[]).some(io)).map(t=>t.data)); turni=turni.filter(t=>giorni.has(t.data)); }
    if(!turni.length) return; vuoto=false;
    if(ev.length>1) h+=`<h2 style="font:700 1.15rem var(--fc);margin:16px 0 8px">${esc(e.nome)}</h2>`;
    [...new Set(turni.map(t=>t.data))].forEach(d=>{
      const tg=turni.filter(t=>t.data===d), mio=tg.some(t=>(t.squadra||[]).some(io));
      h+=`<div class="giorno ${mio?'mio':''}"><h2>${nomeGiorno(d)}</h2>`+tg.map(t=>{
        const sq=t.squadra||[];
        const chi = t.annullato ? '' : !t.pubblicato ? '<div class="squadra">Squadra non ancora pubblicata</div>'
          : sq.length ? `<div class="squadra">${sq.map(x=>`<span class="${io(x)?'io':''}"><span class="tag ${x.ruolo}">${x.ruolo==='F'?'FOTO':'STAMPA'}</span>${esc(x.nome)}${io(x)?' (tu)':''}</span>`).join(' ')}</div>`
          : '<div class="squadra">Nessuno in squadra</div>';
        return `<div style="margin:8px 0 0;padding-left:8px;border-left:4px solid ${esc(t.colore||'#818286')}${t.annullato?';opacity:.6':''}">
          <div class="pisc"><b>${esc(t.sede)}</b> <span class="ore">${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span>${t.annullato?`<span class="annullo">ANNULLATO${t.motivo?' · '+esc(t.motivo):''}</span>`:''}</div>${chi}</div>`;
      }).join('')+'</div>';
    });
  });
  if(vuoto) h+='<div class="vuoto">'+(S.soloMieiSq?'Non sei in squadra in nessun turno da oggi in poi.':'Al momento non ci sono turni.')+'</div>';
  m.innerHTML=h;
}

// ================= CALENDARIO =================
const PALETTE=['#EB0089','#1E6FD9','#E07B00','#2E9D5B','#7B3FC4','#00A3A3','#C8333A','#6B6C70'];
function coloreT(t){ if(!t.visibile) return '#818286'; if(t.colore) return t.colore; let h=0; for(const ch of String(t.piscina_id||t.piscina)) h=(h*31+ch.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
function oggiStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function aggiorna(){ if(S.vista==='profilo' || S.vista==='incassi') return; if(S.vista==='squadre') return vistaSquadre(); if(S.vista==='miei') vistaTurni(); else { vistaCal(); if(S.giorno) apriGiorno(S.giorno,true); } }
function sovrapposti(t){ if(!t) return []; return S.tutti.filter(x=>x.id!==t.id && x.data===t.data && !x.annullato && x.candidati.some(sonoIo)
  && hm(x.ora_inizio)<hm(t.ora_fine) && hm(t.ora_inizio)<hm(x.ora_fine)); }
function mesiConTurni(){ return [...new Set(S.turni.map(t=>t.data.slice(0,7)))].sort(); }
function cambiaMeseCal(n){ const [y,m]=S.mese.split('-').map(Number); const d=new Date(y,m-1+n,1); S.mese=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); vistaCal(); }

function vistaCal(){
  const m=document.getElementById('main');
  const mesi=mesiConTurni();
  if(!mesi.length){ m.innerHTML=tastiAmbito()+'<div class="vuoto">'+vuotoAmbito()+'</div>'; return; }
  if(!S.mese){ const o=oggiStr().slice(0,7); S.mese = mesi.includes(o) ? o : mesi[0]; }
  const [y,mm]=S.mese.split('-').map(Number);
  const nomeM=new Date(y,mm-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  const sedi=[]; S.turni.filter(t=>t.data.slice(0,7)===S.mese).forEach(t=>{ if(!sedi.some(x=>x.n===t.piscina)) sedi.push({n:t.piscina,c:coloreT(t)}); });
  let h=tastiAmbito()+avvisoConferma()+`<div class="mesebar"><button onclick="cambiaMeseCal(-1)" ${S.mese<=mesi[0]?'disabled':''} aria-label="Mese precedente">‹</button><h2>${nomeM}</h2><button onclick="cambiaMeseCal(1)" ${S.mese>=mesi[mesi.length-1]?'disabled':''} aria-label="Mese successivo">›</button></div>`;
  h+='<div class="legenda">'+sedi.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.n)}</span>`).join('')+'<span style="color:var(--muted)">'+['M = mattina','P = pomeriggio','G = tutto il giorno'].filter(x=>S.turni.some(t=>t.data.slice(0,7)===S.mese && fasciaDi(t)===x[0])).join(' · ')+'</span></div>';
  h+='<div class="cal">'+['L','M','M','G','V','S','D'].map(x=>`<div class="wd">${x}</div>`).join('');
  const primo=new Date(y,mm-1,1), ult=new Date(y,mm,0).getDate(), vuoti=(primo.getDay()+6)%7, oggi=oggiStr();
  for(let i=0;i<vuoti;i++) h+='<div class="gg vuoto"></div>';
  for(let g=1; g<=ult; g++){
    const d=S.mese+'-'+String(g).padStart(2,'0');
    const tg=S.turni.filter(t=>t.data===d).sort((a,b)=>a.piscina.localeCompare(b.piscina)||hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));
    const mostra=tg.length>4?tg.slice(0,3):tg;
    h+=`<div class="gg ${tg.length?'':'off'} ${d===oggi?'oggi':''}"><button class="num" onclick="apriGiorno('${d}')" ${tg.length?'':'disabled'}>${g}</button><div class="pills">`
      + mostra.map(t=>{ const si=mio(t), sq=inSquadra(t), pass=!t.annullato && oreAlTurno(t)<=0;
          const lett=fasciaDi(t);
          return `<button class="pill ${t.annullato?'ann':''} ${pass?'pass':''} ${si?'si':''}" style="--c:${coloreT(t)}" title="${esc(t.piscina)} ${hm(t.ora_inizio)}–${hm(t.ora_fine)}" onclick="tocco('${t.id}')">${sq?'★':si?'✓':lett}</button>`; }).join('')
      + (tg.length>4?`<button class="pill piu" onclick="apriGiorno('${d}')">+${tg.length-3}</button>`:'')
      + '</div></div>';
  }
  h+='</div><button class="btnblocco" onclick="formBlocco()">Candidati a più giorni</button>'
    +'<p class="intro" style="margin-top:8px;font-size:.88rem">Tocca M, P o G per candidarti (diventa pieno ✓), ritocca per toglierti. Tocca il numero del giorno per vedere orari e squadra. ★ = sei in squadra.</p>';
  m.innerHTML=h;
}

async function tocco(id){
  const t=S.turni.find(x=>x.id===id);
  if(t.annullato){ toast('Turno annullato'+(t.motivo?' ('+t.motivo+')':'')+'.'); return; }
  if(oreAlTurno(t)<=0){ toast(t.data<oggiStr()?'Turno concluso.':'Turno già iniziato.'); return; }
  if(!mio(t)) return candida(id,true);
  if(oreAlTurno(t)<=48 && !(t.pubblicato && !inSquadra(t))) return apriGiorno(t.data);   // meno di 48 ore: nel dettaglio c'è il messaggio per Betty
  return candida(id,false,!inSquadra(t));   // chi è già in squadra conferma prima di togliersi, poi avvisa Betty
}

function apriGiorno(d,riapri){
  S.giorno=d;
  document.querySelectorAll('.velo.dett').forEach(x=>x.remove());
  const tg=S.turni.filter(t=>t.data===d).sort((a,b)=>a.piscina.localeCompare(b.piscina)||hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));
  const v=document.createElement('div'); v.className='velo dett';
  v.onclick=e=>{ if(e.target===v){ v.remove(); S.giorno=null; } };
  v.innerHTML=`<div class="box foglio"><h2 style="text-transform:capitalize">${nomeGiorno(d)}</h2>${tg.map(t=>scheda(t).replace('<div class="giorno', `<div style="border-left:6px solid ${coloreT(t)}" class="giorno`)).join('')}<button class="btnsec" onclick="this.closest('.velo').remove();S.giorno=null">Chiudi</button></div>`;
  document.body.appendChild(v);
}

function formBlocco(){
  const [y,mm]=S.mese.split('-').map(Number);
  const da=[S.mese+'-01',oggiStr()].sort()[1], a=S.mese+'-'+String(new Date(y,mm,0).getDate()).padStart(2,'0');
  const sedi=[...new Set(S.turni.map(t=>t.piscina))].sort();
  const v=document.createElement('div'); v.className='velo dett';
  v.innerHTML=`<form class="box foglio blocco" onsubmit="inviaBlocco(event)"><h2>Candidati a più giorni</h2>
    <label>Sede<select name="sede">${sedi.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label>
    <label>Giorni<select name="giorni"><option value="tutti">Tutti i giorni</option><option value="we">Sabati e domeniche</option><option value="fer">Dal lunedì al venerdì</option></select></label>
    <label>Fasce<select name="fasce"><option value="MPG">Tutti i turni</option><option value="M">Solo mattina</option><option value="P">Solo pomeriggio</option><option value="G">Solo tutto il giorno</option></select></label>
    <div class="dueb"><label>Dal<input type="date" name="da" value="${da}"></label><label>Al<input type="date" name="a" value="${a}"></label></div>
    <button class="btnpri" type="submit">Continua</button>
    <button class="btnsec" type="button" onclick="this.closest('.velo').remove()">Annulla</button></form>`;
  document.body.appendChild(v);
}
async function inviaBlocco(ev){
  ev.preventDefault(); const f=ev.target;
  const giorni=f.giorni.value, fasce=f.fasce.value, oggi=oggiStr();
  const scelti=S.turni.filter(t=>{
    if(t.piscina!==f.sede.value || t.annullato || t.data<oggi || t.data<f.da.value || t.data>f.a.value || mio(t)) return false;
    const [y,m,g]=t.data.split('-').map(Number); const wd=new Date(y,m-1,g).getDay(); const we=wd===0||wd===6;
    if(giorni==='we' && !we) return false; if(giorni==='fer' && we) return false;
    return fasce.includes(fasciaDi(t));
  });
  if(!scelti.length){ toast('Nessun turno nuovo con queste scelte.',true); return; }
  const descr={tutti:'tutti i giorni',we:'sabati e domeniche',fer:'dal lunedì al venerdì'}[giorni]+', '+{MPG:'tutti i turni',M:'solo mattina',P:'solo pomeriggio',G:'solo tutto il giorno'}[fasce];
  if(!confirm('Ti candidi a '+scelti.length+' turni di '+f.sede.value+' ('+descr+'). Confermi?')) return;
  const { error } = await sb.rpc('tp_pub_candida_molti', { p_collab:S.io.id, p_turni:scelti.flatMap(t=>t.ids) });
  if(error){ toast(error.message||'Non salvato, riprova.',true); return; }
  f.closest('.velo').remove(); await ricarica(); aggiorna();
  toast('Candidature inviate: '+scelti.length+'.');
}

async function candida(id,si,veloce){
  const t=S.turni.find(x=>x.id===id);
  if(!si && !veloce && !confirm('Vuoi ritirarti dal turno '+descrTurno(t)+'?')) return;
  // una "disponibilità" raggruppata vale per tutti i turni nascosti di quella giornata e fascia
  let data=null, error=null;
  if(si && t.ids.length>1) ({ error } = await sb.rpc('tp_pub_candida_molti', { p_collab:S.io.id, p_turni:t.ids }));
  else for(const tid of (si ? t.ids : t.mieiIds)){
    const r = await sb.rpc('tp_pub_candidatura', { p_collab:S.io.id, p_turno:tid, p_si:si });
    if(r.error){ error=r.error; break; }
    if(r.data && r.data.era_in_squadra) data={ era_in_squadra:true };
  }
  if(error){ toast(error.message||'Non salvato, riprova.',true); await ricarica(); aggiorna(); return; }
  const y=window.scrollY; await ricarica(); aggiorna(); window.scrollTo(0,y);
  if(si){ const s=sovrapposti(S.turni.find(x=>x.id===id)); if(s.length){ toast('Attenzione: sei candidato anche a '+s.map(x=>x.piscina+' '+hm(x.ora_inizio)+'–'+hm(x.ora_fine)).join(', ')+' alla stessa ora.',true); return; } }
  if(si) toast('Candidatura inviata.');
  else if(data && data.era_in_squadra) avvisoRitiro(t);
  else toast('Candidatura ritirata.');
}
function avvisoRitiro(t){
  const d=document.createElement('div'); d.className='velo';
  d.innerHTML=`<div class="box"><h2>Avvisa Betty</h2><p>Eri già in squadra per <b>${esc(descrTurno(t))}</b>. Il posto ora è scoperto: manda un messaggio a Betty così può sostituirti.</p>
    <a class="btnwa" target="_blank" rel="noopener" href="${linkWa('Ciao Betty, sono '+S.io.nome+'. Mi sono ritirato/a dal turno '+descrTurno(t)+'.')}">Avvisa su WhatsApp</a>
    <button class="btnsec" onclick="this.closest('.velo').remove()">Chiudi</button></div>`;
  document.body.appendChild(d);
}

// tornando sulla pagina (es. dopo aver usato altre app) rilegge i turni, così si vede subito la squadra pubblicata
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState!=='visible' || !sb || !S.io || document.querySelector('.velo')) return;
  const y=window.scrollY; await ricarica(); aggiorna(); window.scrollTo(0,y);
});

// dal telefono: scorrendo col dito a sinistra/destra si passa al mese dopo/prima (usa gli stessi tasti ‹ ›)
(()=>{
  let x0=null, y0=0, t0=0;
  document.addEventListener('touchstart', e=>{
    x0=null;
    if(e.touches.length!==1 || document.querySelector('.velo')) return;
    for(let el=e.target; el && el!==document.body; el=el.parentElement){
      if(el.matches('input,textarea,select')) return;
      if(el.scrollWidth>el.clientWidth+2 && /auto|scroll/.test(getComputedStyle(el).overflowX)) return;
    }
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now();
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Date.now()-t0>700 || Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    const b=document.querySelector(`button[aria-label="${dx<0?'Mese successivo':'Mese precedente'}"]`);
    if(b && !b.disabled) b.click();
  }, {passive:true});
})();

avvio();
</script>
