<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame · Calendario</title>
<link rel="icon" type="image/svg+xml" href="icona.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest-cal.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Calendario">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--tile:#F4F4F5;--card:#fff;--ink:#111111;--muted:#6B6C70;--line:#E1E1E4;--water:#EB0089;--nero:#000000;--grigio:#818286;--water-soft:#FDE6F2;--red:#C8333A;--yellow:#EB0089;--ok:#2E7D4F;
  --f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;--fc:'Jost',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tile);color:var(--ink);font:16px/1.45 var(--f)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
header{background:var(--nero);color:#fff;position:sticky;top:0;z-index:5}
.top{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font:600 1.1rem var(--fc);margin:0;flex:1;border-left:1px solid #444;padding-left:10px}
.logo{height:32px;width:auto;display:block}
.top button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:4px 10px;font-size:.85rem}
.seg{max-width:640px;margin:0 auto;display:flex;padding:0 12px}
.seg button{flex:1;background:none;border:0;color:#fff;opacity:.75;padding:10px 6px;font-weight:600;border-bottom:3px solid transparent}
.seg button[aria-current=true]{opacity:1;border-bottom-color:var(--yellow)}
.corsia{height:3px;background:var(--water)}
main{max-width:640px;margin:0 auto;padding:16px}
.intro{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.giorno{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.giorno h2{font:700 1.1rem var(--fc);margin:0 0 6px;text-transform:capitalize}
.pisc{font-size:.92rem;margin:2px 0}
.pisc b{font-weight:600}
.pisc .ore{color:var(--muted);font-variant-numeric:tabular-nums}
.fasce{display:flex;gap:8px;margin-top:10px}
.fasce button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;font-weight:600;color:var(--muted)}
.fasce button.si{border-color:var(--ok);background:#E7F3EC;color:var(--ok)}
.fasce small{display:block;font-weight:500;font-size:.78rem}
.squadra{margin-top:6px;font-size:.9rem;color:var(--muted)}
.squadra .io{color:var(--ink);font-weight:700}
.tag{display:inline-block;font:700 .72rem var(--fc);color:#fff;background:var(--water);border-radius:4px;padding:0 6px;margin-right:4px}
.tag.S{background:var(--grigio)}
.giorno.annullato{opacity:.6}
.annullo{display:inline-block;font-weight:700;font-size:.8rem;color:var(--red);margin-left:6px}
.chi{display:grid;gap:8px}
.chi button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;font-weight:600;font-size:1.05rem}
.vuoto{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}
.iscr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.campo{display:grid;gap:4px;margin-bottom:12px}
.campo>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.campo input{border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%;background:#fff}
.scelte{display:flex;gap:8px;flex-wrap:wrap}
.scelte label{flex:1;min-width:6.5em;border:2px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;font-weight:600;color:var(--muted);cursor:pointer}
.scelte input{position:absolute;opacity:0}
.scelte label:has(input:checked){border-color:var(--ok);background:#E7F3EC;color:var(--ok)}
.btnpri{width:100%;background:var(--water);color:#fff;border:0;border-radius:10px;padding:13px;font-weight:600;font-size:1.05rem}
.btnsec{width:100%;background:none;border:1px dashed var(--water);color:var(--water);border-radius:10px;padding:13px;font-weight:600;margin-top:14px}
.privacy{font-size:.82rem;color:var(--muted);margin:4px 0 14px}
.sett{font:600 .85rem var(--fc);color:var(--muted);margin:20px 0 8px;text-transform:none}
.sedi{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.sedi button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font-weight:600}
.sedi button[aria-current=true]{background:var(--water);border-color:var(--water);color:#fff}
.giorno.mio{border-color:var(--water);box-shadow:inset 4px 0 0 var(--water)}
.az{margin-top:12px}
.az .btnpri{padding:10px}
.az .btnsec{padding:10px}
.stato-io{font-weight:700;color:var(--ok)}
.note48{font-size:.88rem;color:var(--muted);margin:6px 0 8px}
.btnwa{display:block;text-align:center;background:#1F8F4E;color:#fff;border-radius:10px;padding:11px;font-weight:600;text-decoration:none}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.velo .box{background:#fff;border-radius:14px;padding:20px;max-width:420px;width:100%}
.velo h2{font:700 1.2rem var(--fc);margin:0 0 8px}
.velo p{margin:0 0 14px}
.mesebar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.mesebar h2{flex:1;text-align:center;font:700 1.15rem var(--fc);margin:0;text-transform:capitalize}
.mesebar button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:40px;height:36px;font-size:1.1rem}
.mesebar button:disabled{opacity:.3}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin:0 0 10px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:12px;border-radius:50%;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font:600 .72rem var(--fc);color:var(--muted);padding:2px 0}
.cal .gg{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:62px;padding:2px;display:flex;flex-direction:column;gap:2px}
.cal .gg.vuoto{background:transparent;border-color:transparent}
.cal .gg.off{background:#F8F8F9}
.cal .gg.oggi{border-color:var(--ink)}
.cal .num{border:0;background:none;padding:1px 2px;text-align:left;font:600 .78rem var(--fc);color:var(--ink)}
.cal .gg.off .num{color:#B5B6B9}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pill{border:2px solid var(--c);background:#fff;color:var(--c);border-radius:6px;height:22px;padding:0;font:700 .72rem var(--fc);line-height:1}
.pill.si{background:var(--c);color:#fff}
.pill.ann{border-style:dashed;opacity:.45;text-decoration:line-through}
.pill.piu{border-color:var(--line);color:var(--muted)}
.btnblocco{width:100%;background:var(--card);border:1px solid var(--water);color:var(--water);border-radius:10px;padding:11px;font-weight:600;margin:12px 0 4px}
.velo .box.foglio{max-height:85vh;overflow:auto}
.velo .box .giorno{margin-bottom:8px}
.velo .box .giorno h2{display:none}
.blocco label{display:block;margin-bottom:12px}
.blocco select,.blocco input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;background:#fff;margin-top:4px}
.blocco .dueb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.blocco .dueb label,.blocco .dueb input{min-width:0}
.blocco input[type=date]{font-size:.92rem;padding:9px 6px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:92vw}
#toast.err{background:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const CHIAVE_NOME = 'frame_turni_io';
let sb=null; const S={ staff:[], turni:[], io:null, vista:'cal', sede:null, mese:null, giorno:null };

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hm(t){ return (t||'').slice(0,5); }
function nomeGiorno(d){ const [y,m,g]=d.split('-').map(Number); return new Date(y,m-1,g).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}); }
function minuti(s){ const [h,m]=hm(s).split(':').map(Number); return h*60+(m||0); }
function toast(m,err){ const t=document.getElementById('toast'); t.textContent=m; t.className=err?'err':''; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', err?5000:1800); }
function leggiIo(){ try{ return localStorage.getItem(CHIAVE_NOME); }catch(e){ return null; } }
function scriviIo(v){ try{ v ? localStorage.setItem(CHIAVE_NOME,v) : localStorage.removeItem(CHIAVE_NOME); }catch(e){} }
function messaggio(t){ document.getElementById('app').innerHTML='<header><div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Calendario</h1></div><div class="corsia"></div></header><main><div class="vuoto">'+t+'</div></main>'; }

async function avvio(){
  if(!window.supabase) return messaggio('Connessione assente: ricarica la pagina.');
  if(!/^https:\/\/.+\.supabase\.co/.test(window.SUPABASE_URL||'')) return messaggio('Configurazione mancante.');
  sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY, { auth:{ persistSession:false } });
  const { data, error } = await sb.rpc('tp_pub_calendario');
  if(error) return messaggio('Non riesco a caricare il calendario. Riprova tra poco.');
  S.staff=data.staff||[]; S.turni=data.turni||[];
  const salvato=leggiIo();
  S.io = S.staff.find(c=>c.id===salvato) || null;
  if(!S.io) return sceltaNome();
  disegna();
}

function sceltaNome(){
  document.getElementById('app').innerHTML = `<header><div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Chi sei?</h1></div><div class="corsia"></div></header>
  <main><p class="intro">Tocca il tuo nome. Questo telefono se lo ricorderà.</p>
  <div class="chi">${S.staff.map(c=>`<button onclick="scegli('${c.id}')">${esc(c.nome)}</button>`).join('') || '<div class="vuoto">Ancora nessuno in elenco: iscriviti tu per primo.</div>'}</div>
  <button class="btnsec" onclick="formIscrizione()">Non sei in elenco? Iscriviti</button></main>`;
}
function formIscrizione(){
  document.getElementById('app').innerHTML = `<header><div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Iscriviti</h1><button onclick="sceltaNome()">Indietro</button></div><div class="corsia"></div></header>
  <main><form class="iscr" id="fIscr" onsubmit="inviaIscrizione(event)">
    <label class="campo"><span>Nome e cognome</span><input name="nome" autocomplete="name" required maxlength="80"></label>
    <label class="campo"><span>Telefono</span><input name="telefono" type="tel" autocomplete="tel" required></label>
    <label class="campo"><span>Email</span><input name="email" type="email" autocomplete="email" required maxlength="120"></label>
    <div class="campo"><span>Cosa fai</span><div class="scelte">
      <label><input type="radio" name="ruolo" value="F" required>Foto</label>
      <label><input type="radio" name="ruolo" value="S">Stampa</label>
      <label><input type="radio" name="ruolo" value="FS">Entrambi</label></div></div>
    <div class="campo"><span>Hai la macchina?</span><div class="scelte">
      <label><input type="radio" name="auto" value="1" required>Sì</label>
      <label><input type="radio" name="auto" value="0">No</label></div></div>
    <p class="privacy">Telefono ed email li vedono solo gli organizzatori di Frame About You e servono solo a organizzare i turni. Gli altri collaboratori vedono soltanto il tuo nome.</p>
    <button class="btnpri" type="submit">Iscriviti</button>
  </form></main>`;
}
async function inviaIscrizione(ev){
  ev.preventDefault(); const f=ev.target, b=f.querySelector('button[type=submit]');
  b.disabled=true; b.textContent='Invio…';
  const { data, error } = await sb.rpc('tp_pub_iscrivi', { p_nome:f.nome.value, p_telefono:f.telefono.value, p_email:f.email.value,
    p_ruolo:f.ruolo.value, p_auto:f.auto.value==='1' });
  if(error){ b.disabled=false; b.textContent='Iscriviti'; toast(error.message||'Non riesco a iscriverti, riprova.',true); return; }
  if(!S.staff.some(c=>c.id===data.id)) S.staff.push({ id:data.id, nome:data.nome });
  toast(data.esistente ? 'Eri già in elenco come '+data.nome+'.' : 'Iscrizione fatta!');
  await scegli(data.id);
}
const WA_ORG = '393351755398';   // WhatsApp di Betty per gli avvisi di ritiro
async function scegli(id){ S.io=S.staff.find(c=>c.id===id); scriviIo(id); disegna(); }
function cambiaNome(){ scriviIo(null); S.io=null; sceltaNome(); }
async function ricarica(){
  const { data, error } = await sb.rpc('tp_pub_calendario');
  if(error){ toast('Non riesco ad aggiornare, riprova.',true); return; }
  S.staff=data.staff||[]; S.turni=data.turni||[];
}

function disegna(){
  document.getElementById('app').innerHTML = `<header>
    <div class="top"><img class="logo" src="logo-bianco.png" alt="Frame About You"><h1>Ciao ${esc(S.io.nome)}</h1><button onclick="cambiaNome()">Non sei tu?</button></div>
    <div class="seg"><button aria-current="${S.vista!=='miei'}" onclick="vai('cal')">Calendario</button><button aria-current="${S.vista==='miei'}" onclick="vai('miei')">I miei turni</button></div>
    <div class="corsia"></div></header><main id="main"></main>`;
  S.vista==='miei' ? vistaTurni() : vistaCal();
}
function vai(v){ S.vista=v; disegna(); window.scrollTo(0,0); }
function filtraSede(v){ S.sede=v; vistaTurni(); }

const mio = t => t.candidati.some(x=>x.id===S.io.id) || t.squadra.some(x=>x.id===S.io.id);
const inSquadra = t => t.squadra.some(x=>x.id===S.io.id);
function oreAlTurno(t){ const [y,m,g]=t.data.split('-').map(Number); const [h,mi]=hm(t.ora_inizio).split(':').map(Number); return (new Date(y,m-1,g,h,mi)-Date.now())/3600000; }
function lunedi(d){ const [y,m,g]=d.split('-').map(Number); const x=new Date(y,m-1,g); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function titoloSettimana(l){ const e=new Date(l); e.setDate(e.getDate()+6);
  const f=(x,mese)=>x.toLocaleDateString('it-IT',mese?{day:'numeric',month:'long'}:{day:'numeric'});
  return 'Settimana dal '+f(l,l.getMonth()!==e.getMonth())+' al '+f(e,true); }
function descrTurno(t){ return t.piscina+', '+nomeGiorno(t.data)+', '+hm(t.ora_inizio)+'–'+hm(t.ora_fine); }
function linkWa(testo){ return 'https://wa.me/'+WA_ORG+'?text='+encodeURIComponent(testo); }
function posti(t){ const p=[]; if(t.fotografi) p.push(t.fotografi+' foto'); if(t.stampatori) p.push(t.stampatori+' stampa'); return p.join(' + ')||'—'; }

function vistaTurni(){
  const m=document.getElementById('main');
  const sedi=[...new Set(S.turni.map(t=>t.piscina))].sort();
  if(S.sede && !sedi.includes(S.sede)) S.sede=null;
  let lista = S.turni.filter(t=> !S.sede || t.piscina===S.sede);
  if(S.vista==='miei') lista=lista.filter(mio);
  lista=[...lista].sort((x,y)=>x.data.localeCompare(y.data)||hm(x.ora_inizio).localeCompare(hm(y.ora_inizio)));
  let h = S.vista==='miei'
    ? '<p class="intro">I turni a cui ti sei candidato e quelli in cui sei in squadra.</p>'
    : '<p class="intro">Tocca <b>Mi candido</b> sui turni che puoi fare. Ci si può candidare anche se ci sono già altri: la squadra la scelgono gli organizzatori e, quando è pubblicata, la trovi qui.</p>';
  if(sedi.length>1) h+='<div class="sedi"><button aria-current="'+(!S.sede)+'" onclick="filtraSede(null)">Tutte</button>'+sedi.map(n=>`<button aria-current="${S.sede===n}" onclick='filtraSede(${JSON.stringify(n).replace(/'/g,"&#39;")})'>${esc(n)}</button>`).join('')+'</div>';
  if(!lista.length){ m.innerHTML=h+'<div class="vuoto">'+(S.vista==='miei'?'Non ti sei ancora candidato a nessun turno.':'Al momento non ci sono turni in programma.')+'</div>'; return; }
  let sett=null;
  lista.forEach(t=>{
    const l=lunedi(t.data).getTime();
    if(l!==sett){ sett=l; h+=`<h3 class="sett">${titoloSettimana(new Date(l))}</h3>`; }
    h+=scheda(t);
  });
  m.innerHTML=h;
}

function scheda(t){
  const io=S.io.id, cand=t.candidati.some(x=>x.id===io), sq=inSquadra(t);
  let azione='';
  if(t.annullato) azione='';
  else if(!cand && !sq) azione=`<button class="btnpri" onclick="candida('${t.id}',true)">Mi candido</button>`;
  else if(oreAlTurno(t)>48) azione=`<div class="stato-io">✓ ${sq?'Sei in squadra':'Ti sei candidato'}</div><button class="btnsec" style="margin-top:8px" onclick="candida('${t.id}',false)">Ritirati</button>`;
  else azione=`<div class="stato-io">✓ ${sq?'Sei in squadra':'Ti sei candidato'}</div><p class="note48">Mancano meno di 48 ore: per ritirarti avvisa Betty.</p>
    <a class="btnwa" target="_blank" rel="noopener" href="${linkWa('Ciao Betty, sono '+S.io.nome+'. Non riesco a fare il turno '+descrTurno(t)+': puoi togliermi?')}">Scrivi a Betty su WhatsApp</a>`;
  const nomi = arr => arr.map(x=>`<span class="${x.id===io?'io':''}">${esc(x.nome)}${x.id===io?' (tu)':''}</span>`).join(', ');
  return `<div class="giorno ${t.annullato?'annullato':''} ${sq?'mio':''}">
    <h2>${nomeGiorno(t.data)}</h2>
    <div class="pisc"><b>${esc(t.piscina)}</b> <span class="ore">${hm(t.ora_inizio)}–${hm(t.ora_fine)}</span>${t.annullato?`<span class="annullo">ANNULLATO${t.motivo?' · '+esc(t.motivo):''}</span>`:''}</div>
    ${t.annullato?'':`<div class="squadra">Servono: ${posti(t)}</div>`}
    ${t.pubblicato && t.squadra.length?`<div class="squadra"><b>Squadra:</b> ${t.squadra.map(x=>`<span class="${x.id===io?'io':''}"><span class="tag ${x.ruolo}">${x.ruolo==='F'?'FOTO':'STAMPA'}</span>${esc(x.nome)}${x.id===io?' (tu)':''}</span>`).join(' ')}</div>`:''}
    ${t.annullato?'':`<div class="squadra">${t.candidati.length?`<b>Candidati (${t.candidati.length}):</b> ${nomi(t.candidati)}`:'Ancora nessun candidato'}</div>`}
    ${azione?`<div class="az">${azione}</div>`:''}
  </div>`;
}

// ================= CALENDARIO =================
const PALETTE=['#EB0089','#1E6FD9','#E07B00','#2E9D5B','#7B3FC4','#00A3A3','#C8333A','#6B6C70'];
function coloreT(t){ if(t.colore) return t.colore; let h=0; for(const ch of String(t.piscina_id||t.piscina)) h=(h*31+ch.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
function oggiStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function aggiorna(){ if(S.vista==='miei') vistaTurni(); else { vistaCal(); if(S.giorno) apriGiorno(S.giorno,true); } }
function sovrapposti(t){ if(!t) return []; return S.turni.filter(x=>x.id!==t.id && x.data===t.data && !x.annullato && x.candidati.some(c=>c.id===S.io.id)
  && hm(x.ora_inizio)<hm(t.ora_fine) && hm(t.ora_inizio)<hm(x.ora_fine)); }
function mesiConTurni(){ return [...new Set(S.turni.map(t=>t.data.slice(0,7)))].sort(); }
function cambiaMeseCal(n){ const [y,m]=S.mese.split('-').map(Number); const d=new Date(y,m-1+n,1); S.mese=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); vistaCal(); }

function vistaCal(){
  const m=document.getElementById('main');
  const mesi=mesiConTurni();
  if(!mesi.length){ m.innerHTML='<div class="vuoto">Al momento non ci sono turni in programma.</div>'; return; }
  if(!S.mese){ const o=oggiStr().slice(0,7); S.mese = mesi.includes(o) ? o : mesi[0]; }
  const [y,mm]=S.mese.split('-').map(Number);
  const nomeM=new Date(y,mm-1,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  const sedi=[]; S.turni.filter(t=>t.data.slice(0,7)===S.mese).forEach(t=>{ if(!sedi.some(x=>x.n===t.piscina)) sedi.push({n:t.piscina,c:coloreT(t)}); });
  let h=`<div class="mesebar"><button onclick="cambiaMeseCal(-1)" ${S.mese<=mesi[0]?'disabled':''} aria-label="Mese precedente">‹</button><h2>${nomeM}</h2><button onclick="cambiaMeseCal(1)" ${S.mese>=mesi[mesi.length-1]?'disabled':''} aria-label="Mese successivo">›</button></div>`;
  h+='<div class="legenda">'+sedi.map(x=>`<span><i style="background:${x.c}"></i>${esc(x.n)}</span>`).join('')+'<span style="color:var(--muted)">M = mattina · P = pomeriggio</span></div>';
  h+='<div class="cal">'+['L','M','M','G','V','S','D'].map(x=>`<div class="wd">${x}</div>`).join('');
  const primo=new Date(y,mm-1,1), ult=new Date(y,mm,0).getDate(), vuoti=(primo.getDay()+6)%7, oggi=oggiStr();
  for(let i=0;i<vuoti;i++) h+='<div class="gg vuoto"></div>';
  for(let g=1; g<=ult; g++){
    const d=S.mese+'-'+String(g).padStart(2,'0');
    const tg=S.turni.filter(t=>t.data===d).sort((a,b)=>a.piscina.localeCompare(b.piscina)||hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));
    const mostra=tg.length>4?tg.slice(0,3):tg;
    h+=`<div class="gg ${tg.length?'':'off'} ${d===oggi?'oggi':''}"><button class="num" onclick="apriGiorno('${d}')" ${tg.length?'':'disabled'}>${g}</button><div class="pills">`
      + mostra.map(t=>{ const si=mio(t), sq=inSquadra(t);
          const lett=hm(t.ora_inizio)<'13:00'?'M':'P';
          return `<button class="pill ${t.annullato?'ann':''} ${si?'si':''}" style="--c:${coloreT(t)}" title="${esc(t.piscina)} ${hm(t.ora_inizio)}–${hm(t.ora_fine)}" onclick="tocco('${t.id}')">${sq?'★':si?'✓':lett}</button>`; }).join('')
      + (tg.length>4?`<button class="pill piu" onclick="apriGiorno('${d}')">+${tg.length-3}</button>`:'')
      + '</div></div>';
  }
  h+='</div><button class="btnblocco" onclick="formBlocco()">Candidati a più giorni</button>'
    +'<p class="intro" style="margin-top:8px;font-size:.88rem">Tocca M o P per candidarti (diventa pieno ✓), ritocca per toglierti. Tocca il numero del giorno per vedere orari, candidati e squadra. ★ = sei in squadra.</p>';
  m.innerHTML=h;
}

async function tocco(id){
  const t=S.turni.find(x=>x.id===id);
  if(t.annullato){ toast('Turno annullato'+(t.motivo?' ('+t.motivo+')':'')+'.'); return; }
  if(!mio(t)) return candida(id,true);
  if(oreAlTurno(t)<=48 || inSquadra(t)) return apriGiorno(t.data);   // ritiro con avviso: si passa dal dettaglio
  return candida(id,false,true);
}

function apriGiorno(d,riapri){
  S.giorno=d;
  document.querySelectorAll('.velo.dett').forEach(x=>x.remove());
  const tg=S.turni.filter(t=>t.data===d).sort((a,b)=>a.piscina.localeCompare(b.piscina)||hm(a.ora_inizio).localeCompare(hm(b.ora_inizio)));
  const v=document.createElement('div'); v.className='velo dett';
  v.onclick=e=>{ if(e.target===v){ v.remove(); S.giorno=null; } };
  v.innerHTML=`<div class="box foglio"><h2 style="text-transform:capitalize">${nomeGiorno(d)}</h2>${tg.map(t=>scheda(t).replace('<div class="giorno', `<div style="border-left:6px solid ${coloreT(t)}" class="giorno`)).join('')}<button class="btnsec" onclick="this.closest('.velo').remove();S.giorno=null">Chiudi</button></div>`;
  document.body.appendChild(v);
}

function formBlocco(){
  const [y,mm]=S.mese.split('-').map(Number);
  const da=[S.mese+'-01',oggiStr()].sort()[1], a=S.mese+'-'+String(new Date(y,mm,0).getDate()).padStart(2,'0');
  const sedi=[...new Set(S.turni.map(t=>t.piscina))].sort();
  const v=document.createElement('div'); v.className='velo dett';
  v.innerHTML=`<form class="box foglio blocco" onsubmit="inviaBlocco(event)"><h2>Candidati a più giorni</h2>
    <label>Sede<select name="sede">${sedi.map(n=>`<option>${esc(n)}</option>`).join('')}</select></label>
    <label>Giorni<select name="giorni"><option value="tutti">Tutti i giorni</option><option value="we">Sabati e domeniche</option><option value="fer">Dal lunedì al venerdì</option></select></label>
    <label>Fasce<select name="fasce"><option value="MP">Mattina e pomeriggio</option><option value="M">Solo mattina</option><option value="P">Solo pomeriggio</option></select></label>
    <div class="dueb"><label>Dal<input type="date" name="da" value="${da}"></label><label>Al<input type="date" name="a" value="${a}"></label></div>
    <button class="btnpri" type="submit">Continua</button>
    <button class="btnsec" type="button" onclick="this.closest('.velo').remove()">Annulla</button></form>`;
  document.body.appendChild(v);
}
async function inviaBlocco(ev){
  ev.preventDefault(); const f=ev.target;
  const giorni=f.giorni.value, fasce=f.fasce.value, oggi=oggiStr();
  const scelti=S.turni.filter(t=>{
    if(t.piscina!==f.sede.value || t.annullato || t.data<oggi || t.data<f.da.value || t.data>f.a.value || mio(t)) return false;
    const [y,m,g]=t.data.split('-').map(Number); const wd=new Date(y,m-1,g).getDay(); const we=wd===0||wd===6;
    if(giorni==='we' && !we) return false; if(giorni==='fer' && we) return false;
    return fasce.includes(hm(t.ora_inizio)<'13:00'?'M':'P');
  });
  if(!scelti.length){ toast('Nessun turno nuovo con queste scelte.',true); return; }
  const descr={tutti:'tutti i giorni',we:'sabati e domeniche',fer:'dal lunedì al venerdì'}[giorni]+', '+{MP:'mattina e pomeriggio',M:'solo mattina',P:'solo pomeriggio'}[fasce];
  if(!confirm('Ti candidi a '+scelti.length+' turni di '+f.sede.value+' ('+descr+'). Confermi?')) return;
  const { data, error } = await sb.rpc('tp_pub_candida_molti', { p_collab:S.io.id, p_turni:scelti.map(t=>t.id) });
  if(error){ toast(error.message||'Non salvato, riprova.',true); return; }
  f.closest('.velo').remove(); await ricarica(); aggiorna();
  toast('Candidature inviate: '+data+'.');
}

async function candida(id,si,veloce){
  const t=S.turni.find(x=>x.id===id);
  if(!si && !veloce && !confirm('Vuoi ritirarti dal turno '+descrTurno(t)+'?')) return;
  const { data, error } = await sb.rpc('tp_pub_candidatura', { p_collab:S.io.id, p_turno:id, p_si:si });
  if(error){ toast(error.message||'Non salvato, riprova.',true); await ricarica(); aggiorna(); return; }
  const y=window.scrollY; await ricarica(); aggiorna(); window.scrollTo(0,y);
  if(si){ const s=sovrapposti(S.turni.find(x=>x.id===id)); if(s.length){ toast('Attenzione: sei candidato anche a '+s.map(x=>x.piscina+' '+hm(x.ora_inizio)+'–'+hm(x.ora_fine)).join(', ')+' alla stessa ora.',true); return; } }
  if(si) toast('Candidatura inviata.');
  else if(data && data.era_in_squadra) avvisoRitiro(t);
  else toast('Candidatura ritirata.');
}
function avvisoRitiro(t){
  const d=document.createElement('div'); d.className='velo';
  d.innerHTML=`<div class="box"><h2>Avvisa Betty</h2><p>Eri già in squadra per <b>${esc(descrTurno(t))}</b>. Il posto ora è scoperto: manda un messaggio a Betty così può sostituirti.</p>
    <a class="btnwa" target="_blank" rel="noopener" href="${linkWa('Ciao Betty, sono '+S.io.nome+'. Mi sono ritirato/a dal turno '+descrTurno(t)+'.')}">Avvisa su WhatsApp</a>
    <button class="btnsec" onclick="this.closest('.velo').remove()">Chiudi</button></div>`;
  document.body.appendChild(d);
}

avvio();
</script>
